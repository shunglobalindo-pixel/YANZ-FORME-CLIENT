  // ── CONFIRM IMPORT (owner=confirmed+cash; staff=draft) ──
  async function confirmImport(){
    if(!parsedData)return;
    const accId=document.getElementById('imp-account').value;
    const settledDate=document.getElementById('imp-settled-date').value;
    const importNotes=document.getElementById('imp-notes').value;
    const st=document.getElementById('import-status');
    if(!accId){st.textContent='⚠️ Pilih cash account dulu';st.style.color='#D97706';return;}
    if(!settledDate){st.textContent='⚠️ Pilih tanggal settlement';st.style.color='#D97706';return;}
    const isDraft=(ROLE==='staff');
    st.textContent=isDraft?'Submitting draft…':'Importing…';st.style.color='#999';
    try{
      const {platform,fileName,records,matched,unmatched,pending,totalNSA,totalGross}=parsedData;
      const matchedNSA=matched.reduce((s,r)=>s+num(r.nsa_amount),0);
      const submitterName=isDraft?(CURRENT_STAFF?.staff_name||window.YANZ.fullName||'staff'):'owner';
      const settPayload={
        platform,file_name:fileName,total_rows_in_file:records.length,
        total_matched:matched.length,total_unmatched:unmatched.length,total_pending_review:pending.length,
        total_nsa_amount:totalNSA,total_gross_amount:totalGross,cash_account_id:accId,
        applied_to_cashflow:!isDraft,notes:importNotes||null,period_to:settledDate,
        status:isDraft?'draft':'confirmed',submitted_by:submitterName,submitted_at:new Date().toISOString()
      };
      if(!isDraft){settPayload.confirmed_by='owner';settPayload.confirmed_at=new Date().toISOString();}
      const settR=await api('yanz_marketplace_settlements',{method:'POST',headers:{'Prefer':'return=representation'},body:JSON.stringify(settPayload)});
      const settlementId=settR[0].id;
      const allRecords=[...matched,...pending,...unmatched];
      for(const r of allRecords){
        try{
          const nsaR=await api('yanz_order_nsa',{method:'POST',headers:{'Prefer':'return=representation'},body:JSON.stringify({
            settlement_id:settlementId,order_ref:r.order_ref,platform:r.platform,
            order_item_id:r.matched_items?r.matched_items[0]:null,match_status:r.match_status,
            gross_revenue:r.gross_revenue||0,nsa_amount:r.nsa_amount,
            komisi_platform:r.komisi_platform,perkiraan_ongkir:r.perkiraan_ongkir,komisi_dinamis:r.komisi_dinamis,
            biaya_proses:r.biaya_proses,komisi_affiliator:r.komisi_affiliator,
            gratis_ongkir_xtra:r.gratis_ongkir_xtra||0,voucher_seller:r.voucher_seller||0,
            total_marketplace_costs:r.total_marketplace_costs,
            settled_date:settledDate,review_notes:r.review_reason||null
          })});
          if(!isDraft && r.match_status==='matched' && r.matched_items){
            for(const itemId of r.matched_items){
              await api('yanz_order_items?id=eq.'+itemId,{method:'PATCH',body:JSON.stringify({nsa_status:'matched',nsa_id:nsaR[0].id})});
            }
          }
        }catch(err){console.error('Insert NSA failed for',r.order_ref,err);}
      }
      if(!isDraft){
        if(matchedNSA>0){
          await api('yanz_cash_movements',{method:'POST',body:JSON.stringify({
            account_id:accId,movement_date:settledDate,movement_type:'inflow',category:'marketplace_settlement',
            amount:matchedNSA,description:`Settlement ${platform.toUpperCase()} — ${matched.length} orders (${fileName})`,
            reference:settlementId,source_type:'settlement',source_id:settlementId
          })});
        }
        await api('yanz_activity',{method:'POST',body:JSON.stringify({icon:'💸',text:`NSA Import ${platform.toUpperCase()}: ${matched.length} matched · ${rp(matchedNSA)} masuk cashflow`,time_ago:'Baru saja',color:'#F0FDF4'})});
      }else{
        try{
          await api('yanz_notifications',{method:'POST',body:JSON.stringify({recipient_type:'owner',recipient_id:null,notif_type:'nsa_draft_submitted',task_id:null,title:`📤 NSA Draft dari ${submitterName}`,message:`${platform.toUpperCase()} settlement · ${matched.length} matched · ${rp(matchedNSA)} menunggu approval`,is_read:false})});
        }catch(err){console.warn('Notif insert failed:',err);}
      }
      const dupCount=(parsedData.duplicate||[]).length;
      const dupTxt=dupCount?` · ${dupCount} duplikat dilewati`:'';
      if(isDraft){st.textContent='✓ Draft submitted! Owner akan review.';st.style.color='#2563EB';toast(`Draft terkirim — menunggu approval owner (${matched.length} matched, ${pending.length} review, ${unmatched.length} unmatched${dupTxt})`);}
      else{st.textContent='✓ Import berhasil!';st.style.color='#16A34A';toast(`Import berhasil: ${matched.length} matched, ${pending.length} pending review, ${unmatched.length} unmatched${dupTxt}`);}
      setTimeout(()=>{cancelImport();loadAll();go(isDraft?'history':'dashboard');},1500);
    }catch(e){st.textContent='❌ '+e.message;st.style.color='#DC2626';console.error(e);}
  }

  // ── DASHBOARD ──
  function renderDashboard(){
    const confirmedIds=new Set(SETTLEMENTS.filter(s=>s.status!=='draft'&&s.status!=='rejected').map(s=>s.id));
    const confirmedNSA=NSA_RECORDS.filter(r=>confirmedIds.has(r.settlement_id));
    const liveItems=ORDER_ITEMS.filter(o=>o.livestream_session_id);
    const matched=liveItems.filter(o=>o.nsa_status==='matched');
    const pending=liveItems.filter(o=>o.nsa_status==='pending');
    const review=confirmedNSA.filter(r=>r.match_status==='unmatched'||r.match_status==='pending_review');
    const set=(id,v)=>{const e=document.getElementById(id);if(e)e.textContent=v;};
    set('d-total',liveItems.length);set('d-matched',matched.length);set('d-pending',pending.length);set('d-review',review.length);
    const totalMatchedNSA=confirmedNSA.filter(r=>r.match_status==='matched').reduce((s,r)=>s+num(r.nsa_amount),0);
    set('d-matched-sub',`Total NSA: ${rpShort(totalMatchedNSA)}`);
    const totalPendingGross=pending.reduce((s,o)=>s+num(o.qty)*num(o.sell_price),0);
    set('d-pending-sub',`Gross pending: ${rpShort(totalPendingGross)}`);
    const breakdown={komisi_platform:0,perkiraan_ongkir:0,komisi_dinamis:0,biaya_proses:0,komisi_affiliator:0,gratis_ongkir_xtra:0,voucher_seller:0};
    confirmedNSA.filter(r=>r.match_status==='matched').forEach(r=>{
      breakdown.komisi_platform+=num(r.komisi_platform);breakdown.perkiraan_ongkir+=num(r.perkiraan_ongkir);
      breakdown.komisi_dinamis+=num(r.komisi_dinamis);breakdown.biaya_proses+=num(r.biaya_proses);breakdown.komisi_affiliator+=num(r.komisi_affiliator);
      breakdown.gratis_ongkir_xtra+=num(r.gratis_ongkir_xtra);breakdown.voucher_seller+=num(r.voucher_seller);
    });
    const totalCosts=Object.values(breakdown).reduce((a,b)=>a+b,0);
    const labels={komisi_platform:'Komisi Platform',perkiraan_ongkir:'Perkiraan Ongkir',komisi_dinamis:'Komisi Dinamis',biaya_proses:'Biaya Proses Pemesanan',komisi_affiliator:'Komisi Affiliator',gratis_ongkir_xtra:'Gratis Ongkir XTRA (Program Shopee)',voucher_seller:'Pemberian Voucher (Seller)'};
    let breakdownHTML='';
    if(totalCosts===0)breakdownHTML='<div class="empty">Belum ada NSA data. Upload Excel settlement untuk mulai.</div>';
    else{
      Object.entries(breakdown).forEach(([key,amt])=>{
        const pct=amt/totalCosts*100;
        breakdownHTML+=`<div style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px"><strong>${labels[key]}</strong><span style="font-weight:700">${rp(amt)} <span style="font-size:11px;color:#888;font-weight:400">(${pct.toFixed(1)}%)</span></span></div><div style="height:6px;background:#F0EDE8;border-radius:3px;overflow:hidden"><div style="height:100%;width:${pct}%;background:#DC2626"></div></div></div>`;
      });
      breakdownHTML+=`<div style="margin-top:14px;padding:12px;background:#1C1C1A;color:#fff;border-radius:8px;display:flex;justify-content:space-between"><strong>Total Marketplace Settlement Costs</strong><strong style="color:#E8FF5A">${rp(totalCosts)}</strong></div>`;
    }
    const cb=document.getElementById('costs-breakdown');if(cb)cb.innerHTML=breakdownHTML;
    const pendingSorted=pending.sort((a,b)=>new Date(b.created_at)-new Date(a.created_at)).slice(0,10);
    const pl=document.getElementById('pending-list');if(!pl)return;
    if(!pendingSorted.length)pl.innerHTML='<div class="empty">✓ Tidak ada order pending NSA — semua sudah matched!</div>';
    else pl.innerHTML=pendingSorted.map(o=>{

  async function deleteSettlement(id){
    if(!confirm('Hapus settlement ini? Semua NSA records dan cash movement terkait akan dihapus.'))return;
    try{
      await api('yanz_cash_movements?source_id=eq.'+id,{method:'DELETE'});
      const nsas=NSA_RECORDS.filter(n=>n.settlement_id===id&&n.order_item_id);
      for(const n of nsas){await api('yanz_order_items?id=eq.'+n.order_item_id,{method:'PATCH',body:JSON.stringify({nsa_status:'pending',nsa_id:null})});}
      await api('yanz_order_nsa?settlement_id=eq.'+id,{method:'DELETE'});
      await api('yanz_marketplace_settlements?id=eq.'+id,{method:'DELETE'});
      await loadAll();toast('Settlement dihapus ✓');
    }catch(e){toast('❌ '+e.message);}
  }

    const el=document.getElementById('review-list');if(!el)return;

  function openDraftDetail(id){

    const pending=records.filter(r=>r.match_status==='pending_review');
    const unmatched=records.filter(r=>r.match_status==='unmatched');
    const matchedNSA=matched.reduce((s,r)=>s+num(r.nsa_amount),0);
    const accOpts=ACCOUNTS.map(a=>`<option value="${a.id}" ${a.id===sett.cash_account_id?'selected':''}>${a.account_name}</option>`).join('');
    const MATCHED_LIMIT=100;
    const attention=[...unmatched,...pending];
    const matchedShown=matched.slice(0,MATCHED_LIMIT);
    const hiddenMatched=matched.length-matchedShown.length;
    const rowsHTML=[...attention,...matchedShown].map(r=>{
      const cls=r.match_status==='matched'?'matched':r.match_status==='unmatched'?'unmatched':'pending';
      const label={matched:'✓ Match',unmatched:'✗ Unmatched',pending_review:'⏳ Review'}[r.match_status];
      return`<tr class="${cls}"><td><span class="status-pill sp-${cls}">${label}</span></td><td><code style="font-size:11px">${r.order_ref}</code></td><td class="num">${r.gross_revenue?rp(r.gross_revenue):'—'}</td><td class="num">${rp(r.nsa_amount)}</td></tr>`;
    }).join('');
    const html=`<div class="modal-bg" onclick="if(event.target===this)nsa.closeDraftModal()"><div class="modal" style="width:760px"><div class="modal-hd"><span>📥 Review Draft Settlement</span><button class="modal-x" onclick="nsa.closeDraftModal()">×</button></div><div style="background:#EFF6FF;border:1px solid #BFDBFE;border-radius:10px;padding:12px;margin-bottom:14px;font-size:12px"><strong>${sett.file_name}</strong> · Platform ${sett.platform.toUpperCase()} · Submitted by <strong>${sett.submitted_by}</strong>${sett.notes?`<div style="margin-top:4px;color:#666">📝 ${sett.notes}</div>`:''}</div><div class="draft-stats" style="margin-bottom:14px"><div class="draft-stat ok"><div class="v">${matched.length}</div><div class="l">Matched</div></div><div class="draft-stat warn"><div class="v">${pending.length}</div><div class="l">Review</div></div><div class="draft-stat err"><div class="v">${unmatched.length}</div><div class="l">Unmatched</div></div><div class="draft-stat"><div class="v" style="font-size:14px">${rpShort(matchedNSA)}</div><div class="l">Cash in</div></div></div><div style="max-height:280px;overflow-y:auto;margin-bottom:14px;border:1px solid #E8E6E0;border-radius:8px"><table class="preview-table"><thead><tr><th>Status</th><th>Order ID</th><th class="num">Gross</th><th class="num">NSA</th></tr></thead><tbody>${rowsHTML||'<tr><td colspan="4" style="text-align:center;padding:20px;color:#888">Tidak ada records</td></tr>'}</tbody></table>${hiddenMatched>0?`<p style="font-size:11px;color:#888;text-align:center;padding:8px">Semua ✗ Unmatched / ⏳ Review ditampilkan · ${hiddenMatched} baris ✓ Match disembunyikan (tampil ${matchedShown.length}/${matched.length})</p>`:''}</div><div class="fg2" style="margin-bottom:14px"><div class="fld"><label>Cash Account untuk Inflow</label><select id="draft-account">${accOpts}</select></div><div class="fld"><label>Tanggal Settlement</label><input type="date" id="draft-date" value="${sett.period_to||''}" /></div></div><div style="background:#FFFBEB;border:1px solid #FDE68A;border-radius:8px;padding:10px 12px;font-size:12px;color:#92400E;margin-bottom:14px">⚠️ Saat di-confirm: <strong>${rp(matchedNSA)}</strong> akan masuk cash account sebagai inflow + ${matched.length} order_items akan di-tag matched.</div><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn btn-s" onclick="nsa.closeDraftModal()">Batal</button><button class="btn btn-d" onclick="nsa.rejectDraft('${id}')">✗ Reject Draft</button><button class="btn btn-p" onclick="nsa.confirmDraft('${id}')">✓ Confirm & Apply to Cashflow</button></div></div></div>`;
    const dm=document.getElementById('draft-modal');if(dm){dm.innerHTML=html;dm.style.display='block';}
  }
  function closeDraftModal(){const dm=document.getElementById('draft-modal');if(dm){dm.innerHTML='';dm.style.display='none';}}

  async function confirmDraft(id){
    const sett=SETTLEMENTS.find(s=>s.id===id);if(!sett)return;
    const accId=document.getElementById('draft-account')?.value||sett.cash_account_id;
    const settledDate=document.getElementById('draft-date')?.value||sett.period_to;
    if(!accId){toast('⚠️ Pilih cash account dulu');return;}
    if(!settledDate){toast('⚠️ Pilih tanggal settlement');return;}
    if(!confirm('Confirm draft ini? Cash inflow akan dicatat dan order_items akan di-tag matched.'))return;
    try{
      const records=NSA_RECORDS.filter(r=>r.settlement_id===id);
      const matched=records.filter(r=>r.match_status==='matched');
      const matchedNSA=matched.reduce((s,r)=>s+num(r.nsa_amount),0);
      await api('yanz_marketplace_settlements?id=eq.'+id,{method:'PATCH',body:JSON.stringify({status:'confirmed',applied_to_cashflow:true,confirmed_by:'owner',confirmed_at:new Date().toISOString(),cash_account_id:accId,period_to:settledDate})});
      for(const r of matched){
        if(r.order_item_id)await api('yanz_order_items?id=eq.'+r.order_item_id,{method:'PATCH',body:JSON.stringify({nsa_status:'matched',nsa_id:r.id})});
      }
      if(matchedNSA>0){
        await api('yanz_cash_movements',{method:'POST',body:JSON.stringify({account_id:accId,movement_date:settledDate,movement_type:'inflow',category:'marketplace_settlement',amount:matchedNSA,description:`Settlement ${sett.platform.toUpperCase()} — ${matched.length} orders (${sett.file_name||''}) · approved`,reference:id,source_type:'settlement',source_id:id})});
      }
      await api('yanz_activity',{method:'POST',body:JSON.stringify({icon:'✅',text:`Owner confirm NSA dari ${sett.submitted_by}: ${matched.length} matched · ${rp(matchedNSA)} masuk cashflow`,time_ago:'Baru saja',color:'#F0FDF4'})});
      try{
        const staffRec=(await api('yanz_staff?staff_name=eq.'+encodeURIComponent(sett.submitted_by)+'&limit=1'))[0];
        if(staffRec)await api('yanz_notifications',{method:'POST',body:JSON.stringify({recipient_type:'staff',recipient_id:staffRec.id,notif_type:'nsa_confirmed',task_id:null,title:'✅ NSA Draft di-confirm',message:`Settlement ${sett.platform.toUpperCase()} (${sett.file_name}) di-approve owner — ${rp(matchedNSA)} masuk cashflow`,is_read:false})});
      }catch(err){console.warn('Notif failed:',err);}
      closeDraftModal();await loadAll();toast(`✓ Settlement confirmed — ${rp(matchedNSA)} masuk cashflow`);
    }catch(e){toast('❌ '+e.message);console.error(e);}
  }

  async function rejectDraft(id){
    const sett=SETTLEMENTS.find(s=>s.id===id);if(!sett)return;
    const reason=prompt(`Alasan reject draft dari ${sett.submitted_by}?\n(akan dikirim sebagai notifikasi ke staff)`);
    if(reason===null)return;
    if(!reason.trim()){toast('⚠️ Alasan reject wajib diisi');return;}
    try{
      await api('yanz_order_nsa?settlement_id=eq.'+id,{method:'DELETE'});
      await api('yanz_marketplace_settlements?id=eq.'+id,{method:'PATCH',body:JSON.stringify({status:'rejected',applied_to_cashflow:false,rejected_by:'owner',rejected_at:new Date().toISOString(),rejected_reason:reason.trim()})});
      try{
        const staffRec=(await api('yanz_staff?staff_name=eq.'+encodeURIComponent(sett.submitted_by)+'&limit=1'))[0];
        if(staffRec)await api('yanz_notifications',{method:'POST',body:JSON.stringify({recipient_type:'staff',recipient_id:staffRec.id,notif_type:'nsa_rejected',task_id:null,title:'✗ NSA Draft di-reject',message:`Settlement ${sett.platform.toUpperCase()} (${sett.file_name}) ditolak. Alasan: ${reason.trim()}`,is_read:false})});
      }catch(err){console.warn('Notif failed:',err);}
      closeDraftModal();await loadAll();toast('Draft di-reject');
    }catch(e){toast('❌ '+e.message);console.error(e);}
  }

// ── MODULE: Income Statement (Sub-fase 6.4) — owner analytics, read-only ──────
(function(){
  const api=(...a)=>window.YANZ.api(...a);
  const toast=(...a)=>window.YANZ.toast(...a);
  const rpShort=n=>window.YANZ.fmt.rpShort(n);
  const num=n=>window.YANZ.fmt.num(n);
  // rp lokal: gaya akuntansi — negatif jadi (Rp X). Beda dari shell rp, jadi jangan dialias.
  const rp=n=>{const v=Math.round(n||0);if(v<0)return'(Rp '+Math.abs(v).toLocaleString('id-ID')+')';return'Rp '+v.toLocaleString('id-ID');};
  const pct=(part,whole)=>whole===0?0:(part/whole)*100;

  const TABS=['statement','compare','salesmix'];

  let CATEGORIES=[],SUBCATEGORIES=[],EXPENSES=[],INCOME=[],SALES_ORDERS=[],ORDER_ITEMS=[],LIVESTREAM_SESSIONS=[],SETTLEMENTS=[],NSA_RECORDS=[],PRODUCTS=[],OPENING={},BIZ={};
  let _focusHandler=null;
  let _lastRefresh=0;

  const rootEl=()=>document.querySelector('.module-is');

  async function loadAll(){
    _lastRefresh=Date.now();
    setDB(false,'Menghubungkan…');
    try{
      [CATEGORIES,SUBCATEGORIES,EXPENSES,INCOME,SALES_ORDERS,ORDER_ITEMS,LIVESTREAM_SESSIONS,SETTLEMENTS,NSA_RECORDS]=await Promise.all([
        api('yanz_expense_categories?is_active=eq.true&order=display_order'),
        api('yanz_expense_subcategories?is_active=eq.true&order=display_order'),
        api('yanz_expenses?order=expense_date.desc&limit=2000'),
        api('yanz_other_income?order=income_date.desc&limit=1000'),
        api('yanz_sales_orders?order=order_date.desc&limit=2000'),
        api('yanz_order_items?order=created_at.desc&limit=5000'),
        api('yanz_livestream_sessions?order=session_date.desc&limit=2000'),
        api('yanz_marketplace_settlements?order=import_date.desc&limit=200'),
        api('yanz_order_nsa?order=created_at.desc&limit=5000')
      ]);
      try{
        const opens=await api('yanz_opening_balances?order=cutoff_date.desc&limit=1');
        OPENING=opens[0]||{};
        const bizArr=await api('yanz_business_info?is_default=eq.true&limit=1');
        BIZ=bizArr[0]||{};
      }catch(e){}
      try{PRODUCTS=await api('yanz_products?order=category,sku');}catch(e){PRODUCTS=[];}
      setDB(true,'Terhubung ✓ — '+SALES_ORDERS.length+' order · '+EXPENSES.length+' expense');
      populateYears();
      renderStatement();
      renderComparison();
      renderSalesMix();
    }catch(e){setDB(false,'❌ '+e.message);console.error(e);}
  }

  function populateYears(){
    const currentYear=new Date().getFullYear();
    const years=[];
    for(let y=currentYear;y>=currentYear-3;y--)years.push(y);
    const opts=years.map(y=>`<option value="${y}">${y}</option>`).join('');
    ['sel-year','sel-year-q','sel-year-y'].forEach(id=>{const e=document.getElementById(id);if(e)e.innerHTML=opts;});
    const now=new Date();
    const set=(id,v)=>{const e=document.getElementById(id);if(e)e.value=v;};
    set('sel-year',now.getFullYear());set('sel-month',now.getMonth());
    set('sel-year-q',now.getFullYear());set('sel-quarter',Math.floor(now.getMonth()/3)+1);
    set('sel-year-y',now.getFullYear());
    const start=new Date(now.getFullYear(),now.getMonth(),1);
    const end=new Date(now.getFullYear(),now.getMonth()+1,0);
    set('custom-from',start.toISOString().split('T')[0]);
    set('custom-to',end.toISOString().split('T')[0]);
  }

  function onPeriodTypeChange(){
    const type=document.getElementById('period-type').value;
    ['period-month','period-quarter','period-year','period-custom'].forEach(id=>{const e=document.getElementById(id);if(e)e.style.display='none';});
    const show=id=>{const e=document.getElementById(id);if(e)e.style.display='';};
    if(type==='month')show('period-month');
    else if(type==='quarter')show('period-quarter');
    else if(type==='year')show('period-year');
    else if(type==='custom')show('period-custom');
  }

  function getPeriodRange(){
    const type=document.getElementById('period-type').value;
    if(type==='month'){
      const y=parseInt(document.getElementById('sel-year').value);
      const m=parseInt(document.getElementById('sel-month').value);
      return {from:new Date(y,m,1),to:new Date(y,m+1,0,23,59,59),label:new Date(y,m,1).toLocaleDateString('id-ID',{month:'long',year:'numeric'})};
    }else if(type==='quarter'){
      const y=parseInt(document.getElementById('sel-year-q').value);
      const q=parseInt(document.getElementById('sel-quarter').value);
      const startM=(q-1)*3;
      return {from:new Date(y,startM,1),to:new Date(y,startM+3,0,23,59,59),label:`Q${q} ${y}`};
    }else if(type==='year'){
      const y=parseInt(document.getElementById('sel-year-y').value);
      return {from:new Date(y,0,1),to:new Date(y,11,31,23,59,59),label:`Tahun ${y}`};
    }else if(type==='ytd'){
      const now=new Date();
      return {from:new Date(now.getFullYear(),0,1),to:now,label:`YTD ${now.getFullYear()}`};
    }else if(type==='custom'){
      const f=new Date(document.getElementById('custom-from').value);
      const t=new Date(document.getElementById('custom-to').value+'T23:59:59');
      return {from:f,to:t,label:`${f.toLocaleDateString('id-ID')} s/d ${t.toLocaleDateString('id-ID')}`};
    }
  }

  // Potongan marketplace (NSA) per platform untuk periode tertentu.
  // Diakui per TANGGAL PENJUALAN order (akrual, selaras revenue), bukan tanggal settlement.
  // Hanya dari settlement confirmed (bukan draft/rejected) & record yang matched/approved.
  function marketplaceFeesInRange(from,to){
    const inRange=d=>{const dt=new Date(d);return dt>=from&&dt<=to;};
    const confSet=new Set(SETTLEMENTS.filter(s=>s.status!=='draft'&&s.status!=='rejected').map(s=>s.id));
    const sessDate={};LIVESTREAM_SESSIONS.forEach(s=>{sessDate[s.id]=s.session_date;});
    const itemDate=id=>{const it=ORDER_ITEMS.find(o=>o.id===id);if(!it)return null;if(it.livestream_session_id&&sessDate[it.livestream_session_id])return sessDate[it.livestream_session_id];const ord=SALES_ORDERS.find(o=>o.id===it.order_id);return (ord&&ord.order_date)||it.created_at;};
    const mk=()=>({komisi_platform:0,ongkir:0,affiliator:0,dinamis:0,proses:0,gratis_ongkir_xtra:0,voucher:0,total:0});
    const tt=mk(),sh=mk();
    let refund=0;
    NSA_RECORDS.forEach(r=>{
      if(!confSet.has(r.settlement_id))return;
      if(r.match_status!=='matched'&&r.match_status!=='approved')return;
      const d=itemDate(r.order_item_id)||r.settled_date;
      if(!d||!inRange(d))return;
      if(num(r.nsa_amount)<0){refund+=Math.abs(num(r.nsa_amount));return;} // NSA negatif = retur/refund → biaya terpisah, bukan potongan biasa
      const b=r.platform==='tiktok'?tt:r.platform==='shopee'?sh:null;
      if(!b)return;
      const kp=num(r.komisi_platform),og=num(r.perkiraan_ongkir),af=num(r.komisi_affiliator),di=num(r.komisi_dinamis),pr=num(r.biaya_proses);
      const gx=num(r.gratis_ongkir_xtra),vc=num(r.voucher_seller); // 2 program khusus Shopee (slot sendiri)
      b.komisi_platform+=kp;b.ongkir+=og;b.affiliator+=af;b.dinamis+=di;b.proses+=pr;b.gratis_ongkir_xtra+=gx;b.voucher+=vc;b.total+=kp+og+af+di+pr+gx+vc;
    });
    return {tt,sh,total:tt.total+sh.total,refund};
  }

  function calculateIS(from,to){
    const inRange=d=>{const dt=new Date(d);return dt>=from&&dt<=to;};
    // Ecommerce Import Excel (non-Live): order channel='ecommerce' tanpa sesi Live → tetap dihitung sbg revenue.
    // Order dari Live TIDAK dobel karena item Live punya livestream_session_id (sudah dihitung via sesi).
    const ecomOrderById={};SALES_ORDERS.filter(o=>o.channel==='ecommerce'&&inRange(o.order_date)).forEach(o=>{ecomOrderById[o.id]=o;});
    const isImportItem=i=>!i.livestream_session_id&&!!ecomOrderById[i.order_id];
    const importPlat=i=>/shopee/i.test((ecomOrderById[i.order_id]||{}).customer_name||'')?'shopee':'tiktok';
    const ttSessions=LIVESTREAM_SESSIONS.filter(s=>s.platform==='tiktok'&&inRange(s.session_date));
    const ttSessionIds=ttSessions.map(s=>s.id);
    const ttItems=ORDER_ITEMS.filter(i=>ttSessionIds.includes(i.livestream_session_id)||(isImportItem(i)&&importPlat(i)==='tiktok'));
    const penjualanTT=ttItems.reduce((s,i)=>s+num(i.qty)*num(i.sell_price),0);
    const shSessions=LIVESTREAM_SESSIONS.filter(s=>s.platform==='shopee'&&inRange(s.session_date));
    const shSessionIds=shSessions.map(s=>s.id);
    const shItems=ORDER_ITEMS.filter(i=>shSessionIds.includes(i.livestream_session_id)||(isImportItem(i)&&importPlat(i)==='shopee'));
    const penjualanShopee=shItems.reduce((s,i)=>s+num(i.qty)*num(i.sell_price),0);
    const b2bOrders=SALES_ORDERS.filter(o=>o.channel==='b2b'&&inRange(o.order_date)&&['sent','partial_paid','paid'].includes(o.workflow_status));
    const penjualanB2B=b2bOrders.reduce((s,o)=>s+num(o.subtotal),0);
    const totalPenjualan=penjualanTT+penjualanShopee+penjualanB2B;
    let cogs=0;
    [...ttItems,...shItems].forEach(i=>{cogs+=num(i.cogs_total);});
    const b2bOrderIds=b2bOrders.map(o=>o.id);
    ORDER_ITEMS.filter(i=>b2bOrderIds.includes(i.order_id)).forEach(i=>{cogs+=num(i.cogs_total);});
    const otherIncome=INCOME.filter(i=>inRange(i.income_date)).reduce((s,i)=>s+num(i.amount),0);
    const otherIncomeBunga=INCOME.filter(i=>inRange(i.income_date)&&i.category==='Bunga Bank').reduce((s,i)=>s+num(i.amount),0);
    const otherIncomeLain=otherIncome-otherIncomeBunga;
    // Potongan marketplace per platform → NSA (net) per platform
    const fees=marketplaceFeesInRange(from,to);
    const marketplaceRefund=num(fees.refund);
    const potonganTT=fees.tt.total, potonganShopee=fees.sh.total, totalPotongan=fees.total;
    const nsaTT=penjualanTT-potonganTT;
    const nsaShopee=penjualanShopee-potonganShopee;
    const nsaB2B=penjualanB2B; // B2B tanpa potongan marketplace
    const totalNSA=nsaTT+nsaShopee+nsaB2B;
    // Gross Profit pakai Total NSA (net setelah potongan), bukan gross
    const grossProfit=totalNSA-cogs+otherIncome;
    const periodExp=EXPENSES.filter(e=>inRange(e.accrual_date||e.expense_date));
    const expByCategoryAndSub={};
    CATEGORIES.forEach(cat=>{
      expByCategoryAndSub[cat.id]={cat,total:0,subs:{}};
      SUBCATEGORIES.filter(s=>s.category_id===cat.id).forEach(sub=>{expByCategoryAndSub[cat.id].subs[sub.id]={sub,total:0};});
    });
    periodExp.forEach(e=>{
      if(!expByCategoryAndSub[e.category_id])return;
      expByCategoryAndSub[e.category_id].total+=num(e.amount);
      if(expByCategoryAndSub[e.category_id].subs[e.subcategory_id])expByCategoryAndSub[e.category_id].subs[e.subcategory_id].total+=num(e.amount);
    });
    const totalExpenses=periodExp.reduce((s,e)=>s+num(e.amount),0);
    const taxCat=CATEGORIES.find(c=>c.category_code==='TAX');
    const taxExpense=taxCat?expByCategoryAndSub[taxCat.id].total:0;
    const expensesBeforeTax=totalExpenses-taxExpense;
    const netProfit=grossProfit-totalExpenses-marketplaceRefund;
    let brought_forward=0;
    const cutoffDate=OPENING.cutoff_date?new Date(OPENING.cutoff_date):null;
    const openingRE=num(OPENING.retained_earnings);
    if(cutoffDate&&from>=cutoffDate)brought_forward=openingRE+calculateNetProfitRange(cutoffDate,new Date(from.getTime()-1));
    else brought_forward=openingRE;
    const carried_forward=brought_forward+netProfit;
    return {penjualanTT,penjualanShopee,penjualanB2B,totalPenjualan,fees,potonganTT,potonganShopee,totalPotongan,nsaTT,nsaShopee,nsaB2B,totalNSA,cogs,otherIncome,otherIncomeBunga,otherIncomeLain,grossProfit,expByCategoryAndSub,totalExpenses,expensesBeforeTax,taxExpense,marketplaceRefund,netProfit,brought_forward,carried_forward};
  }

  function calculateNetProfitRange(from,to){
    const inRange=d=>{const dt=new Date(d);return dt>=from&&dt<=to;};
    const ttSessions=LIVESTREAM_SESSIONS.filter(s=>s.platform==='tiktok'&&inRange(s.session_date));
    const shSessions=LIVESTREAM_SESSIONS.filter(s=>s.platform==='shopee'&&inRange(s.session_date));
    const ttIds=ttSessions.map(s=>s.id);
    const shIds=shSessions.map(s=>s.id);
    const liveItems=ORDER_ITEMS.filter(i=>ttIds.includes(i.livestream_session_id)||shIds.includes(i.livestream_session_id));
    const importItems=ORDER_ITEMS.filter(i=>!i.livestream_session_id&&SALES_ORDERS.some(o=>o.id===i.order_id&&o.channel==='ecommerce'&&inRange(o.order_date)));
    const liveRev=[...liveItems,...importItems].reduce((s,i)=>s+num(i.qty)*num(i.sell_price),0);
    const liveCOGS=[...liveItems,...importItems].reduce((s,i)=>s+num(i.cogs_total),0);
    const b2bOrders=SALES_ORDERS.filter(o=>o.channel==='b2b'&&inRange(o.order_date)&&['sent','partial_paid','paid'].includes(o.workflow_status));
    const b2bRev=b2bOrders.reduce((s,o)=>s+num(o.subtotal),0);
    const b2bOrderIds=b2bOrders.map(o=>o.id);
    const b2bCOGS=ORDER_ITEMS.filter(i=>b2bOrderIds.includes(i.order_id)).reduce((s,i)=>s+num(i.cogs_total),0);
    const totalRev=liveRev+b2bRev;
    const totalCOGS=liveCOGS+b2bCOGS;
    const otherInc=INCOME.filter(i=>inRange(i.income_date)).reduce((s,i)=>s+num(i.amount),0);
    const totalExp=EXPENSES.filter(e=>inRange(e.accrual_date||e.expense_date)).reduce((s,e)=>s+num(e.amount),0);
    const fees=marketplaceFeesInRange(from,to);
    return totalRev-fees.total-num(fees.refund)-totalCOGS+otherInc-totalExp;
  }

  function renderStatement(){
    const period=getPeriodRange();
    const cont=document.getElementById('is-content');if(!cont)return;
    if(!period){cont.innerHTML='<div class="empty">Pilih periode dulu.</div>';return;}
    const is=calculateIS(period.from,period.to);
    const sc=document.getElementById('summary-cards');
    if(sc)sc.innerHTML=`
      <div class="summary-card sc-revenue"><div class="sc-label">Penjualan (Gross)</div><div class="sc-value">${rpShort(is.totalPenjualan)}</div><div class="sc-sub">TT + Shopee + B2B</div></div>
      <div class="summary-card sc-expense"><div class="sc-label">Potongan Marketplace</div><div class="sc-value">${rpShort(is.totalPotongan)}</div><div class="sc-sub">${is.totalPenjualan>0?(is.totalPotongan/is.totalPenjualan*100).toFixed(1)+'% dari gross':'—'}</div></div>
      <div class="summary-card sc-revenue"><div class="sc-label">Total NSA (Net)</div><div class="sc-value">${rpShort(is.totalNSA)}</div><div class="sc-sub">setelah potongan</div></div>
      <div class="summary-card sc-profit ${is.netProfit>=0?'positive':'negative'}"><div class="sc-label">Net Profit/(Loss)</div><div class="sc-value">${rpShort(is.netProfit)}</div><div class="sc-sub">Margin: ${is.totalPenjualan>0?(is.netProfit/is.totalPenjualan*100).toFixed(1)+'%':'—'}</div></div>`;
    const periodLabel=period.label;
    const today=new Date().toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'});
    let html=`<div class="is-document"><div class="is-header"><div class="is-co-name">${BIZ.business_name||BIZ.legal_name||'YANZ'}</div><div class="is-title">LAPORAN LABA RUGI / INCOME STATEMENT</div><div class="is-period">Periode: ${periodLabel}</div><div class="is-period" style="font-size:11px;margin-top:2px">Generated: ${today}</div></div>`;
    const pctOf=(part,base)=>base>0?(part/base*100).toFixed(1)+'%':'';
    // ── REVENUE (Gross) ──
    html+=`<div class="is-section"><div class="is-section-title">📈 Pendapatan / Revenue (Gross)</div>`;
    if(is.penjualanTT>0||is.totalPenjualan===0)html+=`<div class="is-row indent income"><span class="label">Penjualan TT (TikTok)</span><span class="num">${rp(is.penjualanTT)}</span><span class="compare"></span></div>`;
    if(is.penjualanShopee>0||is.totalPenjualan===0)html+=`<div class="is-row indent income"><span class="label">Penjualan Shopee</span><span class="num">${rp(is.penjualanShopee)}</span><span class="compare"></span></div>`;
    if(is.penjualanB2B>0||is.totalPenjualan===0)html+=`<div class="is-row indent income"><span class="label">Penjualan B2B</span><span class="num">${rp(is.penjualanB2B)}</span><span class="compare"></span></div>`;
    html+=`<div class="is-row subtotal income"><span class="label"><strong>Total Penjualan (Gross)</strong></span><span class="num">${rp(is.totalPenjualan)}</span><span class="compare">100.0%</span></div></div>`;
    // ── POTONGAN MARKETPLACE → NSA ──
    html+=`<div class="is-section"><div class="is-section-title">💸 Potongan Marketplace → NSA (Net Diterima)</div>`;
    const feeRow=(label,val)=>val>0?`<div class="is-row indent2 expense"><span class="label">${label}</span><span class="num">(${rp(val)})</span><span class="compare"></span></div>`:'';
    // TikTok
    if(is.penjualanTT>0||is.potonganTT>0){
      const f=is.fees.tt;

  function drawTrendChart(data){
    const svg=document.getElementById('trend-chart');
    if(!svg||!data.length)return;
    const W=800,Hh=300,pad={l:60,r:20,t:20,b:40};
    const revs=data.map(d=>d.is.totalPenjualan);
    const profits=data.map(d=>d.is.netProfit);
    const allVals=[...revs,...profits];
    const maxV=Math.max(1,...allVals.map(Math.abs));
    const xStep=(W-pad.l-pad.r)/Math.max(1,data.length-1);
    const yTo=v=>Hh-pad.b-((v+maxV)/(maxV*2))*(Hh-pad.t-pad.b);
    const xTo=i=>pad.l+i*xStep;
    let html='';
    for(let i=0;i<=4;i++){const v=maxV-i*maxV/2;const y=yTo(v);html+=`<line x1="${pad.l}" y1="${y}" x2="${W-pad.r}" y2="${y}" stroke="#F0EDE8" stroke-width="1"/><text x="${pad.l-8}" y="${y+3}" font-size="9" fill="#aaa" text-anchor="end">${rpShort(v)}</text>`;}
    html+=`<line x1="${pad.l}" y1="${yTo(0)}" x2="${W-pad.r}" y2="${yTo(0)}" stroke="#1C1C1A" stroke-width="1.5" stroke-dasharray="3,3"/>`;
    const revPath=revs.map((v,i)=>`${i===0?'M':'L'} ${xTo(i)} ${yTo(v)}`).join(' ');
    html+=`<path d="${revPath}" fill="none" stroke="#16A34A" stroke-width="2.5"/>`;
    revs.forEach((v,i)=>{html+=`<circle cx="${xTo(i)}" cy="${yTo(v)}" r="4" fill="#16A34A" stroke="#fff" stroke-width="1.5"><title>${data[i].label}: Revenue ${rp(v)}</title></circle>`;});
    const profPath=profits.map((v,i)=>`${i===0?'M':'L'} ${xTo(i)} ${yTo(v)}`).join(' ');
    html+=`<path d="${profPath}" fill="none" stroke="#EC4899" stroke-width="2.5"/>`;
    profits.forEach((v,i)=>{const c=v>=0?'#EC4899':'#DC2626';html+=`<circle cx="${xTo(i)}" cy="${yTo(v)}" r="4" fill="${c}" stroke="#fff" stroke-width="1.5"><title>${data[i].label}: Net ${rp(v)}</title></circle>`;});
    data.forEach((d,i)=>{html+=`<text x="${xTo(i)}" y="${Hh-pad.b+18}" font-size="11" fill="#666" text-anchor="middle" font-weight="600">${d.label}</text>`;});
    html+=`<g><rect x="${pad.l}" y="5" width="12" height="3" fill="#16A34A"/><text x="${pad.l+18}" y="10" font-size="10" fill="#666">Revenue</text><rect x="${pad.l+90}" y="5" width="12" height="3" fill="#EC4899"/><text x="${pad.l+108}" y="10" font-size="10" fill="#666">Net Profit</text></g>`;
    svg.innerHTML=html;
  }

  const _SM_MONTHS=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
  function smMonthKey(d){const dt=new Date(d);return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0');}
  function smMonthLabel(k){const p=k.split('-');return _SM_MONTHS[(+p[1])-1]+' '+p[0];}
  function smValidOrders(){
    // order_id -> order_date, hanya penjualan riil (B2B draft/quotation & batal diabaikan)
    const map=new Map();
    SALES_ORDERS.forEach(o=>{
      const st=(o.workflow_status||'').toLowerCase();
      if(o.channel==='b2b'&&!['sent','partial_paid','paid'].includes(st))return;
      if(st==='cancelled')return;
      if(!o.order_date)return;
      map.set(o.id,o.order_date);
    });
    return map;
  }
  function renderSalesMix(){
    const el=document.getElementById('salesmix-content');if(!el)return;
    const orders=smValidOrders();
    const monthsSet=new Set();
    ORDER_ITEMS.forEach(it=>{const d=orders.get(it.order_id);if(d)monthsSet.add(smMonthKey(d));});
    const months=[...monthsSet].sort().reverse();
    const sel=document.getElementById('sm-month');
    if(sel){
      const prev=sel.value;
      sel.innerHTML='<option value="">Semua bulan</option>'+months.map(m=>`<option value="${m}">${smMonthLabel(m)}</option>`).join('');
      if(prev===''||months.includes(prev))sel.value=prev;
    }
    const fMonth=sel?sel.value:'';
    const agg=new Map();let totQty=0,totRev=0;
    ORDER_ITEMS.forEach(it=>{
      const d=orders.get(it.order_id);if(!d)return;
      if(fMonth&&smMonthKey(d)!==fMonth)return;
      const q=num(it.qty),rev=num(it.qty)*num(it.sell_price);
      if(!agg.has(it.product_id))agg.set(it.product_id,{qty:0,rev:0});
      const g=agg.get(it.product_id);g.qty+=q;g.rev+=rev;totQty+=q;totRev+=rev;
    });
    if(!agg.size){el.innerHTML='<div class="empty">Belum ada penjualan pada periode ini.</div>';return;}
    const rows=[...agg.entries()].map(([pid,g])=>{const p=PRODUCTS.find(x=>x.id===pid);return{name:p?p.name:'(SKU terhapus)',sku:p?p.sku:'—',qty:g.qty,rev:g.rev,qShare:totQty?g.qty/totQty*100:0,rShare:totRev?g.rev/totRev*100:0};}).sort((a,b)=>b.qty-a.qty);
    const lbl=fMonth?smMonthLabel(fMonth):'Semua bulan';
    let html=`<div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px">
      <div class="kpi" style="flex:1;min-width:130px"><div class="kpi-lbl">Total Unit Terjual</div><div class="kpi-val">${totQty.toLocaleString('id-ID')}</div></div>
      <div class="kpi" style="flex:1;min-width:130px"><div class="kpi-lbl">Total Revenue</div><div class="kpi-val">${rpShort(totRev)}</div></div>
      <div class="kpi" style="flex:1;min-width:130px"><div class="kpi-lbl">SKU Terjual</div><div class="kpi-val">${rows.length}</div></div>
    </div>`;
    html+=`<div class="tw"><table><thead><tr><th>#</th><th>SKU</th><th>Produk</th><th class="num">Qty</th><th class="num">% Unit</th><th style="min-width:120px">Porsi Unit</th><th class="num">Revenue</th><th class="num">% Rev</th></tr></thead><tbody>`+
      rows.map((r,i)=>`<tr><td>${i+1}</td><td><span class="bx bgr">${r.sku}</span></td><td style="font-weight:600">${r.name}</td><td class="num">${r.qty.toLocaleString('id-ID')}</td><td class="num"><strong>${r.qShare.toFixed(1)}%</strong></td><td><div class="barw"><div class="barf" style="width:${Math.max(2,r.qShare)}%;background:#1C1C1A"></div></div></td><td class="num">${rpShort(r.rev)}</td><td class="num">${r.rShare.toFixed(1)}%</td></tr>`).join('')+
      '</tbody></table></div>';
    html+=`<p style="font-size:11px;color:#888;margin-top:10px">Periode: <strong>${lbl}</strong> · diurut dari unit terbanyak. B2B draft/quotation & order batal tidak dihitung. Bundle dihitung sebagai SKU bundle-nya sendiri.</p>`;
    el.innerHTML=html;
  }

// ── MODULE: Cashflow (Sub-fase 6.4) — owner analytics, read-only ──────────────
(function(){

  function renderAll(){renderStatement();renderForecast();renderReceivables();}

  function calcCurrentBalance(){
    return ACCOUNTS.reduce((sum,a)=>{
      let bal=num(a.initial_balance);
      MOVEMENTS.filter(m=>m.account_id===a.id).sort((x,y)=>new Date(x.movement_date)-new Date(y.movement_date)||new Date(x.created_at||0)-new Date(y.created_at||0)).forEach(m=>{
        if(m.movement_type==='inflow'||m.movement_type==='transfer_in')bal+=num(m.amount);
        else if(m.movement_type==='outflow'||m.movement_type==='transfer_out')bal-=num(m.amount);
        else if(m.movement_type==='adjustment')bal=num(m.amount);
      });
      return sum+bal;
    },0);
  }
  function calcBalanceOnDate(date){
    const target=new Date(date);target.setHours(23,59,59,999);
    return ACCOUNTS.reduce((sum,a)=>{
      let bal=num(a.initial_balance);
      MOVEMENTS.filter(m=>m.account_id===a.id&&new Date(m.movement_date)<=target).sort((x,y)=>new Date(x.movement_date)-new Date(y.movement_date)||new Date(x.created_at||0)-new Date(y.created_at||0)).forEach(m=>{
        if(m.movement_type==='inflow'||m.movement_type==='transfer_in')bal+=num(m.amount);
        else if(m.movement_type==='outflow'||m.movement_type==='transfer_out')bal-=num(m.amount);
        else if(m.movement_type==='adjustment')bal=num(m.amount);
      });
      return sum+bal;
    },0);
  }

    const totalIn=b2bPayments+otherInc+otherInflows;
    const opEx=EXPENSES.filter(e=>inRange(e.expense_date)).reduce((s,e)=>s+num(e.amount),0);

    const opExVC=opEx-opExFC;
    // Inventory cash-out dari cash_movements (tanggal BAYAR) — bukan po_date — supaya

    set('kpi-in',rpShort(totalIn));set('kpi-in-sub',period.label);
    set('kpi-out',rpShort(totalOut));set('kpi-out-sub',period.label);
    set('kpi-net',rpShort(netCF));set('kpi-net-sub',netCF>=0?'Surplus':'Defisit');
    const netCard=document.getElementById('kpi-net-card');if(netCard)netCard.className='kpi-card '+(netCF>=0?'positive':'negative');
    const threshold=num(SETTINGS.min_cash_threshold);

    const today=new Date().toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'});
    let html=`<div class="cf-document"><div class="cf-header"><div class="cf-co-name">${BIZ.business_name||'YANZ'}</div><div class="cf-title">LAPORAN ARUS KAS / CASHFLOW STATEMENT</div><div class="cf-period">Periode: ${period.label}</div><div class="cf-period" style="font-size:10px;margin-top:2px">Generated: ${today}</div></div>`;

    if(otherInc>0)html+=`<div class="cf-row indent"><span>Other Income (Bunga bank, dll)</span><span class="num">${rp(otherInc)}</span><span class="pct">${totalIn>0?(otherInc/totalIn*100).toFixed(1)+'%':''}</span></div>`;
    if(otherInflows>0)html+=`<div class="cf-row indent"><span>Setoran lainnya</span><span class="num">${rp(otherInflows)}</span><span class="pct">${totalIn>0?(otherInflows/totalIn*100).toFixed(1)+'%':''}</span></div>`;
    if(totalIn===0)html+=`<div class="cf-row indent" style="color:#bbb;font-style:italic">Belum ada cash inflow tercatat</div>`;

      html+=`<div class="cf-row indent" style="padding-left:40px;font-size:11px;color:#777"><span>Variable Cost</span><span class="num">${rp(opExVC)}</span><span class="pct"></span></div>`;

    if(totalOut===0)html+=`<div class="cf-row indent" style="color:#bbb;font-style:italic">Belum ada cash outflow tercatat</div>`;
    html+=`<div class="cf-row subtotal out"><span><strong>Total Cash Outflows</strong></span><span class="num">(${rp(totalOut)})</span><span class="pct">100%</span></div></div>`;
    html+=`<div class="cf-row net ${netCF>=0?'pos':'neg'}"><span>NET CASHFLOW</span><span class="num">${rp(netCF)}</span><span class="pct"></span></div>`;

  function renderForecast(){
    const today=new Date();today.setHours(0,0,0,0);
    const currentBal=calcCurrentBalance();
    const threshold=num(SETTINGS.min_cash_threshold);
    const last30Start=new Date(today);last30Start.setDate(last30Start.getDate()-30);
    const last30Exp=EXPENSES.filter(e=>{const d=new Date(e.expense_date);return d>=last30Start&&d<today;});
    const dailyVCAvg=last30Exp.filter(e=>e.cost_type==='variable').reduce((s,e)=>s+num(e.amount),0)/30;
    const dailyFCAvg=last30Exp.filter(e=>e.cost_type==='fixed').reduce((s,e)=>s+num(e.amount),0)/30;
    const last60Start=new Date(today);last60Start.setDate(last60Start.getDate()-60);
    const last60Payments=PAYMENTS.filter(p=>new Date(p.payment_date)>=last60Start).reduce((s,p)=>s+num(p.amount),0);
    const last60OtherInc=INCOME.filter(i=>new Date(i.income_date)>=last60Start).reduce((s,i)=>s+num(i.amount),0);
    const dailyInflowAvg=(last60Payments+last60OtherInc)/60;
    const upcomingRec=SALES_ORDERS.filter(o=>{if(!['sent','partial_paid'].includes(o.workflow_status))return false;return num(o.grand_total)-num(o.amount_paid)>0;});
    const fcUpcoming=[];
    FC_TEMPLATES.forEach(fc=>{
      if(!fc.is_active)return;
      for(let m=0;m<4;m++){
        const targetDate=new Date(today.getFullYear(),today.getMonth()+m,Math.min(fc.day_of_month,new Date(today.getFullYear(),today.getMonth()+m+1,0).getDate()));
        if(targetDate>=today){
          if(fc.end_date&&new Date(fc.end_date)<targetDate)continue;
          const exists=EXPENSES.find(e=>e.recurring_template_id===fc.id&&new Date(e.expense_date).getMonth()===targetDate.getMonth()&&new Date(e.expense_date).getFullYear()===targetDate.getFullYear());
          if(!exists)fcUpcoming.push({date:targetDate,amount:num(fc.amount),name:fc.template_name});
        }
      }
    });
    // Hutang usaha belum lunas → outflow terjadwal di tanggal jatuh tempo
    const payablesUpcoming=PURCHASE_BATCHES.filter(b=>b.payment_status==='unpaid'&&b.payment_due_date)
      .map(b=>({date:new Date(b.payment_due_date),amount:num(b.qty_purchased)*num(b.landed_cost_per_unit)}));
    const totalPayables=payablesUpcoming.reduce((s,p)=>s+p.amount,0);
    const projections=[];
    let runBal=currentBal;
    for(let d=0;d<=90;d++){
      const targetDate=new Date(today);targetDate.setDate(targetDate.getDate()+d);
      let inflow=dailyInflowAvg, outflow=dailyVCAvg;
      fcUpcoming.forEach(fc=>{if(fc.date.toDateString()===targetDate.toDateString())outflow+=fc.amount;});
      payablesUpcoming.forEach(p=>{if(p.date.toDateString()===targetDate.toDateString())outflow+=p.amount;});
      upcomingRec.forEach(o=>{if(o.due_date&&new Date(o.due_date).toDateString()===targetDate.toDateString())inflow+=num(o.grand_total)-num(o.amount_paid);});
      runBal=runBal+inflow-outflow;
      projections.push({date:targetDate,balance:runBal,inflow,outflow});
    }
    const proj30=projections[30].balance,proj60=projections[60].balance,proj90=projections[90].balance;
    const runwayTarget=threshold>0?threshold:0;
    let runwayDays=-1;
    for(let i=0;i<projections.length;i++){if(projections[i].balance<runwayTarget){runwayDays=i;break;}}
    const set=(id,v)=>{const e=document.getElementById(id);if(e)e.textContent=v;};
    set('fc-30',rpShort(proj30));set('fc-30-sub',proj30>=0?'Surplus projection':'Defisit projection');
    set('fc-60',rpShort(proj60));set('fc-60-sub',proj60>=0?'Surplus projection':'Defisit projection');
    set('fc-90',rpShort(proj90));set('fc-90-sub',proj90>=0?'Surplus projection':'Defisit projection');
    const runwayCard=document.getElementById('kpi-runway-card');
    if(runwayDays===-1){set('fc-runway','> 90 hari');set('fc-runway-sub','Aman ≥ 90 hari');if(runwayCard)runwayCard.className='kpi-card positive';}
    else{set('fc-runway',`${runwayDays} hari`);set('fc-runway-sub',`Akan capai ${threshold>0?'threshold':'Rp 0'} pada ${fdShort(projections[runwayDays].date)}`);if(runwayCard)runwayCard.className='kpi-card '+(runwayDays<30?'negative':'');}
    const alerts=document.getElementById('forecast-alerts');
    let alertsHTML='';
    if(runwayDays!==-1&&runwayDays<30)alertsHTML+=`<div class="alert-box"><div class="icon">🚨</div><div><strong>PERINGATAN — Cash Runway Pendek</strong>Proyeksi kas akan habis dalam ${runwayDays} hari. Pertimbangkan: kurangi expense, percepat penagihan B2B, atau tunda pembelian inventory.</div></div>`;
    else if(runwayDays!==-1&&runwayDays<60)alertsHTML+=`<div class="alert-box alert-box-warn"><div class="icon">⚠️</div><div><strong>WASPADA — Cashflow Ketat</strong>Proyeksi kas akan mendekati threshold dalam ${runwayDays} hari.</div></div>`;
    if(proj30<0)alertsHTML+=`<div class="alert-box"><div class="icon">📉</div><div><strong>Proyeksi 30 hari NEGATIF</strong>Estimasi saldo ${rpShort(proj30)}. Review urgent diperlukan.</div></div>`;
    if(!alertsHTML)alertsHTML=`<div class="alert-box alert-box-info"><div class="icon">✅</div><div><strong>Cashflow Sehat</strong>Proyeksi 90 hari positif. Continue monitoring.</div></div>`;
    if(alerts)alerts.innerHTML=alertsHTML;
    drawForecastChart(projections,threshold);
    const fa=document.getElementById('forecast-assumptions');
    if(fa)fa.innerHTML=`<div style="display:grid;grid-template-columns:repeat(2,1fr);gap:14px;font-size:12px"><div><strong>📥 Daily Inflow Rata-rata:</strong><br>${rp(dailyInflowAvg)}/hari<br><span style="color:#888;font-size:11px">Dari 60 hari terakhir (B2B payments + Other Income)</span></div><div><strong>📤 Daily Outflow Rata-rata:</strong><br>VC: ${rp(dailyVCAvg)}/hari + FC: ${rp(dailyFCAvg)}/hari<br><span style="color:#888;font-size:11px">Dari 30 hari terakhir</span></div><div><strong>🗓️ Piutang B2B Outstanding:</strong><br>${upcomingRec.length} invoice · ${rp(upcomingRec.reduce((s,o)=>s+num(o.grand_total)-num(o.amount_paid),0))}<br><span style="color:#888;font-size:11px">Akan masuk sesuai jatuh tempo</span></div><div><strong>🔁 FC Akan Datang (90 hari):</strong><br>${fcUpcoming.length} transaksi · ${rp(fcUpcoming.reduce((s,f)=>s+f.amount,0))}<br><span style="color:#888;font-size:11px">Auto-generated dari FC templates</span></div><div><strong>🧾 Hutang Usaha Jatuh Tempo:</strong><br>${payablesUpcoming.length} hutang · ${rp(totalPayables)}<br><span style="color:#888;font-size:11px">Pembelian tempo/kartu kredit, outflow di tanggal jatuh tempo</span></div></div><div style="margin-top:14px;padding:12px;background:#FFFBEB;border:1px solid #FDE68A;border-radius:8px;font-size:11px;color:#92400E"><strong>⚠️ Limitasi Forecast Saat Ini:</strong><br>• Sales livestream (TikTok/Shopee) masuk sebagai cash via NSA Import (settlement diterima H+ beberapa minggu), belum diestimasi sebagai inflow harian.<br>• Estimasi VC menggunakan rata-rata 30 hari terakhir.<br>• B2B receivables diasumsikan dibayar tepat waktu sesuai due_date.</div>`;
  }

  function drawForecastChart(projections,threshold){
    const svg=document.getElementById('forecast-chart');if(!svg)return;
    const W=800,Hh=340,pad={l:65,r:20,t:20,b:50};
    const balances=projections.map(p=>p.balance);
    const minB=Math.min(0,...balances,threshold);
    const maxB=Math.max(...balances,threshold);
    const range=maxB-minB||1;
    const xStep=(W-pad.l-pad.r)/(projections.length-1);
    const yTo=v=>Hh-pad.b-((v-minB)/range)*(Hh-pad.t-pad.b);
    const xTo=i=>pad.l+i*xStep;
    let html='';
    for(let i=0;i<=4;i++){const v=minB+range*i/4;const y=yTo(v);html+=`<line x1="${pad.l}" y1="${y}" x2="${W-pad.r}" y2="${y}" stroke="#F0EDE8" stroke-width="1"/><text x="${pad.l-8}" y="${y+3}" font-size="9" fill="#aaa" text-anchor="end">${rpShort(v)}</text>`;}
    if(minB<0&&maxB>0)html+=`<line x1="${pad.l}" y1="${yTo(0)}" x2="${W-pad.r}" y2="${yTo(0)}" stroke="#1C1C1A" stroke-width="1.5" stroke-dasharray="3,3"/><text x="${W-pad.r-5}" y="${yTo(0)-5}" font-size="10" fill="#1C1C1A" text-anchor="end">Rp 0</text>`;
    if(threshold>0&&threshold>minB&&threshold<maxB)html+=`<line x1="${pad.l}" y1="${yTo(threshold)}" x2="${W-pad.r}" y2="${yTo(threshold)}" stroke="#D97706" stroke-width="1.5" stroke-dasharray="5,3"/><text x="${W-pad.r-5}" y="${yTo(threshold)-5}" font-size="10" fill="#D97706" text-anchor="end">Min Threshold</text>`;
    const areaPath=`M ${pad.l} ${yTo(projections[0].balance)} `+projections.map((p,i)=>`L ${xTo(i)} ${yTo(p.balance)}`).join(' ')+` L ${xTo(projections.length-1)} ${Hh-pad.b} L ${pad.l} ${Hh-pad.b} Z`;
    html+=`<defs><linearGradient id="cf-grad" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#16A34A" stop-opacity="0.25"/><stop offset="100%" stop-color="#16A34A" stop-opacity="0"/></linearGradient></defs>`;
    html+=`<path d="${areaPath}" fill="url(#cf-grad)" stroke="none"/>`;
    const linePath=projections.map((p,i)=>`${i===0?'M':'L'} ${xTo(i)} ${yTo(p.balance)}`).join(' ');
    html+=`<path d="${linePath}" fill="none" stroke="#16A34A" stroke-width="2.5"/>`;
    [30,60,90].forEach(d=>{
      const p=projections[d];const x=xTo(d);const y=yTo(p.balance);
      html+=`<line x1="${x}" y1="${pad.t}" x2="${x}" y2="${Hh-pad.b}" stroke="#1C1C1A" stroke-width="1" stroke-dasharray="2,3" opacity=".3"/>`;
      const c=p.balance>=0?'#16A34A':'#DC2626';
      html+=`<circle cx="${x}" cy="${y}" r="5" fill="${c}" stroke="#fff" stroke-width="2"><title>${fdShort(p.date)}: ${rp(p.balance)}</title></circle>`;
      html+=`<text x="${x}" y="${pad.t-5}" font-size="10" fill="#1C1C1A" text-anchor="middle" font-weight="700">${d}d</text>`;
    });
    for(let i=0;i<=90;i+=15){const x=xTo(i);html+=`<text x="${x}" y="${Hh-pad.b+18}" font-size="10" fill="#999" text-anchor="middle">${fdShort(projections[i].date)}</text>`;}
    html+=`<circle cx="${xTo(0)}" cy="${yTo(projections[0].balance)}" r="6" fill="#1C1C1A" stroke="#E8FF5A" stroke-width="2"/>`;
    html+=`<text x="${xTo(0)+10}" y="${yTo(projections[0].balance)+4}" font-size="11" fill="#1C1C1A" font-weight="700">Hari ini</text>`;
    svg.innerHTML=html;
  }

    const rec=SALES_ORDERS.filter(o=>['sent','partial_paid'].includes(o.workflow_status)&&num(o.grand_total)-num(o.amount_paid)>0)
      .map(o=>({...o,outstanding:num(o.grand_total)-num(o.amount_paid)}))
      .sort((a,b)=>new Date(a.due_date||'9999')-new Date(b.due_date||'9999'));
    const totalRec=rec.reduce((s,o)=>s+o.outstanding,0);
    const set=(id,v)=>{const e=document.getElementById(id);if(e)e.textContent=v;};
    set('rec-total',rp(totalRec));set('rec-sub',`${rec.length} invoice outstanding`);
    const recEl=document.getElementById('receivables-list');
    if(recEl){
      if(!rec.length)recEl.innerHTML='<div class="empty">Tidak ada piutang outstanding.</div>';
      else recEl.innerHTML=rec.slice(0,30).map(o=>{
        const diff=o.due_date?Math.ceil((new Date(o.due_date)-today)/(1000*60*60*24)):null;
        const dateLabel=diff===null?'(no due date)':diff<0?`Lewat ${Math.abs(diff)} hari`:diff===0?'Hari ini':`${diff} hari lagi`;
        const dateColor=diff===null?'#888':diff<0?'#DC2626':diff<=7?'#D97706':'#666';
        return`<div class="flow-row"><div class="flow-icon in">⬆️</div><div><div class="flow-detail"><strong>${o.invoice_number||'(Draft)'}</strong> — ${o.customer_name||'–'}</div><div class="flow-meta">${fd(o.order_date)} · Due: ${fd(o.due_date)} · Total: ${rp(o.grand_total)}${o.amount_paid>0?` · Dibayar: ${rp(o.amount_paid)}`:''}</div></div><div class="flow-amount in">${rp(o.outstanding)}</div><div class="flow-date" style="color:${dateColor};font-weight:700">${dateLabel}</div></div>`;
      }).join('');
    }
    const fcUpcoming=[];
    FC_TEMPLATES.forEach(fc=>{
      if(!fc.is_active)return;

        const targetDate=new Date(today.getFullYear(),today.getMonth()+m,Math.min(fc.day_of_month,new Date(today.getFullYear(),today.getMonth()+m+1,0).getDate()));
        const diff=Math.ceil((targetDate-today)/(1000*60*60*24));
        if(diff>=0&&diff<=30){
          if(fc.end_date&&new Date(fc.end_date)<targetDate)continue;
          const exists=EXPENSES.find(e=>e.recurring_template_id===fc.id&&new Date(e.expense_date).getMonth()===targetDate.getMonth()&&new Date(e.expense_date).getFullYear()===targetDate.getFullYear());
          if(!exists)fcUpcoming.push({date:targetDate,amount:num(fc.amount),name:fc.template_name,id:fc.id,diff});
        }
      }
    });
    fcUpcoming.sort((a,b)=>a.date-b.date);
    const totalUp=fcUpcoming.reduce((s,f)=>s+f.amount,0);
    set('pay-total',rp(totalUp));set('pay-sub',`${fcUpcoming.length} FC akan auto-generate`);
    const fcEl=document.getElementById('fc-upcoming');

    }
  }

  function onPeriodTypeChange(){
    const t=document.getElementById('period-type').value;
    ['period-month','period-quarter','period-year'].forEach(id=>{const e=document.getElementById(id);if(e)e.style.display='none';});

  function getPeriodRange(){
    const t=document.getElementById('period-type').value;
    if(t==='month'){const y=parseInt(document.getElementById('sel-year').value);const m=parseInt(document.getElementById('sel-month').value);return{from:new Date(y,m,1),to:new Date(y,m+1,0,23,59,59),days:new Date(y,m+1,0).getDate(),label:new Date(y,m,1).toLocaleDateString('id-ID',{month:'long',year:'numeric'})};}
    if(t==='quarter'){const y=parseInt(document.getElementById('sel-year-q').value);const q=parseInt(document.getElementById('sel-quarter').value);const sm=(q-1)*3;const f=new Date(y,sm,1);const tt=new Date(y,sm+3,0,23,59,59);return{from:f,to:tt,days:Math.ceil((tt-f)/(1000*60*60*24)),label:`Q${q} ${y}`};}
    if(t==='year'){const y=parseInt(document.getElementById('sel-year-y').value);return{from:new Date(y,0,1),to:new Date(y,11,31,23,59,59),days:365,label:`Tahun ${y}`};}

  }

  function getPrevPeriod(period){
    const dur=period.to.getTime()-period.from.getTime();

  }

  function calcMetrics(period){
    const inRange=d=>{const dt=new Date(d);return dt>=period.from&&dt<=period.to;};
    const ttSess=LIVESTREAM_SESSIONS.filter(s=>s.platform==='tiktok'&&inRange(s.session_date));
    const shSess=LIVESTREAM_SESSIONS.filter(s=>s.platform==='shopee'&&inRange(s.session_date));
    const ttIds=ttSess.map(s=>s.id),shIds=shSess.map(s=>s.id);
    // Ecommerce Import Excel (non-Live) ikut dihitung — samakan dengan Income Statement
    const ecomOrderById={};SALES_ORDERS.filter(o=>o.channel==='ecommerce'&&inRange(o.order_date)).forEach(o=>{ecomOrderById[o.id]=o;});
    const isImportItem=i=>!i.livestream_session_id&&!!ecomOrderById[i.order_id];
    const importPlat=i=>/shopee/i.test((ecomOrderById[i.order_id]||{}).customer_name||'')?'shopee':'tiktok';
    const ttItems=ORDER_ITEMS.filter(i=>ttIds.includes(i.livestream_session_id)||(isImportItem(i)&&importPlat(i)==='tiktok'));
    const shItems=ORDER_ITEMS.filter(i=>shIds.includes(i.livestream_session_id)||(isImportItem(i)&&importPlat(i)==='shopee'));
    const ttRev=ttItems.reduce((s,i)=>s+num(i.qty)*num(i.sell_price),0);
    const shRev=shItems.reduce((s,i)=>s+num(i.qty)*num(i.sell_price),0);
    const b2bOrders=SALES_ORDERS.filter(o=>o.channel==='b2b'&&inRange(o.order_date)&&['sent','partial_paid','paid'].includes(o.workflow_status));
    const b2bRev=b2bOrders.reduce((s,o)=>s+num(o.subtotal),0);
    const totalRev=ttRev+shRev+b2bRev;
    const liveCOGS=[...ttItems,...shItems].reduce((s,i)=>s+num(i.cogs_total),0);
    const b2bIds=b2bOrders.map(o=>o.id);
    const b2bCOGS=ORDER_ITEMS.filter(i=>b2bIds.includes(i.order_id)).reduce((s,i)=>s+num(i.cogs_total),0);
    const totalCOGS=liveCOGS+b2bCOGS;
    const ttCOGS=ttItems.reduce((s,i)=>s+num(i.cogs_total),0);
    const shCOGS=shItems.reduce((s,i)=>s+num(i.cogs_total),0);
    // NSA / Marketplace costs — total + per platform
    const nsaInPeriod=NSA_RECORDS.filter(n=>n.match_status==='matched'&&n.settled_date&&inRange(n.settled_date));
    const marketplaceCosts=nsaInPeriod.reduce((s,n)=>s+num(n.total_marketplace_costs),0);
    const ttMpCost=nsaInPeriod.filter(n=>n.platform==='tiktok').reduce((s,n)=>s+num(n.total_marketplace_costs),0);
    const shMpCost=nsaInPeriod.filter(n=>n.platform==='shopee').reduce((s,n)=>s+num(n.total_marketplace_costs),0);
    const totalNSAReceived=nsaInPeriod.reduce((s,n)=>s+num(n.nsa_amount),0);
    const otherInc=INCOME.filter(i=>inRange(i.income_date)).reduce((s,i)=>s+num(i.amount),0);
    const periodExp=EXPENSES.filter(e=>inRange(e.accrual_date||e.expense_date));
    const expByCat={};
    CATEGORIES.forEach(c=>expByCat[c.category_code]=0);
    periodExp.forEach(e=>{const cat=CATEGORIES.find(c=>c.id===e.category_id);if(cat)expByCat[cat.category_code]+=num(e.amount);});
    const totalExp=periodExp.reduce((s,e)=>s+num(e.amount),0);
    const fcExp=periodExp.filter(e=>e.cost_type==='fixed').reduce((s,e)=>s+num(e.amount),0);
    const vcExp=totalExp-fcExp;
    const adsExp=periodExp.filter(e=>{const cat=CATEGORIES.find(c=>c.id===e.category_id);const nm=(((cat&&cat.category_name)||'')+' '+((cat&&cat.category_code)||'')+' '+(e.description||'')).toLowerCase();return /iklan|ads|advertis|marketing/.test(nm);}).reduce((s,e)=>s+num(e.amount),0);
    const grossProfit=totalRev-totalCOGS; // textbook (sebelum potongan marketplace)
    const realGrossProfit=totalRev-marketplaceCosts-totalCOGS; // REAL: (NSA − COGS), karena NSA = gross − potongan MP
    const operatingProfit=grossProfit-totalExp+otherInc-marketplaceCosts;
    const netProfitFinal=totalRev-totalCOGS-marketplaceCosts-totalExp+otherInc;
    const ebitda=netProfitFinal+(expByCat['ADMIN']||0)*0.3;
    const currentCash=ACCOUNTS.reduce((sum,a)=>{
      let bal=num(a.initial_balance);
      MOVEMENTS.filter(m=>m.account_id===a.id).sort((x,y)=>new Date(x.movement_date)-new Date(y.movement_date)||new Date(x.created_at||0)-new Date(y.created_at||0)).forEach(m=>{
        if(m.movement_type==='inflow'||m.movement_type==='transfer_in')bal+=num(m.amount);
        else if(m.movement_type==='outflow'||m.movement_type==='transfer_out')bal-=num(m.amount);
        else if(m.movement_type==='adjustment')bal=num(m.amount);
      });
      return sum+bal;
    },0);
    const inventoryValue=PRODUCTS.reduce((s,p)=>{
      const batches=PURCHASE_BATCHES.filter(b=>b.product_id===p.id);
      return s+batches.reduce((sb,b)=>sb+num(b.qty_remaining)*num(b.landed_cost_per_unit),0);
    },0);
    const receivables=SALES_ORDERS.filter(o=>['sent','partial_paid'].includes(o.workflow_status)).reduce((s,o)=>s+(num(o.grand_total)-num(o.amount_paid)),0);
    // Hutang usaha (Accounts Payable) — batch belum lunas
    const payablesOutstanding=PURCHASE_BATCHES.filter(b=>b.payment_status==='unpaid').reduce((s,b)=>s+num(b.qty_purchased)*num(b.landed_cost_per_unit),0);
    const avgInventory=inventoryValue;
    const inventoryTurnover=avgInventory>0?totalCOGS/avgInventory:0;
    const DIO=totalCOGS>0?(avgInventory/totalCOGS)*period.days:0;
    const dailyB2BRev=period.days>0?b2bRev/period.days:0;
    const DSO=dailyB2BRev>0?receivables/dailyB2BRev:0;
    const DPO=totalCOGS>0?(payablesOutstanding/totalCOGS)*period.days:0; // Days Payable Outstanding
    const CCC=DIO+DSO-DPO; // Cash Conversion Cycle (sekarang sadar-hutang)
    const totalOrders=ttItems.length+shItems.length+b2bOrders.length;
    const aov=totalOrders>0?totalRev/totalOrders:0;
    const aovLive=(ttItems.length+shItems.length)>0?(ttRev+shRev)/(ttItems.length+shItems.length):0;
    const aovB2B=b2bOrders.length>0?b2bRev/b2bOrders.length:0;
    const dailyRev=period.days>0?totalRev/period.days:0;
    const dailyExp=period.days>0?totalExp/period.days:0;
    const cashRunway=dailyExp>0?currentCash/dailyExp:0;
    const burnRate=dailyExp;
    return {ttRev,shRev,b2bRev,totalRev,ttCOGS,shCOGS,liveCOGS,b2bCOGS,totalCOGS,
      grossProfit,realGrossProfit,operatingProfit,netProfit:netProfitFinal,ebitda,
      marketplaceCosts,ttMpCost,shMpCost,totalNSAReceived,otherInc,
      expByCat,totalExp,fcExp,vcExp,adsExp,
      currentCash,inventoryValue,receivables,payablesOutstanding,
      inventoryTurnover,DIO,DSO,DPO,CCC,
      aov,aovLive,aovB2B,totalOrders,
      dailyRev,dailyExp,cashRunway,burnRate,
      ttOrders:ttItems.length,shOrders:shItems.length,b2bOrdersCount:b2bOrders.length};
  }

  function assess(value,thresholds){
    if(thresholds.invert){if(value<=thresholds.good)return 'good';if(value<=thresholds.warn)return 'warn';return 'bad';}
    if(value>=thresholds.good)return 'good';if(value>=thresholds.warn)return 'warn';return 'bad';
  }
  function trendArrow(cur,prev){
    if(prev===0||!isFinite(prev))return '';
    const change=((cur-prev)/Math.abs(prev))*100;
    if(Math.abs(change)<1)return '<span style="color:#888">→ flat</span>';
    const dir=change>0?'up':'down';
    return `<span class="rc-trend ${dir}">${dir==='up'?'↑':'↓'} ${Math.abs(change).toFixed(1)}%</span>`;
  }

    const period=getPeriodRange();

    renderHero(m,mp,period);renderHeadline(m,mp);renderProfSummary(m,mp);
    renderProfitability(m,mp);renderCost(m,mp);renderLiquidity(m,mp,period);
    renderEfficiency(m,mp,period);renderGrowth(m,mp);renderChannel(m,mp);renderRiskAlerts(m,period);renderROAS(m);

  // ── ROAS BEP — minimal ROAS agar balik modal (Fix Cost + Ads, GPM) ──
  function renderROAS(m){
    const set=(id,v)=>{const e=document.getElementById(id);if(e&&document.activeElement!==e)e.value=v;};
    const gm=m.totalRev>0?(m.grossProfit/m.totalRev*100):0;
    set('roas-fc',Math.round(m.fcExp||0));
    set('roas-ads',Math.round(m.adsExp||0));
    set('roas-gpm',gm?gm.toFixed(1):'');
    const hint=(id,t)=>{const e=document.getElementById(id);if(e)e.textContent=t;};
    hint('roas-fc-hint',m.fcExp>0?'auto: biaya bertanda "fixed" periode ini':'tandai biaya tetap di Pengeluaran, atau isi manual');
    hint('roas-ads-hint',m.adsExp>0?'auto: belanja iklan terdeteksi':'isi budget iklan (kategori/desc "iklan/ads")');
    hint('roas-gpm-hint',gm?'auto: (Revenue−COGS)/Revenue — bisa diubah':'belum ada penjualan periode ini');
    const el=document.getElementById('roas-result');if(el)el.dataset.actualRev=m.totalRev||0;
    computeROAS();
  }
  function computeROAS(){
    const el=document.getElementById('roas-result');if(!el)return;
    const g=id=>{const n=parseFloat((document.getElementById(id)||{}).value);return isNaN(n)?0:n;};
    const fc=g('roas-fc'),ads=g('roas-ads'),gpm=g('roas-gpm');
    const rp=n=>window.YANZ.fmt.rp(Math.round(n||0));
    const totalCost=fc+ads,gpmFrac=gpm/100;
    const bepSales=gpmFrac>0?totalCost/gpmFrac:0;
    const roasBep=ads>0&&bepSales>0?bepSales/ads:0;
    const actualRev=parseFloat(el.dataset.actualRev)||0;
    const actualRoas=ads>0?actualRev/ads:0;
    let html=`<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px">
      <div class="ratio-card info"><div class="rc-name">Total Cost</div><div class="rc-value">${rp(totalCost)}</div><div class="rc-interp">Fix Cost + Ads Budget</div></div>
      <div class="ratio-card info"><div class="rc-name">BEP Sales</div><div class="rc-value">${gpmFrac>0?rp(bepSales):'–'}</div><div class="rc-interp">Penjualan minimal agar balik modal${gpmFrac>0?'':' — isi GPM dulu'}</div></div>
      <div class="ratio-card ${roasBep>0?'good':'warn'}"><div class="rc-name">ROAS BEP</div><div class="rc-value">${roasBep>0?roasBep.toFixed(2)+'×':'–'}</div><div class="rc-interp">${roasBep>0?'Tiap Rp1 iklan wajib hasilkan Rp'+roasBep.toFixed(2)+' penjualan':'isi Ads Budget & GPM'}</div></div>
    </div>`;
    if(ads>0&&actualRev>0&&roasBep>0){
      const ok=actualRoas>=roasBep,sur=Math.abs(actualRoas-roasBep);
      html+=`<div style="margin-top:14px;padding:14px;border-radius:10px;background:${ok?'#F0FDF4':'#FEF2F2'};border:1px solid ${ok?'#BBF7D0':'#FECACA'}">
        <div style="font-size:12px;color:#555">ROAS Aktual periode ini (Revenue ÷ Ads) = <strong>${actualRoas.toFixed(2)}×</strong> · target BEP <strong>${roasBep.toFixed(2)}×</strong></div>
        <div style="font-weight:800;margin-top:4px;color:${ok?'#16A34A':'#DC2626'}">${ok?'✓ Di atas BEP — iklan sudah untung ('+sur.toFixed(2)+'× di atas BEP)':'✗ Di bawah BEP — iklan belum balik modal ('+sur.toFixed(2)+'× kurang)'}</div>
      </div>`;
    }
    html+=`<p style="font-size:11px;color:#888;margin-top:12px">Rumus: Total Cost = Fix Cost + Ads · BEP Sales = Total Cost ÷ GPM% · ROAS BEP = BEP Sales ÷ Ads. GPM versi textbook (sebelum potongan marketplace). Contoh: FC 5jt + Ads 5jt, GPM 50% → BEP Sales 20jt → ROAS BEP 4×.</p>`;
    el.innerHTML=html;
  }

      {name:'Days Sales Outstanding (B2B)',value:fmtD(m.DSO),raw:m.DSO,formula:'(AR / B2B Rev) × Days',interp:'Berapa hari kolek piutang',bench:'Ideal: ≤30 hari (matching TOP)',th:{good:30,warn:60,invert:true}},

      {name:'Cash Conversion Cycle',value:fmtD(m.CCC),raw:m.CCC,formula:'DIO + DSO − DPO',interp:'Hari dari keluar uang beli stok sampai terima cash, dikurangi tempo hutang. Makin pendek/negatif = makin efisien.',bench:'Lebih pendek = lebih efisien; negatif = supplier mendanai operasional',th:{good:60,warn:100,invert:true}},
      {name:'Revenue per Day',value:rp(m.dailyRev),raw:m.dailyRev,formula:'Total Revenue / Days',interp:'Daily revenue rata-rata',bench:`${rp(m.dailyRev*30)} per bulan ekspektasi`},
      {name:'Asset Productivity (proxy)',value:m.inventoryValue>0?fmtX(m.totalRev/m.inventoryValue):'—',raw:m.inventoryValue>0?m.totalRev/m.inventoryValue:0,formula:'Revenue / Inventory Value',interp:'Berapa kali inventory menghasilkan revenue',bench:'Semakin tinggi semakin baik',th:{good:2,warn:1}},

      {name:'OpEx per Order',value:m.totalOrders>0?rp(m.totalExp/m.totalOrders):'—',raw:0,formula:'OpEx / Total Orders',interp:'Cost untuk handle 1 order',bench:'Lebih rendah = scalable'}

  function renderGrowth(m,mp){
    const revGrowth=mp.totalRev>0?(m.totalRev-mp.totalRev)/mp.totalRev*100:0;
    const npGrowth=mp.netProfit!==0?(m.netProfit-mp.netProfit)/Math.abs(mp.netProfit)*100:0;
    const orderGrowth=mp.totalOrders>0?(m.totalOrders-mp.totalOrders)/mp.totalOrders*100:0;
    const aovGrowth=mp.aov>0?(m.aov-mp.aov)/mp.aov*100:0;
    const ttGrowth=mp.ttRev>0?(m.ttRev-mp.ttRev)/mp.ttRev*100:0;
    const shGrowth=mp.shRev>0?(m.shRev-mp.shRev)/mp.shRev*100:0;
    const b2bGrowth=mp.b2bRev>0?(m.b2bRev-mp.b2bRev)/mp.b2bRev*100:0;
    const cogsGrowth=mp.totalCOGS>0?(m.totalCOGS-mp.totalCOGS)/mp.totalCOGS*100:0;
    const arr=[
      {name:'Revenue Growth',value:(revGrowth>=0?'+':'')+fmt(revGrowth,1)+'%',raw:revGrowth,formula:'(Rev now − Rev prev) / Rev prev',interp:'Pertumbuhan revenue vs periode sebelumnya',bench:'Ideal UMKM: ≥10% MoM',th:{good:10,warn:0}},
      {name:'Net Profit Growth',value:(npGrowth>=0?'+':'')+fmt(npGrowth,1)+'%',raw:npGrowth,formula:'(NP now − NP prev) / |NP prev|',interp:'Pertumbuhan laba bersih',bench:'Harus positif dan ≥ Revenue growth',th:{good:10,warn:0}},
      {name:'Order Volume Growth',value:(orderGrowth>=0?'+':'')+fmt(orderGrowth,1)+'%',raw:orderGrowth,formula:'(Orders now − prev) / prev',interp:'Pertumbuhan jumlah pesanan',bench:'Healthy: ≥5%',th:{good:5,warn:0}},
      {name:'AOV Growth',value:(aovGrowth>=0?'+':'')+fmt(aovGrowth,1)+'%',raw:aovGrowth,formula:'(AOV now − prev) / prev',interp:'Rata-rata pesanan naik?',bench:'Positif = upselling berhasil'},
      {name:'TikTok Growth',value:(ttGrowth>=0?'+':'')+fmt(ttGrowth,1)+'%',raw:ttGrowth,formula:'(TT Rev now − prev) / prev',interp:'Performa channel TikTok'},

  function renderRiskAlerts(m,period){

    if(pct(m.totalCOGS,m.totalRev)>70)alerts.push({lvl:'warn',msg:`⚠️ COGS ratio ${fmt(pct(m.totalCOGS,m.totalRev),1)}% — margin tertekan`});
    if(pct(m.marketplaceCosts,m.totalRev)>20)alerts.push({lvl:'warn',msg:`⚠️ Marketplace fee ratio ${fmt(pct(m.marketplaceCosts,m.totalRev),1)}% — coba kurangi GMV Max/ADS`});

  }

// ── MODULE: Absensi (Sub-fase 6.4) ───────────────────────────────────────────
(function(){
  const api=(...a)=>window.YANZ.api(...a);
  const toast=(...a)=>window.YANZ.toast(...a);
  const num=n=>window.YANZ.fmt.num(n);
  const fd=d=>window.YANZ.fmt.fd(d);
  const fmtTime=ts=>{if(!ts)return '–';return new Date(ts).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});};
  const localDateStr=(d=new Date())=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  const durHM=a=>{if(!a.check_in||!a.check_out)return '–';const mins=(new Date(a.check_out)-new Date(a.check_in))/60000;if(mins<0)return '–';return Math.floor(mins/60)+'j '+Math.round(mins%60)+'m';};

  const TABS=['report','offices','payroll','my-history'];
  let role='owner';
  let OFFICES=[],ATTENDANCE=[],STAFF=[];
  let _focusHandler=null,_lastRefresh=0;
  const rootEl=()=>document.querySelector('.module-att');

  async function loadAll(){
    _lastRefresh=Date.now();
    setDB(false,'Menghubungkan…');
    try{
      const isOwner=role==='owner';
      OFFICES=await api('yanz_offices?order=display_order,name');
      if(isOwner){
        [STAFF,ATTENDANCE]=await Promise.all([
          api('yanz_staff?is_active=eq.true&order=staff_name'),
          api('yanz_attendance?order=attend_date.desc,check_in.desc&limit=1500')
        ]);
      }else{
        ATTENDANCE=await api('yanz_attendance?staff_id=eq.'+window.YANZ.staffId+'&order=attend_date.desc&limit=365');
      }
      setDB(true,'Terhubung ✓ — '+OFFICES.filter(o=>o.is_active!==false).length+' kantor');
      fillStaffFilter();
      renderAll();
    }catch(e){setDB(false,'❌ Absensi belum aktif — jalankan migration yanz_attendance_tables.sql ('+e.message+')');console.warn(e);}
  }

  function fillStaffFilter(){
    const sel=document.getElementById('rep-staff');if(!sel)return;
    sel.innerHTML='<option value="">Semua staff</option>'+STAFF.map(s=>`<option value="${s.id}">${s.staff_name}</option>`).join('');
  }

  function renderAll(){renderReport();renderOffices();renderPayroll();renderMyHistory();}

  function officeName(id){return OFFICES.find(o=>o.id===id)?.name||'–';}
  function staffName(id){return STAFF.find(s=>s.id===id)?.staff_name||'–';}
  function staffOf(id){return STAFF.find(s=>s.id===id)||null;}

  // Deteksi telat — aktif otomatis begitu karyawan punya jam_masuk (fitur Data Karyawan).
  // Host live dikecualikan (is_host) karena jam kerjanya tidak dipatok.
  function lateEnabled(sid){const s=staffOf(sid);return !!(s&&s.work_start&&!s.is_host);}
  function isLate(a){
    const s=staffOf(a.staff_id);
    if(!s||!s.work_start||s.is_host||!a.check_in)return false;
    const [hh,mm]=String(s.work_start).split(':').map(Number);
    if(isNaN(hh)||isNaN(mm))return false;
    const ci=new Date(a.check_in);
    const limit=new Date(ci);limit.setHours(hh,mm+(num(s.late_grace_min)||0),0,0);
    return ci>limit;
  }
  function lateBadge(a){return isLate(a)?' <span class="bx br" style="font-size:9px">TELAT</span>':'';}
  const minutesOf=a=>{if(!a.check_in||!a.check_out)return 0;const m=(new Date(a.check_out)-new Date(a.check_in))/60000;return m>0?m:0;};
  const fmtDur=mins=>Math.floor(mins/60)+'j '+Math.round(mins%60)+'m';

  // ── REPORT (owner) ──
  function renderReport(){
    const el=document.getElementById('report-list');if(!el)return;
    const from=document.getElementById('rep-from')?.value;
    const to=document.getElementById('rep-to')?.value;
    const fStaff=document.getElementById('rep-staff')?.value||'';
    let list=[...ATTENDANCE];
    if(from)list=list.filter(a=>a.attend_date>=from);
    if(to)list=list.filter(a=>a.attend_date<=to);
    if(fStaff)list=list.filter(a=>a.staff_id===fStaff);
    // KPIs
    const today=localDateStr();
    const hadirToday=new Set(ATTENDANCE.filter(a=>a.attend_date===today&&a.check_in).map(a=>a.staff_id)).size;
    const totalOT=list.reduce((s,a)=>s+num(a.overtime_hours),0);
    const setK=(id,v)=>{const e=document.getElementById(id);if(e)e.textContent=v;};
    setK('kpi-hadir',hadirToday);setK('kpi-records',list.length);setK('kpi-ot',totalOT+' jam');setK('kpi-offices',OFFICES.filter(o=>o.is_active!==false).length);
    if(!list.length){el.innerHTML='<div class="empty">Tidak ada data absensi di filter ini.</div>';return;}

    const rowHtml=a=>`<tr><td>${fd(a.attend_date)}</td>${fStaff?'':`<td style="font-weight:600">${staffName(a.staff_id)}</td>`}<td>${officeName(a.office_id)}</td><td><span class="bx bg">${fmtTime(a.check_in)}</span>${lateBadge(a)}</td><td>${a.check_out?'<span class="bx br">'+fmtTime(a.check_out)+'</span>':'<span class="bx ba">belum out</span>'}</td><td>${durHM(a)}</td><td>${num(a.overtime_hours)?num(a.overtime_hours)+' jam':'–'}</td></tr>`;
    const headCols=`<th>Tanggal</th>${fStaff?'':'<th>Karyawan</th>'}<th>Kantor</th><th>Check-in</th><th>Check-out</th><th>Durasi</th><th>Lembur</th>`;
    let html='';

    if(!fStaff){
      // Ringkasan per karyawan (klik nama → lihat detail orang itu)
      const byStaff=new Map();
      list.forEach(a=>{
        if(!byStaff.has(a.staff_id))byStaff.set(a.staff_id,{days:new Set(),mins:0,ot:0,late:0});
        const g=byStaff.get(a.staff_id);
        if(a.check_in)g.days.add(a.attend_date);
        g.mins+=minutesOf(a);g.ot+=num(a.overtime_hours);if(isLate(a))g.late++;

  function daysUntilPayday(day){
    day=parseInt(day);if(!day||day<1||day>31)return null;
    const today=new Date();today.setHours(0,0,0,0);
    let next=new Date(today.getFullYear(),today.getMonth(),day);
    if(next<today)next=new Date(today.getFullYear(),today.getMonth()+1,day);
    return Math.round((next-today)/86400000);

        return`<tr data-fixed="${r.fixed}"><td style="font-weight:600">${r.s.staff_name}${hostBadge}</td><td class="num">${r.days} hr</td><td class="num">${r.ot?r.ot+' j':'–'}</td><td class="num">${lateEnabled(r.s.id)?(r.late?'<span class="bx br">'+r.late+'×</span>':'0'):'–'}</td><td class="num">${rp(r.base)}</td><td class="num">${rp(r.transport)}</td><td class="num">${rp(r.lembur)}</td><td class="num"><input type="number" min="0" value="0" id="pay-com-${r.s.id}" oninput="att.recalcPayroll()" style="width:110px;padding:5px 7px;border:1.5px solid #E8E6E0;border-radius:6px;font-size:12px;text-align:right;font-family:inherit" /></td><td class="num" id="pay-total-${r.s.id}" style="font-weight:800">${rp(r.fixed)}</td><td style="font-size:11px">${pd}</td></tr>`;

// ── MODULE: Smart Stock / Velocity (Sub-fase 6.4) ────────────────────────────
(function(){
  const api=(...a)=>window.YANZ.api(...a);
  const toast=(...a)=>window.YANZ.toast(...a);
  const rp=n=>window.YANZ.fmt.rp(n);

  const decim=(n,d=2)=>{n=num(n);return n.toFixed(d).replace(/\.?0+$/,'')||'0';};

  const WINDOW_DAYS=60,WINSORIZE_PERCENTILE=90,PEAK_PERCENTILE=90;
  const TABS=['dashboard','recommend','history','settings'];
  const SERVICE_LEVEL_PRESETS={98:{label:'🟢 Stok Aman',hint:'Best-seller'},95:{label:'🔵 Seimbang',hint:'Default'},90:{label:'🟡 Hemat Modal',hint:'Slow-mover'}};

  let role='owner';
  let PRODUCTS=[],BATCHES=[],SNAPSHOTS=[];
  let TEMPO_PRODUCTS=new Set();
  let SORT_FIELD='days',SORT_DIR='asc';
  const rootEl=()=>document.querySelector('.module-velocity');
  const isOwner=()=>role==='owner';

  function setDB(ok,msg){const d=document.getElementById('dbd');if(d)d.className='dbd'+(ok?' on':'');const t=document.getElementById('dbt');if(t)t.textContent=msg;}
  function go(id){

    if(id==='settings')renderSettings();
    if(id==='history')renderHistory();
    if(id==='recommend')renderRecommendations();
