<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>YANZ Operations Platform</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,system-ui,-apple-system,sans-serif}
html,body{height:100%}
body{background:#F7F6F2;color:#1C1C1A;font-size:13px;overflow:hidden}

/* ════════════════════════════════════════════════════════════
   LOGIN SCREEN
   ════════════════════════════════════════════════════════════ */
.login-bg{position:fixed;inset:0;background:linear-gradient(135deg,#1C1C1A 0%,#2A2A28 100%);display:flex;align-items:center;justify-content:center;padding:20px;z-index:100}
.login-card{background:#fff;border-radius:18px;padding:36px 32px;width:420px;max-width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.login-brand{display:flex;align-items:center;gap:12px;margin-bottom:24px;justify-content:center}
.login-brand .bmark{width:48px;height:48px;background:#1C1C1A;border-radius:11px;color:#E8FF5A;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:22px}
.login-brand .bname{font-weight:800;font-size:24px;letter-spacing:.5px}
.login-card h2{font-size:18px;font-weight:700;margin-bottom:6px;text-align:center}
.login-card .subtitle{font-size:12px;color:#888;text-align:center;margin-bottom:24px}
.login-card .fld{margin-bottom:14px}
.login-card label{display:block;font-size:11px;font-weight:700;color:#666;margin-bottom:6px;text-transform:uppercase;letter-spacing:.3px}
.login-card input{width:100%;padding:11px 13px;border:1.5px solid #E8E6E0;border-radius:9px;font-size:14px;font-family:inherit}
.login-card input:focus{outline:none;border-color:#1C1C1A}
.login-card button[type=submit]{width:100%;padding:13px;background:#1C1C1A;color:#E8FF5A;border:none;border-radius:9px;font-weight:700;font-size:14px;cursor:pointer;margin-top:6px;font-family:inherit}
.login-card button[type=submit]:hover{background:#000}
.login-card button[type=submit]:disabled{opacity:.5;cursor:not-allowed}
.login-toggle{text-align:center;margin-top:16px;font-size:12px;color:#666}
.login-toggle a{color:#1C1C1A;font-weight:600;text-decoration:underline;cursor:pointer}
.login-error{background:#FEE2E2;color:#DC2626;padding:10px 12px;border-radius:8px;font-size:12px;margin-bottom:14px;display:none}
.login-error.show{display:block}
.login-success{background:#F0FDF4;color:#15803D;padding:10px 12px;border-radius:8px;font-size:12px;margin-bottom:14px;display:none}
.login-success.show{display:block}

/* ════════════════════════════════════════════════════════════
   APP SHELL — Sidebar + Main Content
   ════════════════════════════════════════════════════════════ */
.app-layout{display:grid;grid-template-columns:260px 1fr;height:100vh}

/* Sidebar */
.sidebar{background:#1C1C1A;color:#fff;display:flex;flex-direction:column;height:100vh;overflow:hidden}
.sidebar-brand{padding:18px 20px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #2A2A28;flex-shrink:0}
.sidebar-brand .bmark{width:32px;height:32px;background:#E8FF5A;border-radius:8px;color:#1C1C1A;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px}
.sidebar-brand .bname{font-weight:800;font-size:15px;letter-spacing:.4px}
.sidebar-nav{flex:1;overflow-y:auto;padding:14px 0}
.nav-section{margin-bottom:6px}
.nav-section-label{padding:10px 20px 6px;font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:#666;font-weight:700}
.nav-item{display:flex;align-items:center;gap:11px;padding:9px 20px;font-size:13px;color:#bbb;cursor:pointer;border:none;background:transparent;width:100%;text-align:left;font-family:inherit;transition:.12s;position:relative}
.nav-item:hover{background:#252523;color:#fff}
.nav-item.active{background:#252523;color:#E8FF5A;font-weight:600}
.nav-item.active::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:#E8FF5A}
.nav-item .icon{font-size:15px;width:20px;text-align:center;flex-shrink:0}
.nav-item .label{flex:1;line-height:1.3}
.nav-item .badge{background:#DC2626;color:#fff;font-size:10px;padding:1px 7px;border-radius:10px;font-weight:700}
.sidebar-user{padding:14px 16px;border-top:1px solid #2A2A28;display:flex;align-items:center;gap:10px;flex-shrink:0;background:#161614}
.user-avatar{width:34px;height:34px;border-radius:50%;background:#E8FF5A;color:#1C1C1A;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex-shrink:0}
.user-info{flex:1;min-width:0}
.user-info .nm{font-size:12px;font-weight:700;color:#fff;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-info .rl{font-size:10px;color:#888;text-transform:uppercase;letter-spacing:.3px}
.btn-logout{background:transparent;border:1px solid #444;color:#888;width:28px;height:28px;border-radius:6px;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-family:inherit}
.btn-logout:hover{background:#DC2626;border-color:#DC2626;color:#fff}

/* Main content area */
.main-area{display:flex;flex-direction:column;height:100vh;overflow:hidden}
.top-bar{background:#fff;border-bottom:1px solid #E8E6E0;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.top-bar h1{font-size:17px;font-weight:800}
.top-bar .crumb{font-size:11px;color:#888;text-transform:uppercase;letter-spacing:.4px;margin-bottom:2px}
.module-container{flex:1;overflow-y:auto;padding:24px;background:#F7F6F2}

/* Mobile toggle */
.mobile-menu-btn{display:none;background:#1C1C1A;color:#fff;border:none;padding:8px 12px;border-radius:8px;cursor:pointer;font-size:14px}
.top-bar-actions{display:flex;align-items:center;gap:10px}

/* Shell-level Notification Center (Sub-fase 6.5 — smart triggers) */
.shell-notif{position:relative}
.shell-notif-bell{position:relative;background:#F7F6F2;border:1px solid #E8E6E0;border-radius:10px;padding:7px 11px;font-size:17px;cursor:pointer;line-height:1;transition:.15s}
.shell-notif-bell:hover{background:#E8E6E0}
.shell-notif-badge{position:absolute;top:-5px;right:-5px;background:#DC2626;color:#fff;font-size:10px;font-weight:800;min-width:17px;height:17px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px;border:2px solid #fff}
.shell-notif-panel{display:none;position:absolute;top:48px;right:0;width:360px;max-width:88vw;max-height:70vh;overflow-y:auto;background:#fff;border:1px solid #E8E6E0;border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.16);z-index:60}
.shell-notif-panel.show{display:block}
.shell-notif-head{display:flex;align-items:center;justify-content:space-between;padding:13px 15px;border-bottom:1px solid #F0EDE8;font-size:13px;font-weight:800;position:sticky;top:0;background:#fff;border-radius:12px 12px 0 0}
.shell-notif-readall{background:none;border:none;color:#1C1C1A;font-size:11px;font-weight:700;cursor:pointer;text-decoration:underline;font-family:inherit}
.shell-notif-sec{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:#888;padding:11px 15px 5px}
.shell-notif-item{display:flex;gap:10px;align-items:flex-start;padding:11px 15px;border-bottom:1px solid #F5F3EE;cursor:pointer;transition:.12s}
.shell-notif-item:hover{background:#FAFAF8}
.shell-notif-item.unread{background:#FFFBEB}
.shell-notif-item.alert{background:#FEF2F2}
.shell-notif-item.alert:hover{background:#FEE2E2}
.shell-notif-item .ni-icon{font-size:16px;flex-shrink:0;line-height:1.3}
.shell-notif-item .ni-txt{flex:1;min-width:0}
.shell-notif-item .ni-title{font-size:12px;font-weight:700;line-height:1.35}
.shell-notif-item .ni-msg{font-size:11px;color:#666;line-height:1.4;margin-top:1px}
.shell-notif-item .ni-time{font-size:10px;color:#aaa;margin-top:3px}
.shell-notif-empty{padding:30px 15px;text-align:center;color:#999;font-size:12px}

/* Lonceng internal modul Tasks disembunyikan — digantikan lonceng shell global */
.module-tasks .notif-bell{display:none}

@media(max-width:780px){
  .app-layout{grid-template-columns:1fr}
  .sidebar{position:fixed;left:-260px;top:0;width:260px;z-index:50;transition:.3s}
  .sidebar.open{left:0}
  .mobile-menu-btn{display:inline-block}
  .shell-notif-panel{position:fixed;top:60px;right:10px;left:10px;width:auto;max-width:none}
}

/* ════════════════════════════════════════════════════════════
   MODULE PLACEHOLDER (untuk modul yang belum di-merge)
   ════════════════════════════════════════════════════════════ */
.placeholder{background:#fff;border:1px solid #E8E6E0;border-radius:14px;padding:40px;text-align:center;max-width:600px;margin:40px auto}
.placeholder .icon{font-size:56px;margin-bottom:14px}
.placeholder h2{font-size:18px;font-weight:800;margin-bottom:8px}
.placeholder p{font-size:13px;color:#666;line-height:1.6;margin-bottom:18px}
.placeholder .phase-tag{display:inline-block;background:#FEF3C7;color:#92400E;padding:4px 12px;border-radius:14px;font-size:11px;font-weight:700;margin-bottom:14px}
.placeholder .standalone-link{display:inline-block;padding:10px 16px;background:#F0EDE8;color:#1C1C1A;border-radius:8px;font-size:12px;font-weight:600;text-decoration:none;border:1px solid #E8E6E0}
.placeholder .standalone-link:hover{background:#E8E6E0}

/* ════════════════════════════════════════════════════════════
   HOME DASHBOARD
   ════════════════════════════════════════════════════════════ */
.home-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;max-width:1200px}
.home-card{background:#fff;border:1px solid #E8E6E0;border-radius:12px;padding:18px}
.home-card .ttl{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:#888;font-weight:700;margin-bottom:8px}
.home-card .big{font-size:24px;font-weight:800;margin-bottom:4px}
.home-card .sub{font-size:12px;color:#666}

.welcome-card{background:linear-gradient(135deg,#1C1C1A 0%,#2A2A28 100%);color:#fff;border-radius:14px;padding:24px;margin-bottom:18px;max-width:1200px}
.welcome-card h2{font-size:20px;font-weight:800;margin-bottom:6px}
.welcome-card p{font-size:13px;color:#bbb;line-height:1.6}
.welcome-card .accent{color:#E8FF5A;font-weight:700}

/* Absensi widget (Home staff) */
.att-widget{background:#fff;border:1.5px solid #E8E6E0;border-radius:14px;padding:18px 20px}
.att-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.att-title{font-size:14px;font-weight:800}
.att-date{font-size:11px;color:#888}
.att-row{display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap}
.att-fld{display:flex;flex-direction:column;gap:4px;flex:1;min-width:160px}
.att-fld label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:#888}
.att-fld select,.att-fld input{padding:9px 11px;border:1.5px solid #E8E6E0;border-radius:8px;font-size:13px;font-family:inherit;background:#fff}
.att-btn{padding:11px 18px;border-radius:9px;font-size:13px;font-weight:700;cursor:pointer;border:none;font-family:inherit;white-space:nowrap}
.att-in{background:#16A34A;color:#fff}
.att-out{background:#DC2626;color:#fff}
.att-s{background:#F0EDE8;color:#1C1C1A;border:1px solid #E8E6E0}
.att-hint{font-size:12px;color:#888;margin-top:10px}
.att-status{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:12px;background:#F7F6F2;border-radius:10px;padding:14px 16px}
.att-lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:#999;margin-bottom:3px}
.att-val{font-size:16px;font-weight:800}

/* Toast */
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1C1C1A;color:#E8FF5A;padding:11px 18px;border-radius:8px;font-size:12px;font-weight:600;opacity:0;pointer-events:none;transition:.3s;z-index:300;max-width:90vw}
#toast.show{opacity:1}

/* Loading */
.full-loader{position:fixed;inset:0;background:#F7F6F2;display:flex;align-items:center;justify-content:center;z-index:200}
.full-loader .spinner{width:40px;height:40px;border:3px solid #E8E6E0;border-top-color:#1C1C1A;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ════════════════════════════════════════════════════════════
   MODULE: TASKS (Sub-fase 6.2)
   All selectors scoped with .module-tasks to avoid bleed.
   ════════════════════════════════════════════════════════════ */
.module-tasks{font-size:14px}

/* Subtabs — flush with shell topbar, breaks out of module-container padding */
.module-tasks .tk-subtabs{display:flex;align-items:center;gap:2px;background:#fff;border-bottom:1px solid #E8E6E0;padding:0 20px;margin:-24px -24px 0 -24px;position:sticky;top:-24px;z-index:20;box-shadow:0 1px 4px rgba(0,0,0,.04);overflow-x:auto}
.module-tasks .tab{padding:13px 13px;font-size:12px;font-weight:600;color:#999;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;flex-shrink:0}
.module-tasks .tab:hover{color:#1C1C1A}
.module-tasks .tab.active{color:#1C1C1A;border-bottom-color:#1C1C1A}
.module-tasks .rtg{margin-left:auto;display:flex;gap:5px;padding:7px 0;align-items:center}

.module-tasks .notif-bell{position:relative;cursor:pointer;padding:4px 8px;font-size:18px}
.module-tasks .notif-badge{position:absolute;top:0;right:0;background:#DC2626;color:#fff;font-size:9px;font-weight:800;width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center}

.module-tasks .panel{display:none;padding:20px 0;max-width:1300px;margin:0 auto}
.module-tasks .panel.active{display:block}

.module-tasks .card{background:#fff;border-radius:12px;border:1px solid #E8E6E0;padding:18px;margin-bottom:14px}
.module-tasks .chd{font-size:13px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.module-tasks .dot{width:8px;height:8px;border-radius:50%}
.module-tasks .dg{background:#16A34A}.module-tasks .dr{background:#DC2626}.module-tasks .db{background:#2563EB}.module-tasks .dp{background:#7C3AED}.module-tasks .da{background:#D97706}.module-tasks .dpink{background:#EC4899}

.module-tasks .btn{padding:9px 16px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;border:none;font-family:inherit}
.module-tasks .btn-p{background:#1C1C1A;color:#E8FF5A}
.module-tasks .btn-p:hover{opacity:.82}
.module-tasks .btn-s{background:#F0EDE8;color:#1C1C1A;border:1px solid #E8E6E0}
.module-tasks .btn-d{background:#FEF2F2;color:#DC2626;border:1px solid #FECACA}
.module-tasks .btn-sm{padding:5px 11px;font-size:11px}

.module-tasks .dbs{display:flex;align-items:center;gap:8px;font-size:12px;color:#888;margin-bottom:12px;padding:8px 12px;background:#fff;border-radius:8px;border:1px solid #E8E6E0;justify-content:space-between}
.module-tasks .dbd{width:7px;height:7px;border-radius:50%;background:#D97706}
.module-tasks .dbd.on{background:#16A34A}

.module-tasks .fld{display:flex;flex-direction:column;gap:4px}
.module-tasks .fld label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:#888}
.module-tasks .fld input,.module-tasks .fld select,.module-tasks .fld textarea{padding:9px 11px;border:1.5px solid #E8E6E0;border-radius:8px;font-size:13px;background:#fff;font-family:inherit}
.module-tasks .fld textarea{resize:vertical;min-height:60px}
.module-tasks .fg2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.module-tasks .fg3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.module-tasks .fg4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:12px}

.module-tasks .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;display:flex;align-items:center;justify-content:center}
.module-tasks .modal{background:#fff;border-radius:14px;padding:24px;width:600px;max-width:95vw;max-height:90vh;overflow-y:auto}
.module-tasks .modal-hd{font-size:15px;font-weight:700;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center}
.module-tasks .modal-x{background:none;border:none;font-size:22px;cursor:pointer;color:#888;line-height:1}

/* Task cards */
.module-tasks .task-list{display:flex;flex-direction:column;gap:10px}
.module-tasks .task-card{background:#fff;border:1.5px solid #E8E6E0;border-radius:12px;padding:14px;border-left-width:4px;transition:all .15s}
.module-tasks .task-card:hover{border-color:#1C1C1A;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.module-tasks .task-card.priority-urgent{border-left-color:#DC2626}
.module-tasks .task-card.priority-high{border-left-color:#D97706}
.module-tasks .task-card.priority-medium{border-left-color:#2563EB}
.module-tasks .task-card.priority-low{border-left-color:#78716C}
.module-tasks .task-card.status-completed{opacity:.6;background:#FAFAF8}
.module-tasks .task-card.status-completed .task-title{text-decoration:line-through}
.module-tasks .task-card.overdue{background:#FEF2F2}

.module-tasks .task-header{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:8px}
.module-tasks .task-title{font-size:14px;font-weight:700;flex:1}
.module-tasks .task-desc{font-size:12px;color:#666;line-height:1.5;margin-bottom:10px}
.module-tasks .task-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:11px;color:#888;margin-bottom:10px}
.module-tasks .task-pill{font-size:10px;font-weight:700;padding:3px 8px;border-radius:5px;text-transform:uppercase;letter-spacing:.3px}
.module-tasks .pill-urgent{background:#FEF2F2;color:#DC2626}
.module-tasks .pill-high{background:#FFFBEB;color:#D97706}
.module-tasks .pill-medium{background:#EFF6FF;color:#2563EB}
.module-tasks .pill-low{background:#F5F5F4;color:#78716C}
.module-tasks .pill-pending{background:#FFFBEB;color:#D97706}
.module-tasks .pill-in_progress{background:#EFF6FF;color:#2563EB}
.module-tasks .pill-completed{background:#F0FDF4;color:#16A34A}
.module-tasks .pill-cancelled{background:#F5F5F4;color:#999}

.module-tasks .task-actions{display:flex;gap:6px;flex-wrap:wrap;padding-top:10px;border-top:1px solid #F0EDE8}

.module-tasks .deadline-pill{display:inline-block;padding:3px 8px;border-radius:5px;font-size:10px;font-weight:700;background:#F0EDE8;color:#666}
.module-tasks .deadline-pill.urgent{background:#FEF2F2;color:#DC2626}
.module-tasks .deadline-pill.soon{background:#FFFBEB;color:#D97706}
.module-tasks .deadline-pill.overdue{background:#1C1C1A;color:#E8FF5A;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.7}}

/* Staff cards (owner view) */
.module-tasks .staff-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-bottom:14px}
.module-tasks .staff-card{background:#fff;border:1.5px solid #E8E6E0;border-radius:12px;padding:16px;cursor:pointer;transition:all .15s}
.module-tasks .staff-card:hover{border-color:#1C1C1A;box-shadow:0 4px 12px rgba(0,0,0,.06)}
.module-tasks .staff-card-header{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.module-tasks .staff-card-avatar{width:36px;height:36px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;flex-shrink:0}
.module-tasks .staff-card-name{font-size:14px;font-weight:700}
.module-tasks .staff-card-role{font-size:11px;color:#888}
.module-tasks .staff-card-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center}
.module-tasks .staff-card-stat-num{font-size:18px;font-weight:800;color:#1C1C1A}
.module-tasks .staff-card-stat-lbl{font-size:9px;color:#888;text-transform:uppercase;font-weight:600}

/* KPI */
.module-tasks .kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.module-tasks .kpi{background:#fff;border:1px solid #E8E6E0;border-radius:10px;padding:14px}
.module-tasks .kpi-lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:#999;margin-bottom:5px}
.module-tasks .kpi-val{font-size:22px;font-weight:800;color:#1C1C1A}
.module-tasks .kpi-sub{font-size:11px;color:#888;margin-top:3px}
.module-tasks .kpi.pending .kpi-val{color:#D97706}
.module-tasks .kpi.progress .kpi-val{color:#2563EB}
.module-tasks .kpi.done .kpi-val{color:#16A34A}
.module-tasks .kpi.overdue .kpi-val{color:#DC2626}

/* Comments */
.module-tasks .comment-list{margin-top:14px;padding-top:14px;border-top:1px solid #F0EDE8;display:flex;flex-direction:column;gap:8px}
.module-tasks .comment{padding:10px 12px;border-radius:8px;font-size:13px;background:#FAFAF8}
.module-tasks .comment.owner{background:#EFF6FF;border-left:3px solid #2563EB}

async function api(path,opts={}){
  const session=window.YANZ.session;
  const token=session?.access_token||SUPA_KEY;
  const headers={
    'apikey':SUPA_KEY,
    'Authorization':'Bearer '+token,
    'Content-Type':'application/json',
    ...(opts.headers||{})
  };
  const {headers:_,...rest}=opts;
  const r=await fetch(SUPA_URL+'/rest/v1/'+path,{headers,...rest});
  const t=await r.text();
  if(!r.ok)throw new Error(r.status+': '+t.slice(0,200));
  return t?JSON.parse(t):[];
}

const rp=n=>'Rp '+(Math.round(n||0)).toLocaleString('id-ID');
const rpShort=n=>{const v=Math.round(n||0);const abs=Math.abs(v);const sign=v<0?'-':'';if(abs>=1e9)return sign+'Rp '+(abs/1e9).toFixed(2)+'M';if(abs>=1e6)return sign+'Rp '+(abs/1e6).toFixed(1)+'jt';if(abs>=1e3)return sign+'Rp '+(abs/1e3).toFixed(0)+'k';return rp(v);};
const num=n=>parseFloat(n)||0;
const fd=d=>d?new Date(d).toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'}):'–';
const fdt=d=>d?new Date(d).toLocaleString('id-ID',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'–';

// PUSAT NOTIFIKASI (shell-level smart triggers — Sub-fase 6.5)
// Gabung notif tersimpan (yanz_notifications) + alert bisnis live
// (stok kritis, hutang jatuh tempo, B2B overdue, NSA pending).
// Alert dihitung client-side tiap login + interval — tanpa migration.
// ════════════════════════════════════════════════════════════════
let _shellNotifInterval=null;
let _shellNotifPersisted=[];
let _shellSmartAlerts=[];
let _shellNotifClickBound=false;

function notifZ(pct){
  const t={85:1.04,90:1.28,93:1.48,95:1.65,97:1.88,98:2.05,99:2.33,99.5:2.58};
  const k=Object.keys(t).map(Number).sort((a,b)=>a-b);
  if(pct<=k[0])return t[k[0]];if(pct>=k[k.length-1])return t[k[k.length-1]];
  for(let i=0;i<k.length-1;i++){if(pct>=k[i]&&pct<=k[i+1]){const x=(pct-k[i])/(k[i+1]-k[i]);return t[k[i]]+x*(t[k[i+1]]-t[k[i]]);}}
  return 1.65;
}

function initShellNotif(){
  if(_shellNotifInterval){clearInterval(_shellNotifInterval);_shellNotifInterval=null;}
  loadShellNotif();
  _shellNotifInterval=setInterval(loadShellNotif,180000); // refresh tiap 3 menit
  if(!_shellNotifClickBound){
    document.addEventListener('click',(e)=>{
      const wrap=document.getElementById('shell-notif');
      const panel=document.getElementById('shell-notif-panel');
      if(panel&&panel.classList.contains('show')&&wrap&&!wrap.contains(e.target))panel.classList.remove('show');
    });
    _shellNotifClickBound=true;
  }
}

}

      _shellNotifPersisted=await api('yanz_notifications?recipient_type=eq.staff&recipient_id=eq.'+window.YANZ.staffId+'&order=created_at.desc&limit=30');
    } else {_shellNotifPersisted=[];}
  }catch(e){_shellNotifPersisted=[];}
}

async function computeSmartAlerts(){
  const alerts=[];
  const today=new Date();today.setHours(0,0,0,0);
  const can=id=>window.YANZ.canAccess(id);
  const owner=window.YANZ.role==='owner';

  // 1. STOK KRITIS (stok ≤ ROP)
  if(can('inventory')||can('velocity')){
    try{
      const [products,batches]=await Promise.all([
        api('yanz_products?category=eq.product&is_active=eq.true&select=id,name,v_normal_ecom_daily,v_normal_b2b_daily,velocity_stddev,lead_time_days,service_level_pct'),
        api('yanz_purchase_batches?select=product_id,qty_remaining')
      ]);
      const stock={};batches.forEach(b=>{stock[b.product_id]=(stock[b.product_id]||0)+num(b.qty_remaining);});
      let cnt=0;const names=[];
      products.forEach(p=>{
        const v=num(p.v_normal_ecom_daily)+num(p.v_normal_b2b_daily);
        if(v<=0)return;
        const lead=num(p.lead_time_days)||21;
        const sigma=num(p.velocity_stddev);
        const z=notifZ(num(p.service_level_pct)||95);
        const rop=(v*lead)+(z*sigma*Math.sqrt(lead));
        if((stock[p.id]||0)<=rop){cnt++;if(names.length<4)names.push(p.name);}
      });
      if(cnt>0)alerts.push({icon:'🔴',title:`${cnt} produk perlu dipesan`,message:names.join(', ')+(cnt>names.length?', …':''),module:can('velocity')?'velocity':'inventory'});
    }catch(e){}
  }

  // 2. HUTANG USAHA JATUH TEMPO (≤7 hari / overdue)
  if(can('cash')){
    try{
      const batches=await api('yanz_purchase_batches?payment_status=eq.unpaid&select=qty_purchased,landed_cost_per_unit,payment_due_date');
      const soon=new Date(today);soon.setDate(soon.getDate()+7);
      let cnt=0,total=0,over=0;
      batches.forEach(b=>{
        const amt=num(b.qty_purchased)*num(b.landed_cost_per_unit);
        if(amt<=0||!b.payment_due_date)return;
        const due=new Date(b.payment_due_date);
        if(due<=soon){cnt++;total+=amt;if(due<today)over++;}
      });
      if(cnt>0)alerts.push({icon:'🗓️',title:`${cnt} hutang jatuh tempo ≤7 hari`,message:`Total ${rpShort(total)}${over?` · ${over} sudah lewat tempo`:''}`,module:'cash'});
    }catch(e){}
  }

  // 3. INVOICE B2B OVERDUE
  if(can('b2b')){
    try{
      const orders=await api('yanz_sales_orders?channel=eq.b2b&workflow_status=in.(sent,partial_paid,overdue)&select=grand_total,amount_paid,due_date');
      let cnt=0,total=0;
      orders.forEach(o=>{
        const out=num(o.grand_total)-num(o.amount_paid);
        if(out<=0||!o.due_date)return;
        if(new Date(o.due_date)<today){cnt++;total+=out;}
      });
      if(cnt>0)alerts.push({icon:'💰',title:`${cnt} invoice B2B overdue`,message:`Tagihan belum dibayar · ${rpShort(total)}`,module:'b2b'});
    }catch(e){}
  }

  // 4. NSA MENUNGGU APPROVAL (owner only)
  if(owner){
    try{
      const drafts=await api('yanz_marketplace_settlements?status=eq.draft&select=id&limit=100');
      if(drafts.length)alerts.push({icon:'🧾',title:`${drafts.length} NSA menunggu approval`,message:'Settlement draft dari staff — klik untuk review',module:'nsa'});
    }catch(e){}
  }

  // 5. USER MENUNGGU AKTIVASI (owner only)
  if(owner){
    try{
      const reqs=await api('yanz_signup_requests?status=eq.pending&select=user_id&limit=100');
      if(reqs.length)alerts.push({icon:'🔓',title:`${reqs.length} user menunggu aktivasi`,message:'Staff baru Daftar — klik untuk aktifkan',module:'tasks'});
    }catch(e){}
  }

  _shellSmartAlerts=alerts;
}

function renderShellNotif(){
  const badge=document.getElementById('shell-notif-badge');
  const body=document.getElementById('shell-notif-body');
  const unread=_shellNotifPersisted.filter(n=>!n.is_read).length;
  const total=unread+_shellSmartAlerts.length;
  if(badge){badge.textContent=total>9?'9+':String(total);badge.style.display=total>0?'flex':'none';}
  if(!body)return;
  let html='';
  if(_shellSmartAlerts.length){
    html+='<div class="shell-notif-sec">⚡ Perlu Perhatian</div>';
    _shellSmartAlerts.forEach(a=>{
      html+=`<div class="shell-notif-item alert" onclick="onShellAlertClick('${a.module}')">
        <div class="ni-icon">${a.icon}</div>
        <div class="ni-txt"><div class="ni-title">${a.title}</div><div class="ni-msg">${a.message}</div></div>
      </div>`;
    });
  }
  if(_shellNotifPersisted.length){
    html+='<div class="shell-notif-sec">🔔 Notifikasi</div>';
    _shellNotifPersisted.forEach(n=>{
      const tId=(n.task_id||'').toString().replace(/'/g,'');
      html+=`<div class="shell-notif-item ${n.is_read?'':'unread'}" onclick="onShellNotifClick('${n.id}','${tId}')">
        <div class="ni-icon">${n.is_read?'•':'🔵'}</div>
        <div class="ni-txt"><div class="ni-title">${n.title||'(tanpa judul)'}</div><div class="ni-msg">${n.message||''}</div><div class="ni-time">${fdt(n.created_at)}</div></div>
      </div>`;
    });
  }
  if(!html)html='<div class="shell-notif-empty">✅ Tidak ada notifikasi atau alert.</div>';
  body.innerHTML=html;
}

async function markAllShellNotifRead(){
  const unread=_shellNotifPersisted.filter(n=>!n.is_read);

  try{
    if(window.YANZ.role==='owner')await api('yanz_notifications?recipient_type=eq.owner&is_read=eq.false',{method:'PATCH',body:JSON.stringify({is_read:true})});

function buildSidebar(){
  const role=window.YANZ.role;
  const visible=MODULES.filter(m=>window.YANZ.canAccess(m.id));
  
  // Group by section
  const bySection={};
  visible.forEach(m=>{
    const sec=m.section||'_top';
    if(!bySection[sec])bySection[sec]=[];
    bySection[sec].push(m);
  });
  
  let html='';
  
  // Top items (no section)
  if(bySection._top){
    bySection._top.forEach(m=>{
      html+=navItemHTML(m);
    });
  }
  
  // Sectioned items
  const sectionOrder=['Operasional Harian','Finance','Strategic Intelligence'];
  sectionOrder.forEach(sec=>{
    if(bySection[sec]){
      html+=`<div class="nav-section">
        <div class="nav-section-label">${sec}</div>
        ${bySection[sec].map(navItemHTML).join('')}
      </div>`;
    }
  });
  
  document.getElementById('sidebar-nav').innerHTML=html;
}

function navItemHTML(m){
  return `<button class="nav-item" data-module="${m.id}" onclick="navigate('${m.id}')">
    <span class="icon">${m.label.split(' ')[0]}</span>
    <span class="label">${m.label.split(' ').slice(1).join(' ')}</span>
  </button>`;
}

function navigate(moduleId,skipHash){
  const m=MODULES.find(x=>x.id===moduleId);
  if(!m){moduleId='home';}
  const target=MODULES.find(x=>x.id===moduleId);
  
  // Akses check — kalau staff belum di-grant akses modul ini, lempar ke Home.
  // (Jangan cuma return: konten modul sebelumnya bisa nyangkut di #module-content,
  //  mis. hash #cash tersisa dari sesi owner lalu staff login → konten Cash bocor.)
  if(!window.YANZ.canAccess(moduleId)){
    showToast('Kamu belum diberi akses ke modul ini');
    window.location.hash='home';
    if(moduleId!=='home')return navigate('home',true);
    return;
  }
  
  if(!skipHash)window.location.hash=moduleId;
  
  // Update active state
  document.querySelectorAll('.nav-item').forEach(n=>{
    n.classList.toggle('active',n.dataset.module===moduleId);
  });
  
  // Close mobile sidebar
  document.getElementById('sidebar').classList.remove('open');
  
  // Update title
  document.getElementById('module-title').textContent=target.label.split(' ').slice(1).join(' ')||target.label;
  document.getElementById('crumb').textContent=target.section||'Home';
  
  // Render content
  renderModule(target);
}

window.addEventListener('hashchange',()=>{
  const id=window.location.hash.slice(1)||'home';
  navigate(id,true);
});

function toggleSidebar(){
  document.getElementById('sidebar').classList.toggle('open');
}

// MODULE RENDERER — calls module.init() if merged, else placeholder
// ════════════════════════════════════════════════════════════════
function renderModule(m){
  const container=document.getElementById('module-content');
  
  // Cleanup previous module if it has destroy()
  if(window._currentModule && window.YANZ.modules[window._currentModule]?.destroy){
    try{ window.YANZ.modules[window._currentModule].destroy(); }
    catch(err){ console.error('destroy() error for '+window._currentModule+':',err); }
  }
  window._currentModule=m.id;
  
  if(m.id==='home'){
    container.innerHTML=renderHome();
    if(window.YANZ.role==='staff')loadHomeAttendance();
    return;
  }
  
  // Merged module path
  const mod=window.YANZ.modules[m.id];
  if(mod && typeof mod.template==='string' && typeof mod.init==='function'){
    container.innerHTML=mod.template;
    try{ mod.init(); }
    catch(err){
      console.error('init() error for '+m.id+':',err);
      showToast('❌ Gagal load modul: '+err.message);
    }
    return;
  }
  
  // Placeholder for modules not yet merged
  container.innerHTML=`<div class="placeholder">
    <div class="icon">${m.label.split(' ')[0]}</div>
    <div class="phase-tag">Sub-fase ${m.phase}</div>
    <h2>${m.label.split(' ').slice(1).join(' ')}</h2>
    <p>Modul ini akan di-merge ke dalam app pada <strong>Sub-fase ${m.phase}</strong>.<br>
    Sementara waktu, Anda masih bisa pakai versi standalone-nya.</p>
    ${m.standalone?`<a href="${m.standalone}" target="_blank" class="standalone-link">→ Buka ${m.standalone} (tab baru)</a>`:''}
    ${m.note?`<p style="margin-top:14px;font-size:11px;color:#888;font-style:italic">${m.note}</p>`:''}
  </div>`;
}

function localDateStr(d=new Date()){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function fmtTime(ts){if(!ts)return '–';const d=new Date(ts);return d.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});}

async function loadHomeAttendance(){
  const sid=window.YANZ.staffId;
  const wrap=document.getElementById('home-attendance');
  if(!sid||!wrap)return;
  try{
    const today=localDateStr();
    const [offices,rows]=await Promise.all([
      api('yanz_offices?is_active=eq.true&order=display_order,name'),
      api('yanz_attendance?staff_id=eq.'+sid+'&attend_date=eq.'+today+'&limit=1'),
      ]);
    window._homeOffices=offices;
    window._homeAttToday=rows[0]||null;
    renderHomeAttendance();
  }catch(e){
    wrap.innerHTML=`<div class="att-widget"><div style="font-size:12px;color:#92400E;background:#FFFBEB;border:1px solid #FDE68A;border-radius:8px;padding:12px">⚠️ Fitur absensi belum aktif — Owner perlu jalankan migration <code>yanz_attendance_tables.sql</code> di Supabase.</div></div>`;
    console.warn('Attendance load failed:',e.message);
  }
}

function renderHomeAttendance(){
  const wrap=document.getElementById('home-attendance');if(!wrap)return;
  const offices=window._homeOffices||[];
  const a=window._homeAttToday;
  const todayLabel=new Date().toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  let body;
  if(!a){
    // Belum check-in
    const offOpts=offices.map(o=>`<option value="${o.id}">${o.name}</option>`).join('');
    body=`<div class="att-row">
      <div class="att-fld"><label>Kantor</label><select id="att-office">${offOpts||'<option value="">— Belum ada kantor —</option>'}</select></div>
      <button class="att-btn att-in" onclick="homeCheckIn()">🟢 Check-in Sekarang</button>
    </div>
    <div class="att-hint">Belum check-in hari ini. Pilih kantor lalu klik Check-in.</div>`;
  }else if(!a.check_out){
    // Sudah check-in, belum check-out
    const off=offices.find(o=>o.id===a.office_id);
    body=`<div class="att-status">
      <div><div class="att-lbl">Check-in</div><div class="att-val" style="color:#16A34A">${fmtTime(a.check_in)}</div></div>
      <div><div class="att-lbl">Kantor</div><div class="att-val">${off?.name||'–'}</div></div>
      <div><div class="att-lbl">Jam Lembur</div><div class="att-val">${num(a.overtime_hours)||0} jam</div></div>
    </div>
    <div class="att-row" style="margin-top:12px">
      <div class="att-fld"><label>Jam Lembur (input sebelum/sesudah pulang)</label><input type="number" id="att-ot" min="0" step="0.5" value="${num(a.overtime_hours)||0}" /></div>
      <button class="att-btn att-s" onclick="homeSaveOvertime()">💾 Simpan Lembur</button>
      <button class="att-btn att-out" onclick="homeCheckOut()">🔴 Check-out</button>
    </div>`;
  }else{
    // Sudah check-out
    const off=offices.find(o=>o.id===a.office_id);
    body=`<div class="att-status">
      <div><div class="att-lbl">Check-in</div><div class="att-val" style="color:#16A34A">${fmtTime(a.check_in)}</div></div>
      <div><div class="att-lbl">Check-out</div><div class="att-val" style="color:#DC2626">${fmtTime(a.check_out)}</div></div>
      <div><div class="att-lbl">Kantor</div><div class="att-val">${off?.name||'–'}</div></div>
      <div><div class="att-lbl">Jam Lembur</div><div class="att-val">${num(a.overtime_hours)||0} jam</div></div>
    </div>
    <div class="att-hint" style="color:#16A34A">✓ Absensi hari ini selesai. Terima kasih!</div>`;
  }
  wrap.innerHTML=`<div class="att-widget">
    <div class="att-head"><span style="font-size:18px">🕐</span><div><div class="att-title">Absensi Hari Ini</div><div class="att-date">${todayLabel}</div></div></div>
    ${body}
  </div>`;
}

async function homeCheckIn(){
  const sid=window.YANZ.staffId;if(!sid)return;
  const officeId=document.getElementById('att-office')?.value||null;
  if(!officeId){showToast('⚠️ Pilih kantor dulu');return;}
  try{
    await api('yanz_attendance',{method:'POST',body:JSON.stringify({staff_id:sid,attend_date:localDateStr(),check_in:new Date().toISOString(),office_id:officeId})});
    showToast('Check-in tercatat ✓');loadHomeAttendance();
  }catch(e){showToast('❌ '+e.message);}
}
async function homeCheckOut(){
  const a=window._homeAttToday;if(!a)return;
  try{
    await api('yanz_attendance?id=eq.'+a.id,{method:'PATCH',body:JSON.stringify({check_out:new Date().toISOString()})});
    showToast('Check-out tercatat ✓');loadHomeAttendance();
  }catch(e){showToast('❌ '+e.message);}
}
async function homeSaveOvertime(){
  const a=window._homeAttToday;if(!a)return;
  const ot=parseFloat(document.getElementById('att-ot')?.value)||0;
  try{
    await api('yanz_attendance?id=eq.'+a.id,{method:'PATCH',body:JSON.stringify({overtime_hours:ot})});
    showToast('Jam lembur disimpan ✓');loadHomeAttendance();
  }catch(e){showToast('❌ '+e.message);}
}

  // ── Utility ───────────────────────────────────────────────────
  function timeAgo(d){
    if(!d)return '';
    const diff=(new Date()-new Date(d))/1000;
    if(diff<60)return 'Baru saja';
    if(diff<3600)return Math.floor(diff/60)+' menit lalu';
    if(diff<86400)return Math.floor(diff/3600)+' jam lalu';
    if(diff<604800)return Math.floor(diff/86400)+' hari lalu';
    return fdShort(d);
  }

  function setDB(ok,msg){
    ['dbd','dbd-s'].forEach(id=>{const e=document.getElementById(id);if(e)e.className='dbd'+(ok?' on':'');});

  // ── Data Loading ──────────────────────────────────────────────
  async function loadAll(){
    setDB(false,'Menghubungkan…');
    try{
      [STAFF,CATEGORIES,TASKS,COMMENTS,NOTIFICATIONS]=await Promise.all([
        api('yanz_staff?is_active=eq.true&order=display_order,staff_name'),
        api('yanz_task_categories?is_active=eq.true&order=display_order'),
        api('yanz_tasks?order=due_date.asc.nullslast,created_at.desc&limit=1000'),
        api('yanz_task_comments?order=created_at.desc&limit=500'),
        api('yanz_notifications?order=created_at.desc&limit=100')
      ]);
      setDB(true,'Terhubung ✓ — '+STAFF.length+' staff · '+TASKS.length+' tasks');
      if(window.YANZ.role==='owner'){
        try{SIGNUP_REQUESTS=await api('yanz_signup_requests?status=eq.pending&order=created_at');}
        catch(e){SIGNUP_REQUESTS=[];} // tabel belum dibuat (migration yanz_signup_requests.sql belum jalan)
      }
      await autoGenerateRecurring();
      await checkOverdueNotifications();
      fillSelects();
      renderAll();
    }catch(e){setDB(false,'❌ '+e.message);console.error(e);}
  }

  // ── STAFF MY TASKS ────────────────────────────────────────────
  function renderMyTasks(){
    if(!currentStaffId)return;
    const myAll=TASKS.filter(t=>t.assigned_to===currentStaffId&&t.status!=='cancelled');
    const myActive=myAll.filter(t=>t.status!=='completed');
    const pending=myActive.filter(t=>t.status==='pending').length;
    const progress=myActive.filter(t=>t.status==='in_progress').length;
    const overdue=myActive.filter(t=>t.due_date&&new Date(t.due_date)<new Date()).length;
    const weekAgo=new Date();weekAgo.setDate(weekAgo.getDate()-7);
    const done=myAll.filter(t=>t.status==='completed'&&new Date(t.completed_at||t.updated_at)>=weekAgo).length;
    const setText=(id,v)=>{const e=document.getElementById(id);if(e)e.textContent=v;};
    setText('my-pending',pending);setText('my-progress',progress);setText('my-overdue',overdue);setText('my-done',done);

    const el=document.getElementById('my-task-list');if(!el)return;
    if(!myActive.length)el.innerHTML='<div class="empty">✓ Tidak ada tugas aktif. Santai sebentar!</div>';
    else el.innerHTML=myActive.sort((a,b)=>{
      const aD=a.due_date?new Date(a.due_date):new Date(9999,0);
      const bD=b.due_date?new Date(b.due_date):new Date(9999,0);
      return aD-bD;
    }).map(t=>renderTaskCard(t,'staff')).join('');
  }

  function renderMyCompleted(){
    if(!currentStaffId)return;
    const list=TASKS.filter(t=>t.assigned_to===currentStaffId&&t.status==='completed').sort((a,b)=>new Date(b.completed_at||b.updated_at)-new Date(a.completed_at||a.updated_at));
    const el=document.getElementById('my-completed-list');if(!el)return;
    if(!list.length)el.innerHTML='<div class="empty">Belum ada tugas selesai.</div>';
    else el.innerHTML=list.slice(0,50).map(t=>renderTaskCard(t,'staff')).join('');
  }

  // ── TASK CARD ─────────────────────────────────────────────────
  function renderTaskCard(t,viewRole){
    const staff=STAFF.find(s=>s.id===t.assigned_to);
    const cat=CATEGORIES.find(c=>c.id===t.category_id);
    const today=new Date();today.setHours(0,0,0,0);
    const due=t.due_date?new Date(t.due_date):null;
    const diff=due?Math.ceil((due-today)/(1000*60*60*24)):null;
    const overdue=t.status!=='completed'&&t.status!=='cancelled'&&due&&due<today;
    const isCompleted=t.status==='completed';

    let deadlinePill='';
    if(due){
      let cls='';let txt='';
      if(isCompleted){cls='';txt=`Selesai ${fd(t.completed_at)}`;}
      else if(diff<0){cls='overdue';txt=`Overdue ${Math.abs(diff)} hari`;}
      else if(diff===0){cls='urgent';txt=`Due hari ini`;}
      else if(diff<=3){cls='urgent';txt=`${diff} hari lagi`;}
      else if(diff<=7){cls='soon';txt=`${diff} hari lagi`;}
      else txt=`Due ${fdShort(due)}`;
      deadlinePill=`<span class="deadline-pill ${cls}">📅 ${txt}</span>`;
    }

    const taskComments=COMMENTS.filter(c=>c.task_id===t.id);
    const commentCount=taskComments.length;

    let actions='';
    if(viewRole==='staff'&&!isCompleted){
      if(t.status==='pending')actions+=`<button class="btn btn-s btn-sm" onclick="tk.startTask('${t.id}')">🔄 Mulai Kerjakan</button>`;
      actions+=`<button class="btn btn-p btn-sm" onclick="tk.openCompleteModal('${t.id}')">✓ Tandai Selesai</button>`;
      actions+=`<button class="btn btn-s btn-sm" onclick="tk.openDetailModal('${t.id}')">💬 Detail ${commentCount?`(${commentCount})`:''}</button>`;
    } else if(viewRole==='owner'){
      actions+=`<button class="btn btn-s btn-sm" onclick="tk.openDetailModal('${t.id}')">💬 Detail ${commentCount?`(${commentCount})`:''}</button>`;
      if(!isCompleted)actions+=`<button class="btn btn-s btn-sm" onclick="tk.editTask('${t.id}')">✎ Edit</button>`;
      actions+=`<button class="btn btn-d btn-sm" onclick="tk.deleteTask('${t.id}')">×</button>`;
    } else if(viewRole==='staff'&&isCompleted){
      actions+=`<button class="btn btn-s btn-sm" onclick="tk.openDetailModal('${t.id}')">📋 Lihat</button>`;
    }

    const recurringBadge=t.recurring_parent_id?'<span style="font-size:10px;background:#F5F3FF;color:#7C3AED;padding:2px 6px;border-radius:4px;font-weight:700">🔁 Recurring</span>':'';

    return`<div class="task-card priority-${t.priority} status-${t.status} ${overdue?'overdue':''}">
      <div class="task-header">
        <div><div class="task-title">${t.title} ${recurringBadge}</div></div>
        <div style="display:flex;gap:6px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end">
          <span class="task-pill pill-${t.priority}">${PRIORITY_LBL[t.priority]}</span>

  async function saveTask(){
    const id=document.getElementById('tm-id').value;
    const title=document.getElementById('tm-title').value.trim();
    const staffId=document.getElementById('tm-staff').value;
    const st=document.getElementById('tm-status');
    if(!title||!staffId){st.textContent='⚠️ Title & staff wajib';st.style.color='#D97706';return;}

    const isRecurring=document.getElementById('tm-recurring').checked;
    const pattern=document.getElementById('tm-pattern').value;
    const days=Array.from(document.querySelectorAll('.module-tasks .day-cb:checked')).map(c=>parseInt(c.value));
    const mday=int(document.getElementById('tm-mday').value)||1;

    const body={
      title,
      description:document.getElementById('tm-desc').value||null,
      assigned_to:staffId,
      category_id:document.getElementById('tm-category').value||null,
      priority:document.getElementById('tm-priority').value,
      due_date:document.getElementById('tm-date').value||null,
      due_time:document.getElementById('tm-time').value||null,
      is_recurring:isRecurring,
      recurring_pattern:isRecurring?pattern:null,
      recurring_days_of_week:isRecurring&&pattern==='weekly'?days:null,
      recurring_day_of_month:isRecurring&&pattern==='monthly'?mday:null,
      recurring_end_date:isRecurring?(document.getElementById('tm-end-date').value||null):null,
      updated_at:new Date().toISOString()
    };

    st.textContent='Menyimpan…';st.style.color='#999';
    try{
      let taskId;
      if(id){
        await api('yanz_tasks?id=eq.'+id,{method:'PATCH',body:JSON.stringify(body)});
        taskId=id;
      } else {
        body.status='pending';body.assigned_by='owner';
        const r=await api('yanz_tasks',{method:'POST',headers:{'Prefer':'return=representation'},body:JSON.stringify(body)});
        taskId=r[0].id;
        await api('yanz_notifications',{method:'POST',body:JSON.stringify({
          recipient_type:'staff',recipient_id:staffId,notif_type:'task_assigned',
          task_id:taskId,title:'📋 Tugas Baru: '+title,
          message:`Anda diberi tugas baru. Deadline: ${body.due_date?fd(body.due_date):'tidak ada'}`
        })});
      }
      closeTaskModal();await loadAll();toast('Tugas tersimpan ✓');
    }catch(e){st.textContent='❌ '+e.message;st.style.color='#DC2626';}
  }

  async function postComment(taskId){
    const text=document.getElementById('new-comment').value.trim();
    if(!text)return;
    try{
      const role=window.YANZ.role;
      const authorName=role==='owner'?(window.YANZ.fullName||'Owner'):(STAFF.find(s=>s.id===currentStaffId)?.staff_name||'Staff');
      await api('yanz_task_comments',{method:'POST',body:JSON.stringify({
        task_id:taskId,author_type:role,author_id:currentStaffId,
        author_name:authorName,comment_text:text
      })});
      const t=TASKS.find(x=>x.id===taskId);
      if(role==='owner'&&t.assigned_to){
        await api('yanz_notifications',{method:'POST',body:JSON.stringify({
          recipient_type:'staff',recipient_id:t.assigned_to,notif_type:'task_comment',
          task_id:taskId,title:'💬 Komentar baru',message:`Owner komentar di "${t.title}": ${text.substring(0,80)}`
        })});
      } else if(role==='staff'){
        await api('yanz_notifications',{method:'POST',body:JSON.stringify({
          recipient_type:'owner',notif_type:'task_comment',
          task_id:taskId,title:'💬 Komentar baru',message:`${authorName} komentar di "${t.title}": ${text.substring(0,80)}`
        })});
      }
      document.getElementById('new-comment').value='';
      await loadAll();
      openDetailModal(taskId);
    }catch(e){toast('❌ '+e.message);}
  }

    const newValue=checkboxEl.checked;

    toggleEl.classList.add('saving');
    const cur=staff.permissions||{};
    const newMods={...(cur.modules||{}),[moduleId]:newValue};
    const newPerms={...cur,modules:newMods};
    try{
      await api('yanz_staff?id=eq.'+staffId,{method:'PATCH',body:JSON.stringify({permissions:newPerms})});
      staff.permissions=newPerms;
      const label=PERMISSION_MODULES.find(m=>m.id===moduleId)?.label||moduleId;
      toast(`${label} untuk ${staff.staff_name}: ${newValue?'aktif ✓':'nonaktif'}`);
    }catch(e){
      checkboxEl.checked=!newValue;
      toast('❌ Gagal simpan: '+e.message);
      console.error(e);

      toggleEl.classList.remove('saving');

  // ── RECURRING AUTO-GENERATE ───────────────────────────────────
  async function autoGenerateRecurring(){
    const today=new Date();today.setHours(0,0,0,0);
    const recurring=TASKS.filter(t=>t.is_recurring&&!t.recurring_parent_id&&t.status!=='cancelled');
    for(const t of recurring){
      if(t.recurring_end_date&&new Date(t.recurring_end_date)<today)continue;
      let shouldGenerate=false;
      if(t.recurring_pattern==='daily'){shouldGenerate=true;}
      else if(t.recurring_pattern==='weekly'){
        const dayOfWeek=today.getDay();
        if(t.recurring_days_of_week&&t.recurring_days_of_week.includes(dayOfWeek))shouldGenerate=true;
      }
      else if(t.recurring_pattern==='monthly'){
        if(today.getDate()===t.recurring_day_of_month)shouldGenerate=true;
      }
      if(!shouldGenerate)continue;
      if(t.recurring_last_generated){
        const last=new Date(t.recurring_last_generated);last.setHours(0,0,0,0);
        if(last.getTime()===today.getTime())continue;
      }
      const exists=TASKS.find(x=>x.recurring_parent_id===t.id&&x.due_date===today.toISOString().split('T')[0]);
      if(exists)continue;
      try{
        await api('yanz_tasks',{method:'POST',body:JSON.stringify({
          title:t.title,description:t.description,
          assigned_to:t.assigned_to,category_id:t.category_id,
          priority:t.priority,status:'pending',
          due_date:today.toISOString().split('T')[0],
          due_time:t.due_time,
          recurring_parent_id:t.id,
          assigned_by:'system'
        })});
        await api('yanz_tasks?id=eq.'+t.id,{method:'PATCH',body:JSON.stringify({recurring_last_generated:today.toISOString().split('T')[0]})});
      }catch(e){console.error('Auto-gen failed:',e);}
    }
  }

  async function checkOverdueNotifications(){
    const today=new Date();today.setHours(0,0,0,0);
    const overdue=TASKS.filter(t=>t.status!=='completed'&&t.status!=='cancelled'&&t.due_date&&new Date(t.due_date)<today);
    for(const t of overdue){
      const existsNotif=NOTIFICATIONS.find(n=>n.task_id===t.id&&n.notif_type==='task_overdue'&&new Date(n.created_at)>=today);
      if(existsNotif)continue;
      try{
        await api('yanz_notifications',{method:'POST',body:JSON.stringify({
          recipient_type:'staff',recipient_id:t.assigned_to,notif_type:'task_overdue',
          task_id:t.id,title:'🚨 Tugas Overdue',
          message:`"${t.title}" sudah lewat deadline ${fd(t.due_date)}`
        })});

          message:`${STAFF.find(s=>s.id===t.assigned_to)?.staff_name}: "${t.title}" lewat deadline`
        })});
      }catch(e){}
    }
  }

  // FIFO
  function stockOf(pid){return BATCHES.filter(b=>b.product_id===pid).reduce((s,b)=>s+b.qty_remaining,0);}
  function fifoDeduct(pid,qty){const sorted=BATCHES.filter(b=>b.product_id===pid&&b.qty_remaining>0).sort((a,b)=>new Date(a.po_date)-new Date(b.po_date));let rem=qty,used=[],tot=0;for(const b of sorted){if(rem<=0)break;const take=Math.min(rem,b.qty_remaining);used.push({b,take,cost:take*b.landed_cost_per_unit});tot+=take*b.landed_cost_per_unit;rem-=take;}return{used,tot,short:rem};}
  function fifoCostOf(pid){const a=BATCHES.filter(b=>b.product_id===pid&&b.qty_remaining>0).sort((a,b)=>new Date(a.po_date)-new Date(b.po_date));return a.length?a[0].landed_cost_per_unit:0;}

  // Bundle
  function resolveBundle(pid,qty){const prod=PRODUCTS.find(p=>p.id===pid);if(!prod)return[];if(!prod.is_bundle)return[{component_id:pid,qty}];const comps=BUNDLES.filter(b=>b.bundle_id===pid);return comps.map(c=>({component_id:c.component_id,qty:qty*c.qty_per_bundle}));}
  function bundleAvailableStock(pid){const comps=BUNDLES.filter(b=>b.bundle_id===pid);if(!comps.length)return 0;return Math.min(...comps.map(c=>Math.floor(stockOf(c.component_id)/c.qty_per_bundle)));}
  function getAvailable(pid){const prod=PRODUCTS.find(p=>p.id===pid);return prod?.is_bundle?bundleAvailableStock(pid):stockOf(pid);}

  function getTierPrice(pid,qty){const tiers=TIERS.filter(t=>t.product_id===pid).sort((a,b)=>a.qty_min-b.qty_min);for(const t of tiers){if(qty>=t.qty_min&&(t.qty_max===null||qty<=t.qty_max))return t.unit_price;}return null;}

  // Create/edit form
  function renderCreateForm(){
    const wrap=document.getElementById('order-items-wrap');if(!wrap)return;
    const prodOpts=PRODUCTS.filter(p=>p.category==='product').map(p=>`<option value="${p.id}">[${p.sku}] ${p.name}</option>`).join('');
    const pkgOpts=PRODUCTS.filter(p=>p.category==='packaging').map(p=>`<option value="${p.id}">[${p.sku}] ${p.name}</option>`).join('');
    if(!formItems.length){wrap.innerHTML='<div class="empty" style="padding:16px">Belum ada produk. Klik "+ Tambah Produk".</div>';renderTotals();return;}
    wrap.innerHTML=formItems.map((item,idx)=>{
      const prod=PRODUCTS.find(p=>p.id===item.prodId);
      const stk=item.prodId?getAvailable(item.prodId):0;
      const subtotal=num(item.qty)*num(item.unitPrice);
      const tierPrice=item.prodId?getTierPrice(item.prodId,item.qty):null;
      const insufficient=item.prodId&&item.qty>stk;
      return`<div class="order-item-row">
        <div class="oi-grid">
          <select data-idx="${idx}" data-field="prodId" class="item-field"><option value="">— Pilih produk —</option>${prodOpts.replace(`value="${item.prodId}"`,`value="${item.prodId}" selected`)}</select>
          <input type="number" min="1" placeholder="Qty" value="${item.qty}" data-idx="${idx}" data-field="qty" class="item-field" />
          <input type="number" min="0" placeholder="Harga satuan" value="${item.unitPrice||''}" data-idx="${idx}" data-field="unitPrice" class="item-field" title="${tierPrice?'Tier price: '+rp(tierPrice):'Auto dari master'}" />
          <div style="text-align:right;font-weight:700;font-size:12px;padding:7px 0">${rp(subtotal)}</div>
          <input type="text" placeholder="Catatan/SKU" value="${item.itemNotes||''}" data-idx="${idx}" data-field="itemNotes" class="item-field" />
          <button class="btn btn-d btn-sm" onclick="b2b.removeItem(${idx})">×</button>
        </div>
        ${item.prodId&&item.qty>0?`<div style="display:flex;gap:10px;font-size:11px;color:${insufficient?'#DC2626':'#888'};margin-top:6px;flex-wrap:wrap">
          <span>${insufficient?'❌':'✓'} Stok ${stk}${prod?.unit?' '+prod.unit:''}${prod?.is_bundle?' (Bundle)':''}</span>
          ${tierPrice?`<span style="color:#16A34A">📊 Tier: ${rp(tierPrice)}</span>`:''}
        </div>`:''}
        ${item.prodId?`<div class="oi-addon">
          <div style="font-size:10px;font-weight:700;color:#888;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px">📦 Add-on Packaging</div>
          ${(item.addons||[]).map((a,ai)=>{const pkg=PRODUCTS.find(p=>p.id===a.pkgId);return`<div class="addon-row">
            <select data-idx="${idx}" data-ai="${ai}" data-field="pkgId" class="addon-field"><option value="">— Pilih packaging —</option>${pkgOpts.replace(`value="${a.pkgId}"`,`value="${a.pkgId}" selected`)}</select>
            <input type="number" min="0" step="0.001" placeholder="Qty" value="${a.qty}" data-idx="${idx}" data-ai="${ai}" data-field="qty" class="addon-field" />
            <span style="font-size:11px;color:#888">${pkg?.unit||'unit'}</span>
            <button class="btn btn-d btn-sm" onclick="b2b.removeAddon(${idx},${ai})">×</button>
          </div>`;}).join('')}
          <button class="btn btn-s btn-sm" onclick="b2b.addAddon(${idx})" style="margin-top:4px;font-size:10px">+ Add-on</button>
        </div>`:''}
      </div>`;
    }).join('');
    wrap.querySelectorAll('.item-field').forEach(inp=>{
      inp.addEventListener('change',function(){
        const idx=int(this.dataset.idx);const field=this.dataset.field;
        let val=this.value;
        if(field==='qty'||field==='unitPrice')val=num(val);
        formItems[idx][field]=val;
        if(field==='prodId'&&val){
          const p=PRODUCTS.find(p=>p.id===val);
          const tier=getTierPrice(val,formItems[idx].qty||1);
          if(tier)formItems[idx].unitPrice=tier;
          else if(p?.selling_price)formItems[idx].unitPrice=p.selling_price;
          formItems[idx].addons=[];
        }
        if(field==='qty'&&formItems[idx].prodId){const tier=getTierPrice(formItems[idx].prodId,val);if(tier)formItems[idx].unitPrice=tier;}
        renderCreateForm();
      });
    });
    wrap.querySelectorAll('.addon-field').forEach(inp=>{
      inp.addEventListener('change',function(){
        const idx=int(this.dataset.idx);const ai=int(this.dataset.ai);const field=this.dataset.field;
        let val=this.value;if(field==='qty')val=num(val);
        formItems[idx].addons[ai][field]=val;renderCreateForm();
      });
    });
    renderTotals();
  }

  function addItem(){formItems.push({prodId:'',qty:1,unitPrice:0,itemNotes:'',addons:[]});renderCreateForm();}
  function removeItem(idx){formItems.splice(idx,1);renderCreateForm();}
  function addAddon(idx){if(!formItems[idx].addons)formItems[idx].addons=[];formItems[idx].addons.push({pkgId:'',qty:0});renderCreateForm();}
  function removeAddon(idx,ai){formItems[idx].addons.splice(ai,1);renderCreateForm();}

  function renderTotals(){
    const usePpn=document.getElementById('ord-ppn')?.value==='true';
    const discount=num(document.getElementById('ord-discount')?.value);
    const subtotal=formItems.reduce((s,i)=>s+num(i.qty)*num(i.unitPrice),0);
    const afterDisc=subtotal-discount;
    const ppn=usePpn?afterDisc*PPN_RATE:0;
    const grand=afterDisc+ppn;
    const el=document.getElementById('totals-display');if(!el)return;
    el.innerHTML=`<div class="totals-box">
      <div class="totals-row"><span>Subtotal</span><span>${rp(subtotal)}</span></div>
      ${discount>0?`<div class="totals-row"><span>Diskon</span><span>−${rp(discount)}</span></div>`:''}
      ${usePpn?`<div class="totals-row"><span>PPN 11%</span><span>${rp(ppn)}</span></div>`:''}
      <div class="totals-row grand"><span>GRAND TOTAL</span><span>${rp(grand)}</span></div>
    </div>`;
  }

  function recalcTotal(){renderTotals();}
  function recalcDue(){
    const date=document.getElementById('ord-date')?.value;
    const terms=int(document.getElementById('ord-terms')?.value);
    if(date){const d=new Date(date);d.setDate(d.getDate()+terms);const el=document.getElementById('ord-due');if(el)el.value=d.toISOString().split('T')[0];}
  }

  function onCustomerChange(){
    const cid=document.getElementById('ord-customer')?.value;
    const c=CUSTOMERS.find(x=>x.id===cid);if(!c)return;
    const termsEl=document.getElementById('ord-terms');if(termsEl)termsEl.value=c.default_payment_terms||30;
    const ppnEl=document.getElementById('ord-ppn');if(ppnEl)ppnEl.value=c.use_ppn?'true':'false';
    recalcDue();recalcTotal();

  function renderWorkflowBar(currentStatus){
    const steps=[{key:'draft',label:'📝 Draft'},{key:'quotation',label:'📋 Quotation'},{key:'sent',label:'📤 Sent'},{key:'partial_paid',label:'💸 Partial Paid'},{key:'paid',label:'✅ Lunas'}];
    const currentIdx=steps.findIndex(s=>s.key===currentStatus);
    const html=steps.map((s,i)=>{
      const cls=i<currentIdx?'wf-step done':i===currentIdx?'wf-step active':'wf-step';
      return`<div class="${cls}">${s.label}</div>`+(i<steps.length-1?'<span class="wf-arrow">→</span>':'');
    }).join('');
    const el=document.getElementById('workflow-bar');if(el)el.innerHTML=html;
  }

  function resetCreate(){
    editingOrderId=null;
    const set=(id,val)=>{const e=document.getElementById(id);if(e)e.value=val;};
    const setText=(id,val)=>{const e=document.getElementById(id);if(e)e.textContent=val;};
    setText('create-title','Buat Order B2B Baru');
    set('ord-customer','');set('ord-date',new Date().toISOString().split('T')[0]);
    set('ord-terms',30);set('ord-wf','draft');set('ord-ppn','false');
    set('ord-discount',0);set('ord-notes','');
    setText('ord-status-msg','');
    formItems=[];renderCreateForm();recalcDue();renderWorkflowBar('draft');
  }

  async function editOrder(orderId){
    go('create');editingOrderId=orderId;
    const o=ORDERS.find(x=>x.id===orderId);if(!o)return;
    const set=(id,val)=>{const e=document.getElementById(id);if(e)e.value=val||'';};
    const setText=(id,val)=>{const e=document.getElementById(id);if(e)e.textContent=val;};
    setText('create-title','Edit Order — '+(o.invoice_number||'Draft'));
    set('ord-customer',o.customer_id||'');set('ord-date',o.order_date);
    set('ord-terms',o.payment_terms||30);set('ord-due',o.due_date||'');
    set('ord-wf',o.workflow_status||'draft');set('ord-ppn',o.use_ppn?'true':'false');
    set('ord-discount',o.discount||0);set('ord-notes',o.notes||'');
    renderWorkflowBar(o.workflow_status);
    // Urut sesuai INPUT (created_at asc). ORDER_ITEMS global di-load desc (newest-first),
    // tanpa sort ini item ke-balik → tiap edit-save malah bolak-balik urutannya.
    const items=ORDER_ITEMS.filter(i=>i.order_id===orderId).slice().sort((a,b)=>new Date(a.created_at||0)-new Date(b.created_at||0));
    const pkgs=ORDER_PACKAGING.filter(p=>p.order_id===orderId);
    formItems=items.map(i=>({
      id:i.id,prodId:i.product_id,qty:i.qty,unitPrice:i.sell_price,
      itemNotes:i.order_ref||'',
      addons:pkgs.filter(p=>p.order_item_id===i.id).map(p=>({pkgId:p.packaging_id,qty:p.qty_used}))
    }));
    renderCreateForm();
  }

  async function submitOrder(){
    const st=document.getElementById('ord-status-msg');
    const setMsg=(msg,color='#999')=>{if(st){st.textContent=msg;st.style.color=color;}};
    const custId=document.getElementById('ord-customer')?.value;
    const date=document.getElementById('ord-date')?.value;
    const due=document.getElementById('ord-due')?.value;
    const terms=int(document.getElementById('ord-terms')?.value);
    const wf=document.getElementById('ord-wf')?.value;
    const usePpn=document.getElementById('ord-ppn')?.value==='true';
    const discount=num(document.getElementById('ord-discount')?.value);
    const notes=document.getElementById('ord-notes')?.value;
    if(!custId||!date){setMsg('⚠️ Pilih customer dan tanggal','#D97706');return;}
    const validItems=formItems.filter(i=>i.prodId&&i.qty>0&&i.unitPrice>=0);
    if(!validItems.length){setMsg('⚠️ Tambah minimal 1 produk','#D97706');return;}
    if(['sent','partial_paid','paid'].includes(wf)){
      for(const item of validItems){
        const avail=getAvailable(item.prodId);
        if(item.qty>avail){const p=PRODUCTS.find(x=>x.id===item.prodId);setMsg(`❌ Stok ${p?.name} kurang (${avail})`,'#DC2626');return;}
      }
    }
    const subtotal=validItems.reduce((s,i)=>s+num(i.qty)*num(i.unitPrice),0);
    const afterDisc=subtotal-discount;
    const ppnAmount=usePpn?afterDisc*PPN_RATE:0;
    const grandTotal=afterDisc+ppnAmount;
    setMsg('Menyimpan…');
    try{
      let invNum=null;
      if(editingOrderId){const existing=ORDERS.find(o=>o.id===editingOrderId);invNum=existing?.invoice_number;}
      if(!invNum&&['sent','partial_paid','paid'].includes(wf)){
        const now=new Date();
        const prefix=BIZ.invoice_prefix||'YANZ/INV';
        const month=String(now.getMonth()+1).padStart(2,'0');
        const year=now.getFullYear();
        const count=ORDERS.filter(o=>o.invoice_number&&o.invoice_number.includes(`${year}/${month}`)).length+1;
        invNum=`${prefix}/${year}/${month}/${String(count).padStart(4,'0')}`;
      }
      const orderBody={
        channel:'b2b',customer_id:custId,order_date:date,due_date:due||null,
        payment_terms:terms,workflow_status:wf,use_ppn:usePpn,
        subtotal,discount,ppn_amount:ppnAmount,grand_total:grandTotal,
        total_revenue:grandTotal,notes:notes||null,
        invoice_number:invNum,
        invoice_date:['sent','partial_paid','paid'].includes(wf)?date:null,
        reference:invNum
      };
      let orderId;
      if(editingOrderId){
        await api('yanz_sales_orders?id=eq.'+editingOrderId,{method:'PATCH',body:JSON.stringify(orderBody)});
        orderId=editingOrderId;
        await api('yanz_order_items?order_id=eq.'+orderId,{method:'DELETE'});
        await api('yanz_order_packaging?order_id=eq.'+orderId,{method:'DELETE'});
      }else{
        const r=await api('yanz_sales_orders',{method:'POST',headers:{'Prefer':'return=representation'},body:JSON.stringify(orderBody)});
        orderId=r[0].id;
      }
      const wasShipped=editingOrderId?['sent','partial_paid','paid'].includes(ORDERS.find(o=>o.id===editingOrderId)?.workflow_status||''):false;
      const willShip=['sent','partial_paid','paid'].includes(wf);
      const shouldDeduct=willShip&&!wasShipped;
      for(const item of validItems){
        const components=resolveBundle(item.prodId,item.qty);let totalProdCOGS=0;
        if(shouldDeduct){
          for(const comp of components){
            const {used,tot}=fifoDeduct(comp.component_id,comp.qty);totalProdCOGS+=tot;
            for(const u of used){
              const newR=u.b.qty_remaining-u.take;
              await api('yanz_purchase_batches?id=eq.'+u.b.id,{method:'PATCH',body:JSON.stringify({qty_remaining:newR})});
              const i=BATCHES.findIndex(b=>b.id===u.b.id);if(i>=0)BATCHES[i].qty_remaining=newR;
            }
            await api('yanz_stock_movements',{method:'POST',body:JSON.stringify({
              product_id:comp.component_id,movement_type:'sale',qty:comp.qty,
              cogs_per_unit:comp.qty>0?tot/comp.qty:0,total_cogs:tot,
              reference:invNum||'B2B-'+orderId.slice(0,8),movement_date:date
            })});
          }
        }else if(willShip){
          // Order sudah pernah dikirim (stok sudah dipotong) lalu diedit → hitung ULANG COGS
          // read-only TANPA memotong stok lagi, supaya cogs_total tidak jadi 0 saat edit order lama.
          for(const comp of components){
            const bs=BATCHES.filter(b=>b.product_id===comp.component_id).sort((x,y)=>new Date(y.po_date)-new Date(x.po_date));
            totalProdCOGS+=comp.qty*(bs.length?num(bs[0].landed_cost_per_unit):0);
          }
        }
        const itemR=await api('yanz_order_items',{method:'POST',headers:{'Prefer':'return=representation'},body:JSON.stringify({
          order_id:orderId,product_id:item.prodId,qty:item.qty,sell_price:item.unitPrice,
          cogs_product:totalProdCOGS,cogs_total:totalProdCOGS,
          order_ref:item.itemNotes||null,payment_status:wf==='paid'?'paid':'cod_pending'
        })});
        const itemId=itemR[0].id;
        if(item.addons&&item.addons.length){
          for(const a of item.addons.filter(x=>x.pkgId&&x.qty>0)){
            let pkgCost=0;
            if(shouldDeduct){
              const pfifo=fifoDeduct(a.pkgId,a.qty);pkgCost=pfifo.tot;
              for(const u of pfifo.used){
                const newR=u.b.qty_remaining-u.take;
                await api('yanz_purchase_batches?id=eq.'+u.b.id,{method:'PATCH',body:JSON.stringify({qty_remaining:newR})});
                const i=BATCHES.findIndex(b=>b.id===u.b.id);if(i>=0)BATCHES[i].qty_remaining=newR;
              }
            }else if(willShip){
              const bs=BATCHES.filter(b=>b.product_id===a.pkgId).sort((x,y)=>new Date(y.po_date)-new Date(x.po_date));
              pkgCost=a.qty*(bs.length?num(bs[0].landed_cost_per_unit):0);
            }
            await api('yanz_order_packaging',{method:'POST',body:JSON.stringify({
              order_id:orderId,order_item_id:itemId,packaging_id:a.pkgId,
              qty_used:a.qty,cogs_per_unit:fifoCostOf(a.pkgId),cogs_total:pkgCost,source:'manual'
            })});
          }
        }
      }
      const custName=CUSTOMERS.find(c=>c.id===custId)?.name;
      await api('yanz_activity',{method:'POST',body:JSON.stringify({
        icon:'🤝',text:`B2B ${editingOrderId?'diupdate':'baru'} — ${custName} · ${rp(grandTotal)} · ${wf}`,
        time_ago:'Baru saja',color:'#F0FDF4'
      })});
      toast(editingOrderId?'Order diperbarui ✓':'Order tersimpan ✓');
      setMsg('✓ '+(invNum||'Tersimpan'),'#16A34A');
      await loadAll();resetCreate();go('orders');
    }catch(e){setMsg('❌ '+e.message,'#DC2626');console.error(e);}
  }

  async function deleteOrder(id){
    if(window.YANZ.role!=='owner'){toast('❌ Hanya Owner');return;}
    if(!confirm('Hapus order ini? Tidak bisa dibatalkan.'))return;
    try{
      await api('yanz_order_packaging?order_id=eq.'+id,{method:'DELETE'});
      await api('yanz_order_items?order_id=eq.'+id,{method:'DELETE'});
      await api('yanz_payments?order_id=eq.'+id,{method:'DELETE'});
      await api('yanz_sales_orders?id=eq.'+id,{method:'DELETE'});
      await loadAll();toast('Order dihapus ✓');
    }catch(e){toast('❌ '+e.message);}
  }

  // Invoice preview
  // ── DOKUMEN: Sales Order → Surat Jalan → Invoice (3 rangkap + tanda tangan) ──
  let _docData=null,_docType='invoice';

  function buildDocData(o){
    const base=o.order_date||new Date().toISOString();
    const dt=new Date(base);
    const year=dt.getFullYear();
    const month=String(dt.getMonth()+1).padStart(2,'0');
    let seq='PREVIEW';
    if(o.invoiceNumber){const parts=String(o.invoiceNumber).split('/');seq=parts[parts.length-1]||'PREVIEW';}
    return {customer:o.customer,items:o.items,order_date:o.order_date,due_date:o.due_date,usePpn:o.usePpn,discount:o.discount,subtotal:o.subtotal,ppn:o.ppn,grand:o.grand,notes:o.notes,year,month,seq};
  }

  function openDocFromForm(type){
    if(!formItems.filter(i=>i.prodId&&i.qty>0).length){toast('⚠️ Tambah produk dulu');return;}
    if(!document.getElementById('ord-customer')?.value){toast('⚠️ Pilih customer dulu');return;}
    const cust=CUSTOMERS.find(c=>c.id===document.getElementById('ord-customer')?.value);
    const date=document.getElementById('ord-date')?.value;
    const due=document.getElementById('ord-due')?.value;
    const usePpn=document.getElementById('ord-ppn')?.value==='true';
    const discount=num(document.getElementById('ord-discount')?.value);
    const notes=document.getElementById('ord-notes')?.value;
    const validItems=formItems.filter(i=>i.prodId&&i.qty>0).map(i=>({...i,product:PRODUCTS.find(p=>p.id===i.prodId)}));
    const subtotal=validItems.reduce((s,i)=>s+num(i.qty)*num(i.unitPrice),0);
    const afterDisc=subtotal-discount;const ppn=usePpn?afterDisc*PPN_RATE:0;const grand=afterDisc+ppn;
    _docData=buildDocData({customer:cust,items:validItems,order_date:date,due_date:due,usePpn,discount,subtotal,ppn,grand,notes,invoiceNumber:null});
    _docType=type;renderDocModal();
  }

  function openDocForOrder(orderId,type){
    const o=ORDERS.find(x=>x.id===orderId);if(!o)return;
    const cust=CUSTOMERS.find(c=>c.id===o.customer_id);
    const items=ORDER_ITEMS.filter(i=>i.order_id===orderId).slice().sort((a,b)=>new Date(a.created_at||0)-new Date(b.created_at||0)).map(i=>({qty:i.qty,unitPrice:i.sell_price,itemNotes:i.order_ref,product:PRODUCTS.find(p=>p.id===i.product_id)}));
    _docData=buildDocData({customer:cust,items,order_date:o.invoice_date||o.order_date,due_date:o.due_date,usePpn:o.use_ppn,discount:o.discount,subtotal:o.subtotal,ppn:o.ppn_amount,grand:o.grand_total,notes:o.notes,invoiceNumber:o.invoice_number});
    _docType=type||'invoice';renderDocModal();
  }

  function switchDoc(type){_docType=type;renderDocModal();}

  function renderDocModal(){
    if(!_docData)return;
    ['so','surat_jalan','invoice'].forEach(t=>{const b=document.getElementById('doctab-'+t);if(b)b.classList.toggle('active',t===_docType);});
    const el=document.getElementById('inv-preview-content');
    if(el)el.innerHTML=['ASLI','COPY 1','COPY 2'].map(lbl=>renderOneDoc(_docType,_docData,lbl)).join('');
    const modal=document.getElementById('inv-modal');if(modal)modal.style.display='flex';
  }

  function closeInvModal(){const el=document.getElementById('inv-modal');if(el)el.style.display='none';}

  function renderOneDoc(type,d,copyLabel){
    const isAsli=copyLabel==='ASLI';
    const titleMap={so:'SALES ORDER',surat_jalan:'SURAT JALAN',invoice:'INVOICE'};
    const _code=BIZ.doc_prefix||'LOKA';

    return`<div class="doc-rangkap"><div class="inv-preview">

  function printDoc(){
    if(!_docData){toast('Buka dokumen dulu');return;}
    const body=['ASLI','COPY 1','COPY 2'].map(lbl=>renderOneDoc(_docType,_docData,lbl)).join('');
    const title=({so:'Sales Order',surat_jalan:'Surat Jalan',invoice:'Invoice'}[_docType]||'Dokumen')+' - '+(_docData.customer?.name||'');
    const w=window.open('','_blank');
    if(!w){toast('⚠️ Popup diblokir — izinkan popup untuk cetak');return;}
    w.document.write('<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><title>'+title+'</title><style>'+DOC_PRINT_CSS+'</style></head><body>'+body+'</body></html>');

  // Payments
  function openPayModal(orderId){
    if(window.YANZ.role!=='owner'){toast('❌ Hanya Owner');return;}
    const o=ORDERS.find(x=>x.id===orderId);if(!o)return;
    const cust=CUSTOMERS.find(c=>c.id===o.customer_id);
    const remaining=num(o.grand_total)-num(o.amount_paid);
    const info=document.getElementById('pay-info');
    if(info)info.innerHTML=`<strong>${o.invoice_number||'(Draft)'}</strong> — ${cust?.name||'–'}<br>Total: ${rp(o.grand_total)} · Dibayar: ${rp(o.amount_paid)} · <strong style="color:${remaining>0?'#DC2626':'#16A34A'}">Sisa: ${rp(remaining)}</strong>`;
    const set=(id,val)=>{const e=document.getElementById(id);if(e)e.value=val;};
    set('pay-order-id',orderId);set('pay-date',new Date().toISOString().split('T')[0]);
    set('pay-amount',remaining);set('pay-method','transfer');set('pay-ref','');set('pay-notes','');
    const st=document.getElementById('pay-st');if(st)st.textContent='';
    const modal=document.getElementById('pay-modal');if(modal)modal.style.display='flex';
  }

  function closePayModal(){const el=document.getElementById('pay-modal');if(el)el.style.display='none';}

  async function savePayment(){
    const orderId=document.getElementById('pay-order-id')?.value;
    const date=document.getElementById('pay-date')?.value;
    const amount=num(document.getElementById('pay-amount')?.value);
    const method=document.getElementById('pay-method')?.value;
    const ref=document.getElementById('pay-ref')?.value;
    const notes=document.getElementById('pay-notes')?.value;
    const st=document.getElementById('pay-st');
    if(!date||!amount){if(st){st.textContent='⚠️ Isi tanggal & jumlah';st.style.color='#D97706';}return;}
    if(st){st.textContent='Menyimpan…';st.style.color='#999';}
    try{
      await api('yanz_payments',{method:'POST',body:JSON.stringify({order_id:orderId,payment_date:date,amount,payment_method:method,reference:ref||null,notes:notes||null})});
      const o=ORDERS.find(x=>x.id===orderId);
      const newPaid=num(o.amount_paid)+amount;
      const newStatus=newPaid>=num(o.grand_total)?'paid':newPaid>0?'partial_paid':o.workflow_status;
      await api('yanz_sales_orders?id=eq.'+orderId,{method:'PATCH',body:JSON.stringify({amount_paid:newPaid,workflow_status:newStatus})});
      closePayModal();await loadAll();toast('Pembayaran tercatat ✓');
    }catch(e){if(st){st.textContent='❌ '+e.message;st.style.color='#DC2626';}}
  }

      return`<tr>
        <td><span class="bx bgr">${c.customer_code||'–'}</span></td>
        <td style="font-weight:600">${c.name}</td>
        <td>${c.city||'–'}</td>

  async function saveCustomer(){
    const id=document.getElementById('cm-id')?.value;
    const g=(eid)=>document.getElementById(eid)?.value||'';
    const body={
      customer_code:g('cm-code').trim().toUpperCase()||null,name:g('cm-name').trim(),
      pic_name:g('cm-pic').trim()||null,phone:g('cm-phone').trim()||null,
      email:g('cm-email').trim()||null,npwp:g('cm-npwp').trim()||null,
      address:g('cm-addr').trim()||null,city:g('cm-city').trim()||null,
      default_payment_terms:int(g('cm-terms'))||30,use_ppn:g('cm-ppn')==='true',
      notes:g('cm-notes').trim()||null
    };
    const st=document.getElementById('cm-st');
    if(!body.name){if(st){st.textContent='⚠️ Nama wajib';st.style.color='#D97706';}return;}
    if(st){st.textContent='Menyimpan…';st.style.color='#999';}
    try{
      if(id)await api('yanz_customers?id=eq.'+id,{method:'PATCH',body:JSON.stringify(body)});
      else await api('yanz_customers',{method:'POST',body:JSON.stringify(body)});
      closeCustomerModal();await loadAll();toast('Customer disimpan ✓');
    }catch(e){if(st){st.textContent='❌ '+e.message;st.style.color='#DC2626';}}

  async function deleteCustomer(id){
    if(window.YANZ.role!=='owner'){toast('❌ Hanya Owner');return;}
    const c=CUSTOMERS.find(x=>x.id===id);if(!c)return;
    if(!confirm(`Hapus customer "${c.name}"?`))return;
    try{
      await api('yanz_customers?id=eq.'+id,{method:'PATCH',body:JSON.stringify({is_active:false})});
      CUSTOMERS=CUSTOMERS.filter(x=>x.id!==id);renderAll();toast('Customer dihapus ✓');
    }catch(e){toast('❌ '+e.message);}
  }

  // Pricing tiers
  function loadProductPricing(){
    const pid=document.getElementById('pricing-prod')?.value;
    const wrap=document.getElementById('pricing-tiers');
    if(!pid){if(wrap)wrap.style.display='none';return;}
    if(wrap)wrap.style.display='';
    const tiers=TIERS.filter(t=>t.product_id===pid).sort((a,b)=>a.qty_min-b.qty_min);
    const list=document.getElementById('pricing-tiers-list');if(!list)return;
    if(!tiers.length){list.innerHTML='';addPricingTier();return;}
    list.innerHTML='';tiers.forEach(t=>addPricingTier(t));
  }

  function addPricingTier(t={}){
    const list=document.getElementById('pricing-tiers-list');if(!list)return;
    const row=document.createElement('div');row.className='tier-row';
    row.style.cssText='display:grid;grid-template-columns:100px 100px 1fr 32px;gap:8px;margin-bottom:6px;align-items:center';
    row.innerHTML=`<input type="number" placeholder="Qty min" value="${t.qty_min||1}" class="t-min" style="padding:7px 9px;border:1.5px solid #E8E6E0;border-radius:6px;font-size:12px;font-family:inherit;background:#fff" />
      <input type="number" placeholder="Qty max (∞)" value="${t.qty_max||''}" class="t-max" style="padding:7px 9px;border:1.5px solid #E8E6E0;border-radius:6px;font-size:12px;font-family:inherit;background:#fff" />
      <input type="number" placeholder="Harga satuan (Rp)" value="${t.unit_price||''}" class="t-price" style="padding:7px 9px;border:1.5px solid #E8E6E0;border-radius:6px;font-size:12px;font-family:inherit;background:#fff" />
      <button class="btn btn-d btn-sm" onclick="this.parentElement.remove()">×</button>`;

  }

  async function savePricing(){
    const pid=document.getElementById('pricing-prod')?.value;if(!pid)return;
    const rows=document.querySelectorAll('#pricing-tiers-list .tier-row');
    const st=document.getElementById('pricing-st');
    if(st){st.textContent='Menyimpan…';st.style.color='#999';}
    try{
      await api('yanz_b2b_pricing?product_id=eq.'+pid,{method:'DELETE'});
      for(const row of rows){
        const mn=int(row.querySelector('.t-min').value);
        const mx=row.querySelector('.t-max').value?int(row.querySelector('.t-max').value):null;
        const price=num(row.querySelector('.t-price').value);
        if(mn&&price>0)await api('yanz_b2b_pricing',{method:'POST',body:JSON.stringify({product_id:pid,qty_min:mn,qty_max:mx,unit_price:price})});
      }
      TIERS=await api('yanz_b2b_pricing');
      if(st){st.textContent='✓ Tier disimpan';st.style.color='#16A34A';}toast('Tier pricing disimpan ✓');
    }catch(e){if(st){st.textContent='❌ '+e.message;st.style.color='#DC2626';}}
  }
