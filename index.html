  async function loadAll(){
    setDB(false,'Menghubungkan…');
    try{
      let batches;
      try{batches=await api('yanz_purchase_batches?select=product_id,qty_remaining,payment_method,payment_status');}
      catch(e){batches=await api('yanz_purchase_batches?select=product_id,qty_remaining');}
      const [products,snaps]=await Promise.all([
        api('yanz_products?category=eq.product&is_active=eq.true&order=name'),
        api('yanz_velocity_snapshots?order=snapshot_date.desc&limit=2000')
      ]);
      PRODUCTS=products;BATCHES=batches;SNAPSHOTS=snaps;
      const stockMap={};TEMPO_PRODUCTS=new Set();
      BATCHES.forEach(b=>{stockMap[b.product_id]=(stockMap[b.product_id]||0)+num(b.qty_remaining);if(b.payment_method&&b.payment_method!=='cash')TEMPO_PRODUCTS.add(b.product_id);});
      PRODUCTS.forEach(p=>{p.current_stock=stockMap[p.id]||0;});
      setDB(true,`Terhubung ✓ — ${PRODUCTS.length} SKU produk · ${SNAPSHOTS.length} snapshots`);
      const lastDates=PRODUCTS.map(p=>p.last_velocity_calc).filter(d=>d).sort();
      const lastSnap=lastDates.length?lastDates[lastDates.length-1]:null;
      const lastSnapEl=document.getElementById('last-snap');
      if(lastSnapEl){
        if(lastSnap){const daysAgo=Math.floor((Date.now()-new Date(lastSnap))/86400000);lastSnapEl.innerHTML=`Update terakhir: <strong>${daysAgo===0?'hari ini':daysAgo+' hari lalu'}</strong> · ${fdtime(lastSnap)}`+(daysAgo>=7?' <span style="color:#D97706;font-weight:700">· Sudah waktunya update!</span>':'');}
        else lastSnapEl.innerHTML='<span style="color:#D97706;font-weight:700">Belum pernah update — klik tombol Update Data</span>';
      }
      renderKPIs();renderTable();
    }catch(e){setDB(false,'❌ '+e.message);console.error(e);}
  }

  async function runSnapshot(){
    if(role!=='owner'){toast('❌ Update data hanya untuk Owner');return;}
    if(!confirm(`Update data penjualan untuk ${PRODUCTS.length} produk?\n\nHitung kecepatan jual dari ${WINDOW_DAYS} hari terakhir. Proses 10-30 detik.`))return;
    const btn=document.getElementById('btn-snapshot');if(btn)btn.disabled=true;
    const prog=document.getElementById('snap-progress');
    const setProgress=(pct,msg)=>{if(prog)prog.innerHTML=`<div class="progress-card"><div class="ttl">🔄 Update data sedang berjalan…</div><div class="msg">${msg}</div><div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div></div>`;};
    try{
      setProgress(5,'Mengambil data penjualan…');
      const cutoff=new Date();cutoff.setDate(cutoff.getDate()-WINDOW_DAYS);
      const cutoffStr=cutoff.toISOString().split('T')[0];
      const orderItems=await api(`yanz_order_items?select=product_id,qty,payment_status,yanz_sales_orders!inner(channel,order_date,status)&payment_status=in.(paid,cod_paid)&yanz_sales_orders.order_date=gte.${cutoffStr}&yanz_sales_orders.status=neq.cancelled&yanz_sales_orders.channel=in.(ecommerce,b2b)`);
      setProgress(30,`Dapat ${orderItems.length} transaksi. Mengelompokkan…`);
      const salesByProduct={};
      orderItems.forEach(oi=>{const so=oi.yanz_sales_orders;if(!so)return;const pid=oi.product_id;const ch=so.channel==='ecommerce'?'ecom':'b2b';const date=so.order_date;if(!salesByProduct[pid])salesByProduct[pid]={ecom:{},b2b:{}};salesByProduct[pid][ch][date]=(salesByProduct[pid][ch][date]||0)+num(oi.qty);});
      setProgress(50,'Menghitung kecepatan jual…');
      const snapshotsToInsert=[],productUpdates=[];
      const todayStr=new Date().toISOString().split('T')[0];
      for(const p of PRODUCTS){
        const sales=salesByProduct[p.id]||{ecom:{},b2b:{}};
        const ecomDaily=fillDaily(sales.ecom,WINDOW_DAYS);
        const b2bDaily=fillDaily(sales.b2b,WINDOW_DAYS);
        const combinedDaily=ecomDaily.map((v,i)=>v+b2bDaily[i]);
        const v_normal_ecom=medianWinsorized(ecomDaily,WINSORIZE_PERCENTILE);
        const v_normal_b2b=medianWinsorized(b2bDaily,WINSORIZE_PERCENTILE);
        const v_peak_ecom=percentile(ecomDaily,PEAK_PERCENTILE);
        const v_peak_b2b=percentile(b2bDaily,PEAK_PERCENTILE);
        const vStddev=stddev(combinedDaily);
        const daysWithSales=combinedDaily.filter(v=>v>0).length;
        const totalSold=combinedDaily.reduce((a,b)=>a+b,0);
        const vCombined=v_normal_ecom+v_normal_b2b;
        const estDays=vCombined>0?p.current_stock/vCombined:null;
        snapshotsToInsert.push({product_id:p.id,snapshot_date:todayStr,window_days:WINDOW_DAYS,v_normal_ecom_daily:round4(v_normal_ecom),v_normal_b2b_daily:round4(v_normal_b2b),v_peak_ecom_daily:round4(v_peak_ecom),v_peak_b2b_daily:round4(v_peak_b2b),velocity_stddev:round4(vStddev),data_quality_days:daysWithSales,total_sold_window:totalSold,current_stock:p.current_stock,estimated_days_remaining:estDays!==null?round4(estDays):null});
        productUpdates.push({id:p.id,v_normal_ecom_daily:round4(v_normal_ecom),v_normal_b2b_daily:round4(v_normal_b2b),v_peak_ecom_daily:round4(v_peak_ecom),v_peak_b2b_daily:round4(v_peak_b2b),velocity_stddev:round4(vStddev),data_quality_days:daysWithSales,total_sold_window:totalSold,velocity_window_days:WINDOW_DAYS,last_velocity_calc:new Date().toISOString()});
      }
      setProgress(75,`Menyimpan ${snapshotsToInsert.length} hasil…`);
      for(let i=0;i<snapshotsToInsert.length;i+=100){await api('yanz_velocity_snapshots',{method:'POST',body:JSON.stringify(snapshotsToInsert.slice(i,i+100))});}
      setProgress(90,'Menyimpan ke master produk…');
      for(const u of productUpdates){const {id,...fields}=u;await api('yanz_products?id=eq.'+id,{method:'PATCH',body:JSON.stringify(fields)});}
      setProgress(100,`✓ Selesai! ${snapshotsToInsert.length} produk diperbarui.`);
      try{await api('yanz_activity',{method:'POST',body:JSON.stringify({icon:'⚡',text:`Update data: ${snapshotsToInsert.length} produk · window ${WINDOW_DAYS} hari`,time_ago:'Baru saja',color:'#F5F3FF'})});}catch{}
      setTimeout(()=>{if(prog)prog.innerHTML='';if(btn)btn.disabled=false;loadAll();toast(`✓ Update data selesai — ${snapshotsToInsert.length} produk`);},1200);
    }catch(e){if(prog)prog.innerHTML=`<div class="progress-card" style="background:#7F1D1D"><div class="ttl">❌ Update data gagal</div><div class="msg">${e.message}</div></div>`;if(btn)btn.disabled=false;console.error(e);}
  }

  function fillDaily(salesMap,windowDays){const out=[];const today=new Date();for(let i=windowDays-1;i>=0;i--){const d=new Date(today);d.setDate(d.getDate()-i);out.push(num(salesMap[d.toISOString().split('T')[0]])||0);}return out;}
  function percentile(values,p){if(!values.length)return 0;const s=[...values].sort((a,b)=>a-b);return s[Math.min(Math.floor(s.length*p/100),s.length-1)];}
  function medianWinsorized(values,wp){if(!values.length)return 0;const total=values.reduce((a,b)=>a+b,0);if(total===0)return 0;const cap=percentile(values,wp);const med=median(values.map(v=>Math.min(v,cap)));return med===0?total/values.length:med;}
  function median(values){if(!values.length)return 0;const s=[...values].sort((a,b)=>a-b);const m=Math.floor(s.length/2);return s.length%2===0?(s[m-1]+s[m])/2:s[m];}
  function stddev(values){if(values.length<2)return 0;const mean=values.reduce((a,b)=>a+b,0)/values.length;return Math.sqrt(values.reduce((a,b)=>a+(b-mean)**2,0)/(values.length-1));}
  function round4(n){return Math.round(num(n)*10000)/10000;}
  function zScore(svc){const t={85:1.04,90:1.28,93:1.48,95:1.65,97:1.88,98:2.05,99:2.33,99.5:2.58};const k=Object.keys(t).map(Number).sort((a,b)=>a-b);if(svc<=k[0])return t[k[0]];if(svc>=k[k.length-1])return t[k[k.length-1]];for(let i=0;i<k.length-1;i++){if(svc>=k[i]&&svc<=k[i+1]){const f=(svc-k[i])/(k[i+1]-k[i]);return t[k[i]]+f*(t[k[i+1]]-t[k[i]]);}}return 1.65;}

  function computeSmartBuffer(p){
    const vCombined=num(p.v_normal_ecom_daily)+num(p.v_normal_b2b_daily);
    const stock=num(p.current_stock);const lead=num(p.lead_time_days)||21;const svc=num(p.service_level_pct)||95;const sigma=num(p.velocity_stddev);
    const useSmart=p.use_smart_buffer!==false;
    let rop,safetyStock,demandDuringLead;
    if(useSmart){const z=zScore(svc);safetyStock=Math.ceil(z*sigma*Math.sqrt(lead));demandDuringLead=Math.ceil(vCombined*lead);rop=demandDuringLead+safetyStock;}
    else {rop=num(p.buffer_stock)||0;safetyStock=rop;demandDuringLead=0;}
    let status,statusLabel,statusColor;
    if(vCombined===0&&p.total_sold_window===0){status='inactive';statusLabel='⚪ Tidak ada penjualan';statusColor='#888';}
    else if(!useSmart){if(stock<=rop){status='critical';statusLabel='🔴 PESAN SEKARANG';statusColor='#DC2626';}else if(stock<=rop*1.3){status='warn';statusLabel='🟡 SIAP-SIAP';statusColor='#D97706';}else{status='ok';statusLabel='🟢 AMAN';statusColor='#16A34A';}}
    else if(rop===0){status='nodata';statusLabel='⚪ Data Kurang';statusColor='#888';}
    else if(stock<=rop){status='critical';statusLabel='🔴 PESAN SEKARANG';statusColor='#DC2626';}
    else if(stock<=rop*1.3){status='warn';statusLabel='🟡 SIAP-SIAP';statusColor='#D97706';}
    else{status='ok';statusLabel='🟢 AMAN';statusColor='#16A34A';}
    return {rop,safetyStock,demandDuringLead,status,statusLabel,statusColor,vCombined,useSmart};
  }

  function buildTrendChart(snaps){
    if(!snaps.length)return '';
    const W=680,Hh=180,pad={t:14,r:14,b:30,l:40};const plotW=W-pad.l-pad.r,plotH=Hh-pad.t-pad.b;
    const allVals=snaps.flatMap(s=>[num(s.v_normal_ecom_daily),num(s.v_normal_b2b_daily),num(s.v_peak_ecom_daily)+num(s.v_peak_b2b_daily)]);
    const maxVal=Math.max(...allVals,1);const xStep=snaps.length>1?plotW/(snaps.length-1):0;
    function buildLine(getter,color,dash=''){if(snaps.length<2)return '';const pts=snaps.map((s,i)=>{const x=pad.l+i*xStep;const v=getter(s);const y=pad.t+plotH-(v/maxVal*plotH);return `${x},${y}`;}).join(' ');return `<polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2" ${dash?'stroke-dasharray="4,3"':''} />`;}
    const yLabels=[0,maxVal/2,maxVal].map(v=>{const y=pad.t+plotH-(v/maxVal*plotH);return `<text x="${pad.l-6}" y="${y+3}" font-size="9" fill="#888" text-anchor="end">${decim(v,1)}</text><line x1="${pad.l}" y1="${y}" x2="${pad.l+plotW}" y2="${y}" stroke="#F0EDE8" stroke-width="1"/>`;}).join('');
    const xLabels=[0,Math.floor(snaps.length/2),snaps.length-1].filter((v,i,a)=>a.indexOf(v)===i).map(i=>{const x=pad.l+i*xStep;const d=new Date(snaps[i].snapshot_date);return `<text x="${x}" y="${Hh-12}" font-size="9" fill="#888" text-anchor="middle">${d.toLocaleDateString('id-ID',{day:'numeric',month:'short'})}</text>`;}).join('');
    return `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:11px"><span style="color:#666"><strong>${snaps.length}</strong> snapshots</span><div style="display:flex;gap:14px"><span><span style="display:inline-block;width:10px;height:2px;background:#EC4899;vertical-align:middle"></span> Live Normal</span><span><span style="display:inline-block;width:10px;height:2px;background:#2563EB;vertical-align:middle"></span> B2B Normal</span></div></div><svg width="100%" viewBox="0 0 ${W} ${Hh}" preserveAspectRatio="xMidYMid meet">${yLabels}${xLabels}${buildLine(s=>num(s.v_normal_ecom_daily),'#EC4899')}${buildLine(s=>num(s.v_normal_b2b_daily),'#2563EB')}${buildLine(s=>num(s.v_peak_ecom_daily)+num(s.v_peak_b2b_daily),'#888','dash')}</svg>`;
  }

  async function saveField(productId,field,value){

      p[field]=v;toast(`✓ ${p.name} tersimpan`);
      if(['lead_time_days','service_level_pct','use_smart_buffer'].includes(field)){renderKPIs();renderTable();}

// ── MODULE: Forecast Kas (Sub-fase 6.4) — owner analytics, payables-aware ─────
(function(){
  const api=(...a)=>window.YANZ.api(...a);
  const toast=(...a)=>window.YANZ.toast(...a);
  const rp=n=>window.YANZ.fmt.rp(n);
  const rpShort=n=>window.YANZ.fmt.rpShort(n);
  const num=n=>window.YANZ.fmt.num(n);
  const fd=d=>window.YANZ.fmt.fd(d);
  const fdt=d=>window.YANZ.fmt.fdt(d);

  let HORIZON=60;
  let SETTINGS={};
  let CURRENT_FORECAST=null;
  let FORECASTS_HISTORY=[];
  const rootEl=()=>document.querySelector('.module-forecast');
  const $=id=>document.getElementById(id);
  const setText=(id,v)=>{const e=$(id);if(e)e.textContent=v;};
  const setHTML=(id,v)=>{const e=$(id);if(e)e.innerHTML=v;};

  function setDB(ok,msg){const d=$('fk-dbd');if(d)d.className='dbd'+(ok?' on':'');const t=$('fk-dbt');if(t)t.textContent=msg;}

  function go(id){
    const r=rootEl();if(!r)return;
    r.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    const tab=r.querySelector('.tab[data-tab="'+id+'"]');if(tab)tab.classList.add('active');
    r.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
    const panel=$('fk-panel-'+id);if(panel)panel.classList.add('active');
    if(id==='settings')loadSettingsToUI();
    if(id==='history')renderHistory();
  }

  // ── LOAD SETTINGS ──
  async function loadSettings(){
    try{
      const rows=await api('yanz_finance_settings');
      SETTINGS={};
      rows.forEach(r=>{SETTINGS[r.setting_key]=r.setting_value;});
      if(!SETTINGS.unexpected_reserve_mode)SETTINGS.unexpected_reserve_mode='percent_cash';
      if(!SETTINGS.unexpected_reserve_value)SETTINGS.unexpected_reserve_value='15';
      if(!SETTINGS.vc_lookback_months)SETTINGS.vc_lookback_months='3';
      if(!SETTINGS.ecom_lookback_days)SETTINGS.ecom_lookback_days='60';
      if(!SETTINGS.b2b_include_overdue)SETTINGS.b2b_include_overdue='true';
    }catch(e){console.error('Load settings failed:',e);}
  }

  function loadSettingsToUI(){
    const sm=$('fk-set-reserve-mode');if(sm)sm.value=SETTINGS.unexpected_reserve_mode||'percent_cash';
    const sv=$('fk-set-reserve-value');if(sv)sv.value=SETTINGS.unexpected_reserve_value||'15';
    const vc=$('fk-set-vc-lookback');if(vc)vc.value=SETTINGS.vc_lookback_months||'3';
    const ec=$('fk-set-ecom-lookback');if(ec)ec.value=SETTINGS.ecom_lookback_days||'60';
    const bo=$('fk-set-b2b-overdue');if(bo)bo.value=SETTINGS.b2b_include_overdue||'true';
    updateReserveHint();
  }

  function updateReserveHint(){
    const modeEl=$('fk-set-reserve-mode');if(!modeEl)return;
    const mode=modeEl.value;
    const hint=$('fk-reserve-value-hint');
    const modeHint=$('fk-reserve-mode-hint');
    if(mode==='percent_cash'){
      if(hint)hint.textContent='% dari saldo kas (saran: 15-20% untuk retail import)';
      if(modeHint)modeHint.textContent='Cadangan auto-scale seiring saldo kas tumbuh.';
    } else if(mode==='months_opex'){
      if(hint)hint.textContent='Berapa bulan biaya operasional (saran: 1.5-2 bulan)';
      if(modeHint)modeHint.textContent='Cadangan setara N bulan FC+VC. Paling defensif.';
    } else {
      if(hint)hint.textContent='Nominal Rp dalam jutaan (misal: 50 = Rp 50jt)';
      if(modeHint)modeHint.textContent='Cadangan tetap, tidak menyesuaikan ukuran bisnis.';
    }
  }

  async function saveSettings(){
    const updates={
      unexpected_reserve_mode:$('fk-set-reserve-mode')?.value,
      unexpected_reserve_value:$('fk-set-reserve-value')?.value,
      vc_lookback_months:$('fk-set-vc-lookback')?.value,
      ecom_lookback_days:$('fk-set-ecom-lookback')?.value,
      b2b_include_overdue:$('fk-set-b2b-overdue')?.value
    };
    try{
      for(const [key,value] of Object.entries(updates)){
        if(value===undefined)continue;
        await api(`yanz_finance_settings?setting_key=eq.${key}`,{method:'PATCH',body:JSON.stringify({setting_value:String(value)})});
        SETTINGS[key]=value;
      }

  // ── FORECAST ENGINE ──
  function setHorizon(days){
    HORIZON=days;
    const r=rootEl();
    if(r)r.querySelectorAll('.hzn-btn').forEach(b=>{b.classList.toggle('active',Number(b.dataset.h)===days);});
    setText('fk-horizon-label',days);
    runForecast();
  }

  function countFCOccurrencesInHorizon(dayOfMonth,horizonDays){
    const today=new Date();
    const end=new Date(today);
    end.setDate(end.getDate()+horizonDays);
    let count=0;
    let cur=new Date(today.getFullYear(),today.getMonth(),dayOfMonth);
    if(cur<today)cur=new Date(today.getFullYear(),today.getMonth()+1,dayOfMonth);
    while(cur<=end){count++;cur=new Date(cur.getFullYear(),cur.getMonth()+1,dayOfMonth);}
    return count;
  }

  async function runForecast(){
    setDB(false,'Menghitung forecast…');
    try{
      const today=new Date();
      const endDate=new Date(today);
      endDate.setDate(endDate.getDate()+HORIZON);

      // 1. SALDO KAS SEKARANG
      const accounts=await api('yanz_cash_accounts?is_active=eq.true');
      const startingCash=accounts.reduce((s,a)=>s+num(a.current_balance),0);

      // 2. INFLOW B2B (deterministic dari invoices)
      const includeOverdue=SETTINGS.b2b_include_overdue==='true';
      const b2bOrders=await api('yanz_sales_orders?channel=eq.b2b&workflow_status=in.(sent,partial_paid,overdue)');
      let inflowB2BNormal=0,inflowB2BOverdue=0,b2bCount=0,b2bOverdueCount=0;
      b2bOrders.forEach(o=>{
        const outstanding=num(o.grand_total)-num(o.amount_paid);
        if(outstanding<=0)return;
        if(!o.due_date)return;
        const due=new Date(o.due_date);
        if(due<today){if(includeOverdue){inflowB2BOverdue+=outstanding;b2bOverdueCount++;}}
        else if(due<=endDate){inflowB2BNormal+=outstanding;b2bCount++;}
      });
      const inflowB2B=inflowB2BNormal+inflowB2BOverdue;

      // 3. INFLOW ECOM (probabilistic dari NSA history)
      const ecomLookbackDays=parseInt(SETTINGS.ecom_lookback_days||'60');
      const ecomLookbackStart=new Date(today);
      ecomLookbackStart.setDate(ecomLookbackStart.getDate()-ecomLookbackDays);
      const ecomLookbackStr=ecomLookbackStart.toISOString().split('T')[0];
      const settlements=await api(`yanz_marketplace_settlements?status=eq.confirmed&period_to=gte.${ecomLookbackStr}`);
      const totalNSA=settlements.reduce((s,x)=>s+num(x.total_nsa_amount),0);
      const ecomAvgPerDay=totalNSA/ecomLookbackDays;
      const inflowEcom=ecomAvgPerDay*HORIZON;

      // 4. OUTFLOW FC (deterministic dari templates)
      const fcTemplates=await api('yanz_fixed_cost_templates?is_active=eq.true');
      let outflowFC=0;
      const fcBreakdown=[];
      fcTemplates.forEach(t=>{
        const occurrences=countFCOccurrencesInHorizon(t.day_of_month,HORIZON);
        const total=num(t.amount)*occurrences;
        outflowFC+=total;
        if(occurrences>0)fcBreakdown.push({name:t.template_name,amount:num(t.amount),occurrences,total});
      });

      // 5. OUTFLOW VC (avg historical)
      const vcLookbackMonths=parseInt(SETTINGS.vc_lookback_months||'3');
      const vcStart=new Date(today);
      vcStart.setMonth(vcStart.getMonth()-vcLookbackMonths);
      const vcStartStr=vcStart.toISOString().split('T')[0];
      const expenses=await api(`yanz_expenses?cost_type=eq.variable&expense_date=gte.${vcStartStr}`);
      const totalVC=expenses.reduce((s,e)=>s+num(e.amount),0);
      const monthlyVC=vcLookbackMonths>0?totalVC/vcLookbackMonths:0;
      const outflowVC=monthlyVC*(HORIZON/30);

      // 6. OUTFLOW HUTANG USAHA (payables jatuh tempo) — kas terikat
      let purchaseBatches=[];
      try{purchaseBatches=await api('yanz_purchase_batches?payment_status=eq.unpaid&select=qty_purchased,landed_cost_per_unit,payment_due_date,supplier_name,po_date');}
      catch(e){purchaseBatches=[];} // kolom payment_* belum ada (migration belum dijalankan) → anggap tak ada hutang
      let outflowPayables=0,payablesCount=0,payablesOverdue=0,payablesOverdueCount=0;
      purchaseBatches.forEach(b=>{
        const amt=num(b.qty_purchased)*num(b.landed_cost_per_unit);
        if(amt<=0)return;
        const due=b.payment_due_date?new Date(b.payment_due_date):null;
        let include=false,isOverdue=false;
        if(!due)include=true;                          // hutang tanpa jatuh tempo → tetap terikat
        else if(due<today){include=true;isOverdue=true;} // sudah lewat → wajib bayar
        else if(due<=endDate)include=true;             // jatuh tempo dalam horizon
        if(!include)return;
        outflowPayables+=amt;payablesCount++;
        if(isOverdue){payablesOverdue+=amt;payablesOverdueCount++;}
      });

      // 7. UNEXPECTED RESERVE
      const reserveMode=SETTINGS.unexpected_reserve_mode||'percent_cash';
      const reserveValue=parseFloat(SETTINGS.unexpected_reserve_value)||15;
      let reserve=0;
      if(reserveMode==='percent_cash')reserve=startingCash*reserveValue/100;
      else if(reserveMode==='fixed_amount')reserve=reserveValue*1e6;
      else if(reserveMode==='months_opex'){const fcMonthly=outflowFC/(HORIZON/30);reserve=reserveValue*(fcMonthly+monthlyVC);}

      // 8. FINAL BUDGET — sadar-hutang
      const procurementBudget=startingCash+inflowB2B+inflowEcom-outflowFC-outflowVC-outflowPayables-reserve;

      CURRENT_FORECAST={
        horizonDays:HORIZON,startingCash,
        inflowB2BNormal,inflowB2BOverdue,inflowB2B,b2bCount,b2bOverdueCount,
        inflowEcom,ecomAvgPerDay,settlementsUsed:settlements.length,
        outflowFC,fcBreakdown,outflowVC,monthlyVC,expensesUsed:expenses.length,
        outflowPayables,payablesCount,payablesOverdue,payablesOverdueCount,
        reserve,reserveMode,reserveValue,procurementBudget,
        includeOverdue,vcLookbackMonths,ecomLookbackDays
      };
      renderForecast();
      setDB(true,`Forecast siap — ${HORIZON} hari ke depan`);
    }catch(e){setDB(false,'❌ '+e.message);console.error(e);}
  }

  async function saveSnapshot(){
    if(!CURRENT_FORECAST){toast('⚠️ Forecast belum siap');return;}
    const f=CURRENT_FORECAST;
    const notes=prompt('Catatan untuk snapshot ini (opsional, misal: "Sebelum PO Juli"):');
    if(notes===null)return;
    const base={
      horizon_days:f.horizonDays,starting_cash:f.startingCash,
      projected_inflow_b2b_normal:f.inflowB2BNormal,projected_inflow_b2b_overdue:f.inflowB2BOverdue,
      projected_inflow_ecom:f.inflowEcom,projected_inflow_total:f.inflowB2B+f.inflowEcom,
      projected_outflow_fc:f.outflowFC,projected_outflow_vc:f.outflowVC,
      unexpected_reserve:f.reserve,procurement_budget:f.procurementBudget,
      reserve_mode:f.reserveMode,reserve_value:f.reserveValue,
      vc_lookback_months:f.vcLookbackMonths,ecom_avg_per_day:f.ecomAvgPerDay,
      include_overdue:f.includeOverdue,notes:notes||null
    };
    try{
      try{await api('yanz_cashflow_forecasts',{method:'POST',body:JSON.stringify({...base,projected_outflow_payables:f.outflowPayables})});}
      catch(e){await api('yanz_cashflow_forecasts',{method:'POST',body:JSON.stringify(base)});} // kolom payables opsional
      toast('✓ Forecast tersimpan ke riwayat');
    }catch(e){toast('❌ '+e.message);console.error(e);}
  }

      <p style="font-size:12px;color:#666;margin-bottom:14px">Setiap snapshot adalah forecast yang Anda klik "Simpan". Berguna untuk lihat tren modal procurement dari waktu ke waktu, atau audit decision PO di masa lalu.</p>
      <div id="fk-history-list"><div class="loading">Memuat…</div></div>
    </div>
  </div>
</div>`;

  async function init(){
    setDB(false,'Menghubungkan…');
    await loadSettings();
    HORIZON=parseInt(SETTINGS.forecast_default_horizon||'60');
    const r=rootEl();
    if(r)r.querySelectorAll('.hzn-btn').forEach(b=>{b.classList.toggle('active',Number(b.dataset.h)===HORIZON);});

  window.YANZ.modules.forecast={

})();

// ── MODULE: Procurement Intelligence (Sub-fase 6.4) — owner full, staff packaging-only ──
(function(){
  const api=(...a)=>window.YANZ.api(...a);
  const toast=(...a)=>window.YANZ.toast(...a);
  const rp=n=>window.YANZ.fmt.rp(n);
  const rpShort=n=>window.YANZ.fmt.rpShort(n);
  const num=n=>window.YANZ.fmt.num(n);
  const fdt=d=>window.YANZ.fmt.fdt(d);

  const W_URGENCY=0.5,W_MARGIN=0.3,W_VOLUME=0.2;
  const PACKAGING_WINDOW_DAYS=60;

  let role='owner';
  let CURRENT_RUN=null;
  let HISTORY=[];
  const rootEl=()=>document.querySelector('.module-procurement');
  const isOwner=()=>role==='owner';
  const $=id=>document.getElementById(id);
  const setHTML=(id,v)=>{const e=$(id);if(e)e.innerHTML=v;};

  function setDB(ok,msg){const d=$('pr-dbd');if(d)d.className='dbd'+(ok?' on':'');const t=$('pr-dbt');if(t)t.textContent=msg;}
  function applyRoleVisibility(){const r=rootEl();if(!r)return;r.querySelectorAll('.oo').forEach(el=>el.style.display=isOwner()?'':'none');}

  function go(id){
    if(id==='history'&&!isOwner()){id='generate';} // staff tak punya akses riwayat PO
    const r=rootEl();if(!r)return;
    r.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    const tab=r.querySelector('.tab[data-tab="'+id+'"]');if(tab)tab.classList.add('active');
    r.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
    const panel=$('pr-panel-'+id);if(panel)panel.classList.add('active');
    if(id==='history')renderHistory();
  }

  function zScore(pct){
    const t={85:1.04,90:1.28,93:1.48,95:1.65,97:1.88,98:2.05,99:2.33,99.5:2.58};
    const k=Object.keys(t).map(Number).sort((a,b)=>a-b);
    if(pct<=k[0])return t[k[0]];if(pct>=k[k.length-1])return t[k[k.length-1]];
    for(let i=0;i<k.length-1;i++){if(pct>=k[i]&&pct<=k[i+1]){const x=(pct-k[i])/(k[i+1]-k[i]);return t[k[i]]+x*(t[k[i+1]]-t[k[i]]);}}
    return 1.65;
  }

  function setProgress(pct,msg){setHTML('pr-progress-area',`<div class="progress-card"><div class="ttl">⚡ Menghitung saran…</div><div class="msg">${msg}</div><div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div></div>`);}
  function clearProgress(){setHTML('pr-progress-area','');}

  // ── MAIN ENGINE ──
  async function generateRecommendation(){
    const owner=isOwner();
    const btn=$('pr-btn-generate');if(btn)btn.disabled=true;
    try{
      let forecast=null,budget=Infinity;
      if(owner){
        setProgress(10,'Mengambil budget dari Forecast Kas terbaru…');
        const forecasts=await api('yanz_cashflow_forecasts?order=run_date.desc&limit=1');
        if(!forecasts.length)throw new Error('Belum ada forecast tersimpan. Buka modul Forecast Kas → Simpan Forecast dulu, baru kembali ke sini.');
        forecast=forecasts[0];
        budget=num(forecast.procurement_budget);
        if(budget<=0)throw new Error(`Budget procurement Anda saat ini ${rp(budget)} (negatif/nol). Tidak ada modal untuk PO. Cek Forecast Kas.`);
      }

      setProgress(25,'Memuat data '+(owner?'produk + packaging':'packaging')+'…');
      const productsAll=await api('yanz_products?is_active=eq.true&order=name');
      const products=owner?productsAll:productsAll.filter(p=>p.category==='packaging'); // staff: packaging-only, harga beli produk tak pernah di-load

      setProgress(35,'Menghitung stok saat ini per SKU (FIFO)…');
      const batches=await api('yanz_purchase_batches?select=product_id,qty_remaining');
      const stockMap={};
      batches.forEach(b=>{stockMap[b.product_id]=(stockMap[b.product_id]||0)+num(b.qty_remaining);});
      products.forEach(p=>{p._stock=stockMap[p.id]||0;});

      setProgress(50,'Menghitung velocity packaging (60 hari terakhir)…');
      const cutoff=new Date();cutoff.setDate(cutoff.getDate()-PACKAGING_WINDOW_DAYS);
      const cutoffStr=cutoff.toISOString().split('T')[0];
      const pkgUsage=await api(`yanz_order_packaging?select=packaging_id,qty_used,yanz_sales_orders!inner(order_date,status)&yanz_sales_orders.order_date=gte.${cutoffStr}&yanz_sales_orders.status=neq.cancelled`);
      const pkgUsageMap={};
      pkgUsage.forEach(u=>{const id=u.packaging_id;if(!pkgUsageMap[id])pkgUsageMap[id]={total:0,days:new Set()};pkgUsageMap[id].total+=num(u.qty_used);pkgUsageMap[id].days.add(u.yanz_sales_orders.order_date);});

      setProgress(70,'Mengaplikasikan algoritma rekomendasi…');
      const candidates=products.map(p=>{
        const isPackaging=p.category==='packaging';
        let velocity=0;
        if(isPackaging){const usage=pkgUsageMap[p.id];velocity=usage?usage.total/PACKAGING_WINDOW_DAYS:0;}
        else velocity=num(p.v_normal_ecom_daily)+num(p.v_normal_b2b_daily);
        const lead=num(p.lead_time_days)||21;
        const cycle=num(p.cycle_target_days)||(isPackaging?90:60);
        const sigma=num(p.velocity_stddev);
        const svc=num(p.service_level_pct)||95;
        const z=zScore(svc);
        const safetyStock=Math.ceil(z*sigma*Math.sqrt(lead));
        const targetStock=Math.ceil(velocity*(lead+cycle))+safetyStock;
        const stock=p._stock;
        const qtyRecommended=Math.max(0,targetStock-stock);
        const daysUntilStockout=velocity>0?stock/velocity:9999;
        const unitCost=num(p.current_unit_cost)||num(p.landed_cost_per_unit)||0;
        const totalCost=qtyRecommended*unitCost;
        const urgency=Math.max(0,Math.min(100,100-daysUntilStockout));
        const sellPrice=num(p.selling_price);
        const margin=unitCost>0?Math.min(100,((sellPrice-unitCost)/unitCost)*100):0;
        const revenuePerDay=velocity*sellPrice;
        return {...p,_isPackaging:isPackaging,_velocity:velocity,_stock:stock,_lead:lead,_cycle:cycle,_safetyStock:safetyStock,_targetStock:targetStock,_qtyRecommended:qtyRecommended,_daysUntilStockout:daysUntilStockout,_unitCost:unitCost,_totalCost:totalCost,_urgencyScore:urgency,_marginScore:margin,_revenuePerDay:revenuePerDay};
      }).filter(p=>p._qtyRecommended>0);

      const maxRev=Math.max(...candidates.map(c=>c._revenuePerDay),0.01);
      candidates.forEach(c=>{c._volumeScore=(c._revenuePerDay/maxRev)*100;c._hybridScore=W_URGENCY*c._urgencyScore+W_MARGIN*c._marginScore+W_VOLUME*c._volumeScore;});

      setProgress(85,'Alokasi budget — packaging dulu (hard constraint), lalu produk by skor…');
      const packaging=candidates.filter(c=>c._isPackaging).sort((a,b)=>a._daysUntilStockout-b._daysUntilStockout);
      let totalPackagingCost=0;
      packaging.forEach(p=>{p._priority='packaging';p._included=true;totalPackagingCost+=p._totalCost;});

      let productsCandidates=[],totalProductCost=0,productsIncluded=0,productsDropped=0,packagingShortfall=false;
      if(owner){
        productsCandidates=candidates.filter(c=>!c._isPackaging).sort((a,b)=>b._hybridScore-a._hybridScore);
        let remainingBudget=budget-totalPackagingCost;
        packagingShortfall=remainingBudget<0;
        productsCandidates.forEach(p=>{
          if(remainingBudget>=p._totalCost){
            p._included=true;remainingBudget-=p._totalCost;totalProductCost+=p._totalCost;productsIncluded++;
            if(p._hybridScore>=70)p._priority='critical';else if(p._hybridScore>=50)p._priority='high';else if(p._hybridScore>=30)p._priority='medium';else p._priority='low';
          } else {
            p._included=false;p._priority='dropped';
            p._dropReason=p._totalCost>budget?`Cost (${rpShort(p._totalCost)}) > total budget`:`Tidak muat di sisa budget (${rpShort(remainingBudget)})`;
            productsDropped++;
          }
        });
      }

      CURRENT_RUN={
        owner,forecast,budget,packaging,products:productsCandidates,
        totalPackagingCost,totalProductCost,totalCost:totalPackagingCost+totalProductCost,
        remainingBudget:owner?budget-(totalPackagingCost+totalProductCost):0,
        packagingCount:packaging.length,productsIncluded,productsDropped,packagingShortfall
      };

      setProgress(100,'Selesai!');
      setTimeout(()=>{clearProgress();renderRecommendation();const b=$('pr-btn-generate');if(b)b.disabled=false;},500);
    }catch(e){
      setHTML('pr-progress-area',`<div class="warning-box">❌ ${e.message}</div>`);
      const b=$('pr-btn-generate');if(b)b.disabled=false;
      console.error(e);
    }
  }

  // ── RENDER ──
  function renderRecommendation(){
    if(!CURRENT_RUN)return;
    const r=CURRENT_RUN;
    const area=$('pr-recommendation-area');if(!area)return;
    recomputeTotals();

    // ── STAFF: packaging-only view ──
    if(!r.owner){
      if(!r.packaging.length){
        area.innerHTML=`<div class="empty"><div style="font-size:32px;margin-bottom:8px">✅</div><strong>Semua packaging stoknya aman.</strong><br>Belum ada packaging yang perlu dipesan saat ini.</div>`;
        return;
      }
      let html=`<div class="budget-grid"><div class="budget-card main"><div class="l">📦 Total Kebutuhan Packaging</div><div class="v">${rpShort(r.totalPackagingCost)}</div><div class="s">${r.packaging.length} jenis packaging perlu dipesan</div></div></div>`;
      html+=`<div class="info-box"><span style="font-size:18px">💡</span><div>Estimasi <strong>kebutuhan packaging</strong> berdasarkan kecepatan pemakaian 60 hari terakhir. Koordinasikan dengan owner untuk commit PO final.</div></div>`;
      html+=`<div class="section-hd">📦 PACKAGING <span class="badge-count">${r.packaging.length}</span></div>`;
      html+=buildItemTable(r.packaging,'packaging',false);
      area.innerHTML=html;
      return;
    }

    // ── OWNER: full view ──
    const overBudget=r.totalCost>r.budget;
    let html=`<div class="budget-grid">
      <div class="budget-card main"><div class="l">💰 Budget Tersedia</div><div class="v">${rpShort(r.budget)}</div><div class="s">Dari Forecast Kas terbaru (sudah dikurangi hutang usaha)</div></div>
      <div class="budget-card"><div class="l">Total Rekomendasi</div><div class="v" id="pr-tc-total">${rpShort(r.totalCost)}</div><div class="s">${r.packagingCount} packaging · ${r.productsIncluded} produk</div></div>
      <div class="budget-card ${r.remainingBudget>=0?'positive':'negative'}"><div class="l">Sisa / Selisih</div><div class="v" id="pr-tc-remaining">${rpShort(r.remainingBudget)}</div><div class="s">${r.remainingBudget>=0?'Aman, masih di bawah budget':'⚠️ Over budget — perlu adjust'}</div></div>
      <div class="budget-card"><div class="l">Items Dropped</div><div class="v">${r.productsDropped}</div><div class="s">SKU tidak muat budget</div></div>
    </div>`;

    if(r.packagingShortfall){
      html+=`<div class="warning-box"><span style="font-size:18px">⚠️</span><div><strong>Packaging shortfall!</strong> Total kebutuhan packaging (${rpShort(r.totalPackagingCost)}) sudah melebihi budget (${rpShort(r.budget)}). Packaging tetap di-include karena critical (tanpa packaging = tidak bisa kirim), tapi siapkan modal tambahan atau kurangi qty packaging manual.</div></div>`;
    } else if(overBudget){
      html+=`<div class="warning-box"><span style="font-size:18px">⚠️</span><div><strong>Over budget!</strong> Total ${rpShort(r.totalCost)} melebihi budget ${rpShort(r.budget)} (selisih ${rpShort(r.totalCost-r.budget)}). Edit qty/harga di bawah, atau exclude beberapa item.</div></div>`;
    }
    html+=`<div class="info-box"><span style="font-size:18px">💡</span><div><strong>Cara pakai:</strong> Edit <strong>Qty</strong> dan <strong>Harga</strong> sesuai konfirmasi supplier. Total auto-update. Checkbox untuk exclude item. Setelah final, klik <strong>"Commit PO"</strong> di bawah.</div></div>`;

    if(r.packaging.length){
      html+=`<div class="section-hd">📦 PACKAGING <span class="badge-count">${r.packaging.length}</span><span style="font-size:11px;color:#92400E;font-weight:600">⚠️ HARD CONSTRAINT — tanpa packaging, tidak bisa kirim</span></div>`;
      html+=buildItemTable(r.packaging,'packaging',true);
    }
    const included=r.products.filter(p=>p._included);
    if(included.length){
      html+=`<div class="section-hd">🛒 PRODUK (Termasuk PO) <span class="badge-count">${included.length}</span><span style="font-size:11px;color:#888;font-weight:500">— Diurutkan berdasarkan skor prioritas</span></div>`;
      html+=buildItemTable(included,'product-included',true);
    }
    const dropped=r.products.filter(p=>!p._included);
    if(dropped.length){
      html+=`<div class="section-hd">⛔ DROPPED <span class="badge-count">${dropped.length}</span><span style="font-size:11px;color:#888;font-weight:500">— Tidak muat budget, menunggu PO berikutnya</span></div>`;
      html+=buildItemTable(dropped,'product-dropped',true);
    }
    html+=`<div class="action-footer">
      <div style="font-size:12px;color:#666"><strong>Total Akhir:</strong> <span id="pr-tc-action">${rpShort(r.totalCost)}</span> dari budget ${rpShort(r.budget)}</div>
      <div style="display:flex;gap:8px">
        <button class="btn btn-s" onclick="proc.cancelRun()">Batal</button>
        <button class="btn btn-success btn-big" onclick="proc.commitRun()">✓ Commit PO Recommendation</button>
      </div>
    </div>`;
    area.innerHTML=html;
  }

  function buildItemTable(items,kind,editable){
    const isPackaging=kind==='packaging';
    const isDropped=kind==='product-dropped';
    return `<div class="tbl-wrap" style="margin-bottom:14px"><table class="tbl">
      <thead><tr><th style="width:30px"></th><th>SKU / Nama</th><th class="num">Stok</th><th class="num">Pakai/hari</th><th class="num">Cukup utk</th><th class="num">Qty PO</th><th class="num">Harga/unit</th><th class="num">Total</th><th>Prioritas / Skor</th></tr></thead><tbody>
      ${items.map(p=>{
        const icon=isPackaging?'📦':(p.is_bundle?'🎁':'🛍️');
        const days=p._daysUntilStockout<9999?Math.round(p._daysUntilStockout)+'d':'∞';
        const daysColor=p._daysUntilStockout<14?'#DC2626':(p._daysUntilStockout<30?'#D97706':'#16A34A');
        let priorityCell;
        if(isPackaging)priorityCell=`<span class="pill p-packaging">🔒 LOCKED</span>`;
        else if(isDropped)priorityCell=`<span class="pill p-dropped">⛔ DROPPED</span><div style="font-size:10px;color:#888;margin-top:2px">${p._dropReason||''}</div>`;
        else{const cls={critical:'p-critical',high:'p-high',medium:'p-medium',low:'p-low'}[p._priority]||'p-low';priorityCell=`<span class="pill ${cls}">${p._priority.toUpperCase()}</span><div style="font-size:10px;color:#888;margin-top:2px">Skor: <strong>${p._hybridScore.toFixed(0)}</strong> <span class="score-bar"><span class="score-bar-fill" style="width:${p._hybridScore}%"></span></span></div>`;}
        const rowClass=isPackaging?'packaging-row':(isDropped?'dropped':'');
        const disabled=isDropped?'disabled':'';
        const checkCell=isPackaging?'🔒':(editable?`<input type="checkbox" ${p._included?'checked':''} onchange="proc.toggleInclude('${p.id}',this.checked)" title="Include/exclude dari PO">`:(p._included?'✓':''));
        const qtyCell=editable?`<input type="number" class="qty-input" min="0" value="${p._qtyRecommended}" ${disabled} onchange="proc.updateQty('${p.id}',this.value)">`:`<strong>${p._qtyRecommended}</strong>`;
        const priceCell=editable?`<input type="number" class="price-input" min="0" step="100" value="${p._unitCost}" ${disabled} onchange="proc.updatePrice('${p.id}',this.value)" data-initial="${p._unitCost}">`:`<strong>${rp(p._unitCost)}</strong>`;
        return `<tr class="${rowClass}" data-pid="${p.id}">
          <td>${checkCell}</td>
          <td><div class="sku-cell"><div class="sku-icon">${icon}</div><div class="sku-info"><div class="nm">${p.name}</div><div class="cd">${p.sku}${p.supplier_name?' · '+p.supplier_name:''}</div></div></div></td>
          <td class="num"><strong>${p._stock}</strong></td>
          <td class="num">${p._velocity.toFixed(2)}</td>
          <td class="num"><span style="color:${daysColor};font-weight:700">${days}</span></td>
          <td class="num">${qtyCell}</td>
          <td class="num">${priceCell}</td>
          <td class="num"><strong id="pr-total-${p.id}">${rpShort(p._totalCost)}</strong></td>
          <td>${priorityCell}</td>
        </tr>`;
      }).join('')}
      </tbody></table></div>`;
  }

  // ── INTERACTION ──
  function findItem(id){if(!CURRENT_RUN)return null;return [...CURRENT_RUN.packaging,...CURRENT_RUN.products].find(p=>p.id===id);}
  function updateQty(id,value){const p=findItem(id);if(!p)return;p._qtyRecommended=Math.max(0,parseInt(value)||0);p._totalCost=p._qtyRecommended*p._unitCost;const el=$('pr-total-'+id);if(el)el.textContent=rpShort(p._totalCost);recomputeTotals();refreshBudgetCards();}
  function updatePrice(id,value){const p=findItem(id);if(!p)return;const newCost=Math.max(0,parseFloat(value)||0);const input=rootEl()?.querySelector(`tr[data-pid="${id}"] .price-input`);if(input){const initial=parseFloat(input.dataset.initial)||0;input.classList.toggle('changed',newCost!==initial);}p._unitCost=newCost;p._totalCost=p._qtyRecommended*p._unitCost;const el=$('pr-total-'+id);if(el)el.textContent=rpShort(p._totalCost);recomputeTotals();refreshBudgetCards();}
  function toggleInclude(id,checked){const p=findItem(id);if(!p)return;p._included=checked;recomputeTotals();refreshBudgetCards();}

  function recomputeTotals(){
    if(!CURRENT_RUN)return;
    const r=CURRENT_RUN;
    let pkgCost=0,prodCost=0,prodIncl=0,prodDrop=0;
    r.packaging.forEach(p=>{if(p._included)pkgCost+=p._totalCost;});
    r.products.forEach(p=>{if(p._included){prodCost+=p._totalCost;prodIncl++;}else prodDrop++;});
    r.totalPackagingCost=pkgCost;r.totalProductCost=prodCost;r.totalCost=pkgCost+prodCost;
    r.remainingBudget=r.budget-r.totalCost;r.productsIncluded=prodIncl;r.productsDropped=prodDrop;
  }

  function refreshBudgetCards(){
    const r=CURRENT_RUN;if(!r)return;
    const totalEl=$('pr-tc-total');if(totalEl)totalEl.textContent=rpShort(r.totalCost);
    const remEl=$('pr-tc-remaining');
    if(remEl){
      remEl.textContent=rpShort(r.remainingBudget);
      const card=remEl.closest('.budget-card');
      if(card){card.classList.remove('positive','negative');card.classList.add(r.remainingBudget>=0?'positive':'negative');const sub=card.querySelector('.s');if(sub)sub.textContent=r.remainingBudget>=0?'Aman, masih di bawah budget':'⚠️ Over budget — perlu adjust';}
    }
    const actEl=$('pr-tc-action');if(actEl)actEl.textContent=rpShort(r.totalCost);
  }

  // ── COMMIT / CANCEL ──
  function cancelRun(){
    if(!confirm('Batalkan rekomendasi ini? Data tidak akan tersimpan.'))return;
    CURRENT_RUN=null;
    setHTML('pr-recommendation-area',`<div class="empty"><div style="font-size:32px;margin-bottom:8px">🎯</div><strong>Rekomendasi dibatalkan.</strong><br>Klik <strong>"Generate Rekomendasi Baru"</strong> di atas untuk mulai lagi.</div>`);
  }

  async function commitRun(){
    if(!isOwner()){toast('❌ Commit PO hanya untuk Owner');return;}
    if(!CURRENT_RUN){toast('⚠️ Tidak ada rekomendasi aktif');return;}
    const r=CURRENT_RUN;
    recomputeTotals();
    const notes=prompt('Catatan untuk PO ini (opsional, misal: "PO Juli — Supplier Guangzhou"):');
    if(notes===null)return;
    try{
      const runR=await api('yanz_procurement_runs',{method:'POST',headers:{'Prefer':'return=representation'},body:JSON.stringify({
        available_budget:r.budget,forecast_id:r.forecast?.id||null,horizon_days:r.forecast?.horizon_days||60,
        packaging_cost:r.totalPackagingCost,product_cost:r.totalProductCost,total_recommended_cost:r.totalCost,
        remaining_budget:r.remainingBudget,packaging_count:r.packaging.filter(p=>p._included).length,
        products_included:r.productsIncluded,products_dropped:r.productsDropped,
        weight_urgency:W_URGENCY,weight_margin:W_MARGIN,weight_volume:W_VOLUME,
        status:'confirmed',confirmed_at:new Date().toISOString(),confirmed_by:'owner',notes:notes||null
      })});
      const runId=runR[0].id;
      const allItems=[...r.packaging,...r.products];
      const itemPayload=allItems.map(p=>({
        run_id:runId,product_id:p.id,sku:p.sku,product_name:p.name,is_packaging:p._isPackaging,
        current_stock:p._stock,velocity_used:p._velocity,lead_time_days:p._lead,cycle_target_days:p._cycle,
        safety_stock:p._safetyStock,qty_recommended:p._qtyRecommended,qty_final:p._qtyRecommended,
        unit_cost_initial:num(p.current_unit_cost)||num(p.landed_cost_per_unit)||0,unit_cost_final:p._unitCost,total_cost:p._totalCost,
        urgency_score:p._urgencyScore||0,margin_score:p._marginScore||0,volume_score:p._volumeScore||0,hybrid_score:p._hybridScore||0,
        priority:p._priority,drop_reason:p._dropReason||null,is_included:p._included
      }));
      for(let i=0;i<itemPayload.length;i+=50){await api('yanz_procurement_run_items',{method:'POST',body:JSON.stringify(itemPayload.slice(i,i+50))});}
      try{await api('yanz_activity',{method:'POST',body:JSON.stringify({icon:'📋',text:`PO Recommendation committed: ${r.packaging.length} packaging + ${r.productsIncluded} produk · ${rpShort(r.totalCost)}`,time_ago:'Baru saja',color:'#F0FDF4'})});}catch(e){}
      for(const p of allItems){
        if(!p._included)continue;

(function(){

  function depr(a){
    const cost=num(a.acquisition_cost),salvage=num(a.salvage_value);
    const life=Math.max(1,parseInt(a.useful_life_months)||1);
    const depreciable=Math.max(0,cost-salvage);
    const monthly=depreciable/life;
    const start=new Date(a.acquisition_date);
    const asOf=(a.status==='disposed'&&a.disposed_date)?new Date(a.disposed_date):new Date();
    let m=(asOf.getFullYear()-start.getFullYear())*12+(asOf.getMonth()-start.getMonth());
    if(asOf.getDate()<start.getDate())m--;
    m=Math.max(0,Math.min(life,m));
    const accumulated=Math.min(depreciable,monthly*m);
    const nbv=cost-accumulated;
    return {cost,salvage,life,depreciable,monthly,monthsElapsed:m,accumulated,nbv,fullyDep:m>=life};
  }

  async function save(){
    const id=$('fa-m-id').value;
    const name=$('fa-m-name').value.trim();
    const cost=num($('fa-m-cost').value);
    const lifeY=num($('fa-m-life').value);

    const acctId=$('fa-m-account')?$('fa-m-account').value:'';
    const adate=$('fa-m-date').value;
    const body={
      name,category:$('fa-m-cat').value,
      acquisition_date:adate,
      acquisition_cost:cost,
      salvage_value:num($('fa-m-salvage').value),
      useful_life_months:Math.round(lifeY*12),
      notes:$('fa-m-notes').value.trim()||null,
      paid_from_account_id:acctId||null
    };
    // POST/PATCH defensif: kalau kolom paid_from_account_id belum ada (migrasi belum jalan),
    // ulangi tanpa kolom itu — pencatatan aset & kas tetap jalan.
    const send=(path,method,b)=>api(path,{method,headers:method==='POST'?{'Prefer':'return=representation'}:{},body:JSON.stringify(b)})
      .catch(e=>{if(/paid_from_account_id/.test(e.message)){const {paid_from_account_id,...b2}=b;return api(path,{method,headers:method==='POST'?{'Prefer':'return=representation'}:{},body:JSON.stringify(b2)});}throw e;});
    try{
      if(id){
        await send('yanz_fixed_assets?id=eq.'+id,'PATCH',body);

(function(){
  const api=(...a)=>window.YANZ.api(...a);

  let EQUITY=[],ACCOUNTS=[],MOVEMENTS=[],BATCHES=[],B2B=[],ASSETS=[];

  function setDB(ok,msg){const d=$('bs-dbd');if(d)d.className='dbd'+(ok?' on':'');const t=$('bs-dbt');if(t)t.textContent=msg;}

  function nbvOf(a){
    const cost=num(a.acquisition_cost),salvage=num(a.salvage_value);
    const life=Math.max(1,parseInt(a.useful_life_months)||1);
    const depreciable=Math.max(0,cost-salvage);
    const monthly=depreciable/life;
    const start=new Date(a.acquisition_date);
    const asOf=(a.status==='disposed'&&a.disposed_date)?new Date(a.disposed_date):new Date();
    let m=(asOf.getFullYear()-start.getFullYear())*12+(asOf.getMonth()-start.getMonth());
    if(asOf.getDate()<start.getDate())m--;
    m=Math.max(0,Math.min(life,m));
    return cost-Math.min(depreciable,monthly*m);
  }
  function accountBalance(accId){
    const acc=ACCOUNTS.find(a=>a.id===accId);if(!acc)return 0;
    let bal=num(acc.initial_balance);
    MOVEMENTS.filter(m=>m.account_id===accId).sort((x,y)=>new Date(x.movement_date)-new Date(y.movement_date)||new Date(x.created_at||0)-new Date(y.created_at||0)).forEach(m=>{
      if(m.movement_type==='inflow'||m.movement_type==='transfer_in')bal+=num(m.amount);
      else if(m.movement_type==='outflow'||m.movement_type==='transfer_out')bal-=num(m.amount);
      else if(m.movement_type==='adjustment')bal=num(m.amount);
    });
    return bal;
  }

        api('yanz_cash_accounts?is_active=eq.true'),
        api('yanz_cash_movements?select=account_id,movement_type,amount,movement_date&order=movement_date.asc'),
        api('yanz_purchase_batches?select=qty_remaining,qty_purchased,landed_cost_per_unit,payment_status')
      ]);
      EQUITY=eq;ACCOUNTS=acc;MOVEMENTS=mv;BATCHES=b;
      [B2B,ASSETS]=await Promise.all([
        api('yanz_sales_orders?channel=eq.b2b&select=grand_total,amount_paid,workflow_status').catch(()=>[]),
        api('yanz_fixed_assets?select=acquisition_cost,salvage_value,useful_life_months,acquisition_date,status,disposed_date').catch(()=>[])
      ]);
      setDB(true,'Terhubung ✓');
      renderEquity();
      const bp=$('bs-panel-balance');if(bp&&bp.classList.contains('active'))renderBalance();
    }catch(e){setDB(false,'❌ '+e.message);console.error(e);}
  }

  // ── TAB MODAL & PRIVE ──
  function renderEquity(){
    const inj=EQUITY.filter(e=>e.type==='capital_injection').reduce((s,e)=>s+num(e.amount),0);
    const draw=EQUITY.filter(e=>e.type==='owner_draw').reduce((s,e)=>s+num(e.amount),0);
    setText('bs-k-inj',rpShort(inj));
    setText('bs-k-draw',rpShort(draw));
    setText('bs-k-net',rpShort(inj-draw));
    const tb=$('bs-equity-tbody');if(!tb)return;
    if(!EQUITY.length){tb.innerHTML='<tr><td colspan="5" class="empty">Belum ada catatan modal. Klik "+ Catat Modal/Prive".</td></tr>';return;}
    tb.innerHTML=EQUITY.map(e=>{
      const acc=ACCOUNTS.find(a=>a.id===e.account_id);
      const isInj=e.type==='capital_injection';
      return `<tr>
        <td>${fd(e.entry_date)}</td>
        <td><span class="pill ${isInj?'pill-in':'pill-out'}">${isInj?'Setoran Modal':'Prive'}</span></td>
        <td>${acc?acc.account_name:'<span style="color:#bbb">–</span>'}${e.description?`<div style="font-size:10px;color:#999">${e.description}</div>`:''}</td>
        <td class="num" style="color:${isInj?'#16A34A':'#DC2626'}">${isInj?'+':'−'}${rp(num(e.amount))}</td>
        <td class="num"><button class="btn btn-d btn-sm" onclick="bs.delEntry('${e.id}')">Hapus</button></td>
      </tr>`;
    }).join('');
  }

  function openModal(){
    if(!ACCOUNTS.length){toast('⚠️ Buat akun kas dulu di modul Cash Accounts');return;}
    $('bs-m-type').value='capital_injection';
    $('bs-m-date').value=new Date().toISOString().split('T')[0];
    $('bs-m-amount').value='';
    $('bs-m-desc').value='';
    const sel=$('bs-m-account');
    if(sel)sel.innerHTML=ACCOUNTS.map(a=>`<option value="${a.id}">${a.account_name}</option>`).join('');
    onTypeChange();
    const m=$('bs-modal');if(m)m.style.display='flex';
  }
  function closeModal(){const m=$('bs-modal');if(m)m.style.display='none';}
  function onTypeChange(){
    const t=$('bs-m-type')?.value;
    const h=$('bs-m-type-hint');
    if(h)h.textContent=t==='capital_injection'?'Uang owner MASUK ke bisnis → kas bertambah, modal naik.':'Owner TARIK uang dari bisnis → kas berkurang, modal turun.';
  }

  async function saveEntry(){
    const type=$('bs-m-type').value;
    const date=$('bs-m-date').value;
    const amount=num($('bs-m-amount').value);
    const accId=$('bs-m-account').value;
    const desc=$('bs-m-desc').value.trim();
    if(amount<=0){toast('⚠️ Jumlah harus > 0');return;}
    if(!accId){toast('⚠️ Pilih akun kas');return;}
    try{
      const er=await api('yanz_equity_entries',{method:'POST',headers:{'Prefer':'return=representation'},body:JSON.stringify({
        entry_date:date,type,amount,account_id:accId,description:desc||null
      })});
      const eid=er[0]?.id;
      const isInj=type==='capital_injection';
      const mr=await api('yanz_cash_movements',{method:'POST',headers:{'Prefer':'return=representation'},body:JSON.stringify({
        account_id:accId,movement_date:date,
        movement_type:isInj?'inflow':'outflow',
        category:isInj?'capital':'owner_draw',
        amount,description:desc||(isInj?'Setoran modal owner':'Prive / penarikan owner'),
        source_type:'equity',source_id:eid
      })});
      if(eid&&mr[0]?.id)await api('yanz_equity_entries?id=eq.'+eid,{method:'PATCH',body:JSON.stringify({cash_movement_id:mr[0].id})});
      closeModal();await loadAll();toast('Tersimpan ✓ — saldo kas ikut diperbarui');
    }catch(e){toast('❌ '+e.message);console.error(e);}
  }

  async function delEntry(id){
    const e=EQUITY.find(x=>x.id===id);if(!e)return;
    if(!confirm('Hapus catatan ini? Pergerakan kas terkait juga dihapus.'))return;
    try{
      if(e.cash_movement_id){try{await api('yanz_cash_movements?id=eq.'+e.cash_movement_id,{method:'DELETE'});}catch(err){}}
      await api('yanz_equity_entries?id=eq.'+id,{method:'DELETE'});
      await loadAll();toast('Dihapus ✓');
    }catch(e){toast('❌ '+e.message);}
  }

  // ── TAB NERACA ──
  function renderBalance(){
    const cash=ACCOUNTS.reduce((s,a)=>s+accountBalance(a.id),0);
    const ar=B2B.filter(o=>o.workflow_status!=='cancelled').reduce((s,o)=>s+Math.max(0,num(o.grand_total)-num(o.amount_paid)),0);
    const inventory=BATCHES.reduce((s,b)=>s+num(b.qty_remaining)*num(b.landed_cost_per_unit),0);
    const fixedNbv=ASSETS.filter(a=>a.status!=='disposed').reduce((s,a)=>s+nbvOf(a),0);
    const ap=BATCHES.filter(b=>b.payment_status==='unpaid').reduce((s,b)=>s+num(b.qty_purchased)*num(b.landed_cost_per_unit),0);

    const totalAssets=cash+ar+inventory+fixedNbv;
    const totalLiab=ap;
    const equity=totalAssets-totalLiab;
    const inj=EQUITY.filter(e=>e.type==='capital_injection').reduce((s,e)=>s+num(e.amount),0);
    const draw=EQUITY.filter(e=>e.type==='owner_draw').reduce((s,e)=>s+num(e.amount),0);
    const ownerCapital=inj-draw;
    const retained=equity-ownerCapital;
    const balanced=Math.abs(totalAssets-(totalLiab+equity))<1;

    setText('bs-asof','Per '+fd(new Date().toISOString().split('T')[0]));
    const row=(l,v,cls='')=>`<div class="bs-row ${cls}"><span>${l}</span><span class="bs-amt">${rp(Math.round(v))}</span></div>`;
    setHTML('bs-statement',`
      <div class="bs-cols">
        <div>
          <div class="bs-sec-title">Aset</div>
          ${row('Kas & Setara Kas',cash,'sub')}
          ${row('Piutang Usaha (B2B)',ar,'sub')}
          ${row('Persediaan (stok)',inventory,'sub')}
          ${row('Aset Tetap (nilai buku)',fixedNbv,'sub')}
          ${row('TOTAL ASET',totalAssets,'total')}
        </div>
        <div>
          <div class="bs-sec-title">Kewajiban & Ekuitas</div>
          ${row('Hutang Usaha',ap,'sub')}
          ${row('Total Kewajiban',totalLiab,'')}
          <div style="height:8px"></div>
          ${row('Modal Owner (setoran − prive)',ownerCapital,'sub')}
          ${row('Laba Ditahan',retained,'sub')}
          ${row('Total Ekuitas',equity,'')}
          ${row('TOTAL KEWAJIBAN + EKUITAS',totalLiab+equity,'total')}
        </div>
      </div>
      <div class="bs-check ${balanced?'ok':'bad'}">${balanced?'✓ Neraca seimbang (Aset = Kewajiban + Ekuitas)':'⚠️ Tidak seimbang — cek data'}</div>
      <div style="margin-top:12px;padding:11px 13px;background:#EFF6FF;border:1px solid #BFDBFE;border-radius:8px;font-size:11px;color:#1E40AF;line-height:1.5">
        💡 <strong>Laba Ditahan</strong> = Total Ekuitas − Modal Owner = akumulasi laba bersih yang ditahan di bisnis sejak awal. <strong>Modal Owner</strong> = total uang yang kamu setor dikurangi prive. Angka ini snapshot <strong>hari ini</strong>.
      </div>`);
  }

  const TEMPLATE=`<div class="module-position">
    <div class="bs-subtabs">
      <div class="tab active" data-tab="equity" onclick="bs.go('equity')">💰 Modal & Prive</div>
      <div class="tab" data-tab="balance" onclick="bs.go('balance')">📋 Neraca</div>
    </div>

    <div class="panel active" id="bs-panel-equity">
      <div class="dbs">
        <div class="db-status"><span class="dbd" id="bs-dbd"></span><span id="bs-dbt">Menghubungkan…</span></div>
        <button class="btn btn-p btn-sm" onclick="bs.openModal()">+ Catat Modal / Prive</button>
      </div>
      <div class="eq-grid">
        <div class="eq-card in"><div class="l">Total Setoran Modal</div><div class="v" id="bs-k-inj">–</div></div>
        <div class="eq-card out"><div class="l">Total Prive (penarikan)</div><div class="v" id="bs-k-draw">–</div></div>
        <div class="eq-card net"><div class="l">Modal Owner Bersih</div><div class="v" id="bs-k-net">–</div></div>
      </div>
      <div class="card">
        <div class="chd"><span class="dot"></span>Riwayat Modal & Prive</div>
        <div class="tbl-wrap"><table class="tbl">
          <thead><tr><th>Tanggal</th><th>Jenis</th><th>Akun / Catatan</th><th class="num">Jumlah</th><th class="num">Aksi</th></tr></thead>
          <tbody id="bs-equity-tbody"><tr><td colspan="5" class="empty">Memuat…</td></tr></tbody>
        </table></div>
      </div>
    </div>

    <div class="panel" id="bs-panel-balance">
      <div class="card">
        <div class="chd"><span class="dot"></span>Neraca (Balance Sheet) <span id="bs-asof" style="margin-left:auto;font-weight:600;color:#888;font-size:12px"></span></div>
        <div id="bs-statement"><div class="empty">Memuat…</div></div>
      </div>
    </div>

    <!-- MODAL -->
    <div class="modal-bg" id="bs-modal" onclick="if(event.target===this)bs.closeModal()" style="position:fixed;inset:0;background:rgba(28,28,26,.55);z-index:200;display:none;align-items:center;justify-content:center;padding:20px">
      <div style="background:#fff;border-radius:16px;padding:22px;width:440px;max-width:100%">
        <div style="display:flex;align-items:center;justify-content:space-between;font-size:15px;font-weight:800;margin-bottom:14px"><span>Catat Modal / Prive</span><button style="background:none;border:none;font-size:22px;cursor:pointer;color:#888" onclick="bs.closeModal()">×</button></div>
        <div class="fld"><label>Jenis</label><select id="bs-m-type" onchange="bs.onTypeChange()">
          <option value="capital_injection">💰 Setoran Modal (uang masuk)</option>
          <option value="owner_draw">📤 Prive / Penarikan (uang keluar)</option>
        </select><div class="hint" id="bs-m-type-hint"></div></div>
        <div class="fg2">
          <div class="fld"><label>Tanggal</label><input type="date" id="bs-m-date"></div>
          <div class="fld"><label>Jumlah (Rp)</label><input type="number" id="bs-m-amount" min="0" placeholder="0"></div>
        </div>
        <div class="fld"><label>Akun Kas Terpengaruh</label><select id="bs-m-account"></select><div class="hint">Saldo akun ini otomatis naik/turun.</div></div>
        <div class="fld"><label>Catatan (opsional)</label><input id="bs-m-desc" placeholder="cth: tambah modal beli stok"></div>
        <button class="btn btn-p" style="width:100%;justify-content:center;margin-top:6px" onclick="bs.saveEntry()">💾 Simpan</button>
      </div>
    </div>
  </div>`;

  function destroy(){delete window.bs;}

  window.YANZ.modules.position={
    template:TEMPLATE,
    init(){
      window.bs={go,openModal,closeModal,onTypeChange,saveEntry,delEntry};
      loadAll();
    },
    destroy
  };
})();

</script>
</body>
</html>
