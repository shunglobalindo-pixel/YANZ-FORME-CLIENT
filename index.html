  function onLogoPick(e){
    const file=e.target.files&&e.target.files[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=ev=>{
      const img=new Image();
      img.onload=()=>{
        const max=260;let w=img.width,h=img.height;
        if(w>h&&w>max){h=Math.round(h*max/w);w=max;}else if(h>=w&&h>max){w=Math.round(w*max/h);h=max;}
        const c=document.createElement('canvas');c.width=w;c.height=h;
        c.getContext('2d').drawImage(img,0,0,w,h);
        _logoData=c.toDataURL('image/png');
        const prev=document.getElementById('bi-logo-preview');
        if(prev){prev.src=_logoData;prev.style.display='';}
        toast('Logo dimuat — klik "Simpan Info Bisnis"');
      };
      img.src=ev.target.result;
    };
    reader.readAsDataURL(file);
  }

    const prev=document.getElementById('bi-logo-preview');if(prev){prev.src='';prev.style.display='none';}

(function(){

  function getHostName(id){return HOSTS.find(h=>h.id===id)?.name||'–';}
  function getHostColor(id){const idx=HOSTS.findIndex(h=>h.id===id);return COLORS[idx%COLORS.length];}

  // Platform auto-detect
  function detectPlatformFromOrderId(orderId){
    if(!orderId)return null;
    const cleaned=orderId.trim();
    if(/^\d{18}$/.test(cleaned))return 'tiktok';
    if(/^\d{6}[A-Z0-9]{8}$/i.test(cleaned))return 'shopee';
    return null;
  }
  function validateOrderId(orderId,platform){
    if(!orderId||!orderId.trim())return {valid:false,reason:'Order ID kosong'};
    const detected=detectPlatformFromOrderId(orderId);
    if(!detected)return {valid:false,reason:'Format Order ID tidak dikenali (bukan TikTok 18-digit atau Shopee 14-char)'};
    if(platform&&detected!==platform)return {valid:false,reason:`Format match ${detected.toUpperCase()} tapi platform yang dipilih ${platform.toUpperCase()}`,warning:true};
    return {valid:true,platform:detected};
  }

  // FIFO
  function stockOf(pid){return BATCHES.filter(b=>b.product_id===pid).reduce((s,b)=>s+b.qty_remaining,0);}
  function fifoDeduct(pid,qty){
    const sorted=BATCHES.filter(b=>b.product_id===pid&&b.qty_remaining>0).sort((a,b)=>new Date(a.po_date)-new Date(b.po_date));
    let rem=qty,used=[],tot=0;
    for(const b of sorted){if(rem<=0)break;const take=Math.min(rem,b.qty_remaining);used.push({b,take,cost:take*b.landed_cost_per_unit});tot+=take*b.landed_cost_per_unit;rem-=take;}
    return{used,tot,short:rem};
  }
  function resolveBundle(productId,qty){
    const prod=PRODUCTS.find(p=>p.id===productId);
    if(!prod)return[];
    if(!prod.is_bundle)return[{component_id:productId,qty}];
    const comps=BUNDLES.filter(b=>b.bundle_id===productId);
    return comps.map(c=>({component_id:c.component_id,qty:qty*c.qty_per_bundle}));
  }
  function bundleAvailableStock(bundleId){
    const comps=BUNDLES.filter(b=>b.bundle_id===bundleId);
    if(!comps.length)return 0;
    return Math.min(...comps.map(c=>Math.floor(stockOf(c.component_id)/c.qty_per_bundle)));
  }
  function getAvailable(productId){
    const prod=PRODUCTS.find(p=>p.id===productId);
    if(prod?.is_bundle)return bundleAvailableStock(productId);
    return stockOf(productId);
  }
  function getBOMForProduct(pid){return BOMS.filter(b=>b.product_id===pid);}
  function getTiersForBOM(bomId){return BOM_TIERS.filter(t=>t.bom_id===bomId).sort((a,b)=>a.qty_min-b.qty_min);}
  function calcBOMUsage(bomId,qty){
    const tiers=getTiersForBOM(bomId);
    if(!tiers.length)return 0;
    let matchTier=tiers[0];
    for(const t of tiers){if(qty>=t.qty_min&&(t.qty_max===null||qty<=t.qty_max)){matchTier=t;break;}if(qty>=t.qty_min)matchTier=t;}
    const extra=qty-matchTier.qty_min;
    return matchTier.qty_usage+(extra>0?(extra*matchTier.usage_extra):0);
  }
  // ── Polymailer otomatis per paket (grup Order ID) — lihat komentar detail di modul Inventory ──
  let SHIP_MAILERS=[];
  function packUnitsOf(pid){const p=PRODUCTS.find(x=>x.id===pid);const v=p?num(p.pack_units):0;return v>0?v:1;}
  function shipLoad(items){return items.reduce((s,it)=>s+num(it.qty)*packUnitsOf(it.prodId),0);}
  function pickMailers(load){
    const ms=SHIP_MAILERS.filter(m=>m.pkgId&&num(m.cap)>0).slice().sort((a,b)=>num(a.cap)-num(b.cap));
    if(!ms.length||load<=0)return [];
    const fit=ms.find(m=>load<=num(m.cap));
    if(fit)return [{pkgId:fit.pkgId,qty:1}];
    const big=ms[ms.length-1];
    return [{pkgId:big.pkgId,qty:Math.ceil(load/num(big.cap))}];
  }
  // Kelompokkan item Live per Order ID (paket) → mailer per paket. Return Map<orderRef, [{pkgId,qty}]>.
  function liveShipGroups(items){
    const g=new Map();
    for(const it of items){const k=it.orderRef||'';if(!g.has(k))g.set(k,[]);g.get(k).push({prodId:it.prodId,qty:it.qty});}
    const out=new Map();for(const [k,its] of g)out.set(k,pickMailers(shipLoad(its)));return out;
  }

          api('yanz_bundle_components'),api('yanz_bom?order=created_at'),api('yanz_bom_tiers?order=qty_min')
        ]);
      }catch(e){BUNDLES=[];BOMS=[];BOM_TIERS=[];}
      try{const sr=await api('yanz_finance_settings?setting_key=eq.polymailer_rules');const a=sr&&sr[0]?JSON.parse(sr[0].setting_value||'[]'):[];SHIP_MAILERS=Array.isArray(a)?a:[];}catch(e){SHIP_MAILERS=[];}
      resolveMeHost();
      setDB(true,'Terhubung ✓ — '+SESSIONS.length+' sesi · '+HOSTS.length+' host · '+PRODUCTS.filter(p=>p.category==='product').length+' produk');
      fillSelects();
      renderAll();
    }catch(e){setDB(false,'❌ '+e.message);console.error(e);}
  }

  // Staff identity: auto-match login name to host name; dropdown is override/fallback
  function resolveMeHost(){
    if(window.YANZ.role!=='staff')return;
    if(meHostId&&HOSTS.some(h=>h.id===meHostId))return; // sudah ter-match, jangan hitung ulang tiap refresh
    const myName=(window.YANZ.fullName||'').trim().toLowerCase();
    if(!myName)return;
    const match=HOSTS.find(h=>(h.name||'').trim().toLowerCase()===myName);
    if(match)meHostId=match.id;
  }

  function fillSelects(){
    const opts=HOSTS.map(h=>`<option value="${h.id}">${h.name}</option>`).join('');
    ['in-host','ses-host'].forEach(id=>{
      const e=document.getElementById(id);if(!e)return;
      const prefix=id==='ses-host'?'<option value="">Semua host</option>':'<option value="">— Pilih host —</option>';
      e.innerHTML=prefix+opts;
    });
  }

  function renderAll(){renderHostPerf();renderOverview();renderAnalytics();renderSessions();}

  function setPeriod(n){
    period=n;
    [7,14,30,90].forEach(d=>{const el=document.getElementById('prd-'+d);if(el)el.classList.toggle('active',d===n);});
    renderHostPerf();renderOverview();renderAnalytics();
  }

  function sessionsInPeriod(){
    let rightEdge=new Date();rightEdge.setHours(23,59,59,999);
    SESSIONS.forEach(s=>{const sd=new Date(s.session_date);if(sd>rightEdge)rightEdge=sd;});
    const cut=new Date(rightEdge);cut.setDate(cut.getDate()-period);cut.setHours(0,0,0,0);
    return SESSIONS.filter(s=>{const sd=new Date(s.session_date);return sd>=cut&&sd<=rightEdge;});
  }
  function orderItemsInPeriod(){
    let rightEdge=new Date();rightEdge.setHours(23,59,59,999);
    SESSIONS.forEach(s=>{const sd=new Date(s.session_date);if(sd>rightEdge)rightEdge=sd;});
    const cut=new Date(rightEdge);cut.setDate(cut.getDate()-period);cut.setHours(0,0,0,0);
    return ORDER_ITEMS.filter(o=>{const od=new Date(o.created_at);return od>=cut&&od<=rightEdge;});
  }

  function drawHostChart(){
    const svg=document.getElementById('chart-host');if(!svg)return;
    const role=window.YANZ.role;
    const metric=document.getElementById('host-metric')?.value||'gmv';
    const ses=sessionsInPeriod();
    const items=orderItemsInPeriod();
    let rightEdge=new Date();
    ses.forEach(s=>{const sd=new Date(s.session_date);if(sd>rightEdge)rightEdge=sd;});
    const dateSet=new Set();
    for(let i=0;i<period;i++){const d=new Date(rightEdge);d.setDate(d.getDate()-i);dateSet.add(d.toISOString().split('T')[0]);}
    const dates=[...dateSet].sort();
    const data={};
    HOSTS.forEach(h=>{data[h.id]={};dates.forEach(d=>data[h.id][d]={sum:0,n:0});});
    if(metric==='commissionable_revenue'){
      items.forEach(o=>{
        if(!o.host_id||!data[o.host_id])return;
        const d=o.created_at.split('T')[0];
        if(!data[o.host_id][d])return;
        data[o.host_id][d].sum+=num(o.qty)*num(o.sell_price);data[o.host_id][d].n++;
      });
    }else{
      ses.forEach(s=>{
        if(!s.host_id||!data[s.host_id]||!data[s.host_id][s.session_date])return;
        let v;
        if(metric==='conversion_rate')v=s.unique_viewers>0?(int(s.orders_count)/int(s.unique_viewers)):0;
        else v=num(s[metric])||0;
        data[s.host_id][s.session_date].sum+=v;data[s.host_id][s.session_date].n++;
      });
    }
    const series=HOSTS.filter(h=>Object.values(data[h.id]).some(c=>c.n>0)).map(h=>({
      host:h,values:dates.map(d=>{const c=data[h.id][d];if(c.n===0)return null;return metric==='conversion_rate'?c.sum/c.n:c.sum;})
    }));
    const W=800,Hh=300,pad={l:60,r:20,t:20,b:40};
    const allVals=series.flatMap(s=>s.values.filter(v=>v!==null));
    const maxV=Math.max(0.0001,...allVals);
    const xStep=(W-pad.l-pad.r)/Math.max(1,dates.length-1);
    const yTo=v=>Hh-pad.b-(v/maxV)*(Hh-pad.t-pad.b);
    const xTo=i=>pad.l+i*xStep;
    const fmt=v=>metric==='conversion_rate'?(v*100).toFixed(1)+'%':(metric==='gmv'||metric==='commissionable_revenue')?rpShort(v):Math.round(v).toLocaleString('id-ID');
    let html='';
    for(let i=0;i<=4;i++){
      const v=maxV*i/4;const y=yTo(v);
      html+=`<line x1="${pad.l}" y1="${y}" x2="${W-pad.r}" y2="${y}" stroke="#F0EDE8" stroke-width="1"/>`;
      html+=`<text x="${pad.l-8}" y="${y+3}" font-size="9" fill="#aaa" text-anchor="end">${fmt(v)}</text>`;
    }
    series.forEach(s=>{
      const color=getHostColor(s.host.id);
      const isMe=role==='staff'&&s.host.id===meHostId;
      let path='';let started=false;
      s.values.forEach((v,i)=>{if(v===null){started=false;return;}path+=`${started?'L':'M'} ${xTo(i)} ${yTo(v)} `;started=true;});
      html+=`<path d="${path}" fill="none" stroke="${color}" stroke-width="${isMe?'3':'2'}" stroke-linejoin="round" opacity="${role==='staff'&&meHostId&&!isMe?'0.35':'0.9'}"/>`;
      s.values.forEach((v,i)=>{if(v===null)return;html+=`<circle cx="${xTo(i)}" cy="${yTo(v)}" r="${isMe?'3.5':'2.5'}" fill="${color}" stroke="#fff" stroke-width="1"><title>${s.host.name} · ${fdShort(dates[i])}: ${fmt(v)}</title></circle>`;});
    });
    const labelStep=Math.max(1,Math.ceil(dates.length/8));
    dates.forEach((d,i)=>{if(i%labelStep===0||i===dates.length-1)html+=`<text x="${xTo(i)}" y="${Hh-pad.b+18}" font-size="10" fill="#999" text-anchor="middle">${fdShort(d)}</text>`;});
    svg.innerHTML=html;
    const legend=document.getElementById('host-legend');
    if(legend)legend.innerHTML=series.map(s=>{
      const isMe=role==='staff'&&s.host.id===meHostId;
      return`<div class="lg-item" style="${isMe?'font-weight:700':''}"><div class="lg-dot" style="background:${getHostColor(s.host.id)}"></div>${s.host.name}${isMe?' (Anda)':''}</div>`;
    }).join('');
  }

  function renderOverview(){
    const ses=sessionsInPeriod();
    const totGMV=ses.reduce((s,x)=>s+num(x.gmv),0);
    const totViews=ses.reduce((s,x)=>s+int(x.views),0);
    const totSes=ses.length;
    const avgGMV=totSes>0?totGMV/totSes:0;
    const set=(id,val)=>{const e=document.getElementById(id);if(e)e.textContent=val;};
    set('kpi-gmv',rpShort(totGMV));set('kpi-gmv-sub',`Periode ${period} hari`);
    set('kpi-sessions',totSes);set('kpi-sessions-sub',totSes>0?(totSes/period).toFixed(1)+' sesi/hari':'–');
    set('kpi-views',totViews.toLocaleString('id-ID'));set('kpi-views-sub',totSes>0?Math.round(totViews/totSes).toLocaleString('id-ID')+'/sesi':'–');
    set('kpi-avg',rpShort(avgGMV));set('kpi-avg-sub','Rata-rata per sesi');
    drawTrendChart();
  }

  function drawTrendChart(){
    const svg=document.getElementById('chart-trend');if(!svg)return;
    const ses=sessionsInPeriod();
    let rightEdge=new Date();
    ses.forEach(s=>{const sd=new Date(s.session_date);if(sd>rightEdge)rightEdge=sd;});
    const byDate={};
    for(let i=0;i<period;i++){const d=new Date(rightEdge);d.setDate(d.getDate()-i);const key=d.toISOString().split('T')[0];byDate[key]={date:key,gmv:0};}
    ses.forEach(s=>{if(byDate[s.session_date])byDate[s.session_date].gmv+=num(s.gmv);});
    const data=Object.values(byDate).sort((a,b)=>a.date.localeCompare(b.date));
    const W=800,Hh=280,pad={l:60,r:20,t:20,b:40};
    const maxGMV=Math.max(1,...data.map(d=>d.gmv));
    const xStep=(W-pad.l-pad.r)/Math.max(1,data.length-1);
    const yTo=v=>Hh-pad.b-(v/maxGMV)*(Hh-pad.t-pad.b);
    const xTo=i=>pad.l+i*xStep;
    let html='';
    for(let i=0;i<=4;i++){const v=maxGMV*i/4;const y=yTo(v);html+=`<line x1="${pad.l}" y1="${y}" x2="${W-pad.r}" y2="${y}" stroke="#F0EDE8" stroke-width="1"/><text x="${pad.l-8}" y="${y+3}" font-size="9" fill="#aaa" text-anchor="end">${rpShort(v)}</text>`;}
    if(data.length>1){
      const path=data.map((d,i)=>`${i===0?'M':'L'} ${xTo(i)} ${yTo(d.gmv)}`).join(' ');
      const areaPath=path+` L ${xTo(data.length-1)} ${Hh-pad.b} L ${pad.l} ${Hh-pad.b} Z`;
      html+=`<defs><linearGradient id="live-grad1" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#EC4899" stop-opacity="0.3"/><stop offset="100%" stop-color="#EC4899" stop-opacity="0"/></linearGradient></defs>`;
      html+=`<path d="${areaPath}" fill="url(#live-grad1)" stroke="none"/><path d="${path}" fill="none" stroke="#EC4899" stroke-width="2.5"/>`;
      data.forEach((d,i)=>{html+=`<circle cx="${xTo(i)}" cy="${yTo(d.gmv)}" r="3" fill="#EC4899" stroke="#fff" stroke-width="1.5"><title>${fdShort(d.date)}: ${rpShort(d.gmv)}</title></circle>`;});
    }
    const labelStep=Math.max(1,Math.ceil(data.length/8));
    data.forEach((d,i)=>{if(i%labelStep===0||i===data.length-1)html+=`<text x="${xTo(i)}" y="${Hh-pad.b+18}" font-size="10" fill="#999" text-anchor="middle">${fdShort(d.date)}</text>`;});
    svg.innerHTML=html;
  }

  function renderAnalytics(){
    const ses=sessionsInPeriod();
    const grid={};
    for(let dow=0;dow<7;dow++){grid[dow]={};for(let h=0;h<24;h++)grid[dow][h]={sum:0,n:0};}
    ses.forEach(s=>{
      if(!s.session_date||!s.start_time)return;
      const dt=new Date(s.session_date);const dow=dt.getDay();const hour=parseInt(s.start_time.split(':')[0]);
      if(isNaN(hour))return;
      grid[dow][hour].sum+=num(s.gmv);grid[dow][hour].n++;
    });
    let maxAvg=0;
    for(let dow=0;dow<7;dow++)for(let h=0;h<24;h++){const c=grid[dow][h];if(c.n>0){const avg=c.sum/c.n;if(avg>maxAvg)maxAvg=avg;}}
    const dows=['Min','Sen','Sel','Rab','Kam','Jum','Sab'];
    let html='<div style="display:grid;grid-template-columns:40px repeat(24,1fr);gap:2px"><div></div>';
    for(let h=0;h<24;h++)html+=`<div class="hm-label">${h}</div>`;
    for(let dow=0;dow<7;dow++){
      html+=`<div class="hm-label" style="display:flex;align-items:center;padding-right:6px">${dows[dow]}</div>`;
      for(let h=0;h<24;h++){
        const c=grid[dow][h];const intensity=c.n>0&&maxAvg>0?(c.sum/c.n)/maxAvg:0;
        const bg=intensity>0?`rgba(236,72,153,${0.15+intensity*0.85})`:'#F5F3EE';
        const textColor=intensity>0.5?'#fff':'#888';
        html+=`<div class="hm-cell" style="background:${bg};color:${textColor}" title="${dows[dow]} ${h}:00 — ${c.n} sesi · avg ${rpShort(c.sum/Math.max(1,c.n))}">${c.n>0?c.n:''}</div>`;
      }
    }
    html+='</div>';
    const hmEl=document.getElementById('heatmap-wrap');if(hmEl)hmEl.innerHTML=html;
    const combo={};
    ses.forEach(s=>{
      if(!s.host_id||!s.start_time)return;
      const hour=parseInt(s.start_time.split(':')[0]);if(isNaN(hour))return;
      const key=s.host_id+'_'+hour;
      if(!combo[key])combo[key]={host_id:s.host_id,hour,gmv:0,n:0};
      combo[key].gmv+=num(s.gmv);combo[key].n++;
    });
    const top=Object.values(combo).filter(c=>c.n>=1).map(c=>({...c,avg:c.gmv/c.n})).sort((a,b)=>b.avg-a.avg).slice(0,5);
    const comboEl=document.getElementById('combo-list');
    if(comboEl)comboEl.innerHTML=top.length?top.map((c,i)=>{
      const host=HOSTS.find(h=>h.id===c.host_id);
      return`<div style="display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #F5F3EE"><div style="width:28px;height:28px;border-radius:50%;background:${i===0?'#16A34A':'#1C1C1A'};color:${i===0?'#fff':'#E8FF5A'};font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center">#${i+1}</div><div style="flex:1"><strong>${host?.name||'–'}</strong> di jam <strong>${c.hour}:00</strong> — ${c.n} sesi</div><div style="font-weight:800">${rpShort(c.avg)}<span style="font-size:11px;font-weight:500;color:#888"> /sesi</span></div></div>`;
    }).join(''):'<div class="empty">Data belum cukup.</div>';
  }

  // Input form
  function calcDuration(){
    const st=document.getElementById('in-start')?.value;
    const ed=document.getElementById('in-end')?.value;
    const durEl=document.getElementById('in-duration');if(!durEl)return;
    if(!st||!ed){durEl.textContent='–';return;}
    const [sh,sm]=st.split(':').map(Number);const [eh,em]=ed.split(':').map(Number);
    let mins=(eh*60+em)-(sh*60+sm);if(mins<0)mins+=24*60;
    durEl.textContent=mins+' menit';
  }

  async function submitSession(){
    const st=document.getElementById('in-status');
    const setMsg=(msg,color='#999')=>{if(st){st.textContent=msg;st.style.color=color;}};
    const g=(id)=>document.getElementById(id)?.value;
    const hostId=g('in-host');
    const platform=g('in-platform');
    const date=g('in-date');
    const start=g('in-start')||null;
    const end=g('in-end')||null;
    const gmv=num(g('in-gmv'));
    const orders=int(g('in-orders'));
    const followers=int(g('in-followers'));
    const imp=int(g('in-imp'));
    const views=int(g('in-views'));
    const uniq=int(g('in-unique'));
    const peak=int(g('in-peak'));
    const notes=g('in-notes');
    if(!hostId||!date){setMsg('⚠️ Pilih host dan tanggal','#D97706');return;}
    const validItems=orderItems.filter(i=>i.prodId&&i.qty>0);
    const invalidIds=[];
    for(let i=0;i<validItems.length;i++){
      const item=validItems[i];
      if(!item.orderRef||!item.orderRef.trim()){invalidIds.push(`Item #${i+1}: Order ID wajib diisi (untuk matching NSA dari marketplace)`);continue;}
      const val=validateOrderId(item.orderRef,platform);
      if(!val.valid&&!val.warning)invalidIds.push(`Item #${i+1}: ${val.reason}`);
    }
    if(invalidIds.length){setMsg('❌ Order ID error: '+invalidIds[0],'#DC2626');return;}
    for(const item of validItems){
      const avail=getAvailable(item.prodId);
      const prod=PRODUCTS.find(p=>p.id===item.prodId);
      if(item.qty>avail){setMsg(`❌ Stok ${prod?.name} tidak cukup (tersedia: ${avail})`,'#DC2626');return;}
      const bomItems=getBOMForProduct(item.prodId).filter(b=>b.channel==='ecommerce'||b.channel==='both');
      for(const bom of bomItems){
        const needed=calcBOMUsage(bom.id,item.qty);
        const pkgStk=stockOf(bom.packaging_id);
        if(pkgStk<needed){const pkg=PRODUCTS.find(p=>p.id===bom.packaging_id);setMsg(`❌ Packaging ${pkg?.name} kurang (butuh ${needed.toFixed(2)}, ada ${pkgStk.toFixed(2)})`,'#DC2626');return;}
      }
    }
    let dur=null;
    if(start&&end){const [sh,sm]=start.split(':').map(Number);const [eh,em]=end.split(':').map(Number);dur=(eh*60+em)-(sh*60+sm);if(dur<0)dur+=24*60;}
    const cr=uniq>0?(orders/uniq):null;
    const ctr=imp>0?(views/imp):null;
    setMsg('Menyimpan sesi & memproses stok…');
    try{
      const sr=await api('yanz_livestream_sessions',{method:'POST',headers:{'Prefer':'return=representation'},body:JSON.stringify({
        host_id:hostId,platform,session_date:date,start_time:start,end_time:end,duration_minutes:dur,
        gmv,impressions:imp,views,unique_viewers:uniq,peak_viewers:peak,orders_count:orders,followers_gained:followers,
        conversion_rate:cr,ctr,notes:notes||null
      })});
      const sessionId=sr[0].id;
      SESSIONS.unshift(sr[0]);
      if(validItems.length>0){
        const totRev=validItems.reduce((s,i)=>s+num(i.qty)*num(i.sellPrice),0);
        const orderR=await api('yanz_sales_orders',{method:'POST',headers:{'Prefer':'return=representation'},body:JSON.stringify({
          channel:'ecommerce',order_date:date,reference:'LIVE-'+sessionId.slice(0,8),
          customer_name:'Live Stream — '+getHostName(hostId),total_revenue:totRev
        })});
        const orderId=orderR[0].id;
        const shipGroups=liveShipGroups(validItems);const shipDone=new Set(); // polymailer per Order ID (paket)
        for(const item of validItems){
          const revenue=num(item.qty)*num(item.sellPrice);
          const commission=revenue*COMMISSION_RATE;
          const components=resolveBundle(item.prodId,item.qty);
          let totalProdCOGS=0;
          for(const comp of components){
            const {used,tot:cogs}=fifoDeduct(comp.component_id,comp.qty);
            totalProdCOGS+=cogs;
            for(const u of used){
              const newR=u.b.qty_remaining-u.take;
              await api('yanz_purchase_batches?id=eq.'+u.b.id,{method:'PATCH',body:JSON.stringify({qty_remaining:newR})});
              const idx=BATCHES.findIndex(b=>b.id===u.b.id);if(idx>=0)BATCHES[idx].qty_remaining=newR;
            }
            await api('yanz_stock_movements',{method:'POST',body:JSON.stringify({
              product_id:comp.component_id,movement_type:'sale',qty:comp.qty,
              cogs_per_unit:comp.qty>0?cogs/comp.qty:0,total_cogs:cogs,
              reference:item.orderRef||'LIVE-'+sessionId.slice(0,8),movement_date:date
            })});
          }
          const bomItems=getBOMForProduct(item.prodId).filter(b=>b.channel==='ecommerce'||b.channel==='both');
          let totalPkgCOGS=0;
          for(const bom of bomItems){
            const usage=calcBOMUsage(bom.id,item.qty);
            const {used,tot:pkgCost}=fifoDeduct(bom.packaging_id,usage);
            totalPkgCOGS+=pkgCost;
            for(const u of used){
              const newR=u.b.qty_remaining-u.take;
              await api('yanz_purchase_batches?id=eq.'+u.b.id,{method:'PATCH',body:JSON.stringify({qty_remaining:newR})});
              const idx=BATCHES.findIndex(b=>b.id===u.b.id);if(idx>=0)BATCHES[idx].qty_remaining=newR;
            }
            await api('yanz_order_packaging',{method:'POST',body:JSON.stringify({
              order_id:orderId,packaging_id:bom.packaging_id,
              qty_used:usage,cogs_per_unit:usage>0?pkgCost/usage:0,cogs_total:pkgCost,source:'bom'
            })});
          }
          // Polymailer paket (grup Order ID) → dibebankan ke item PERTAMA tiap grup.
          const _gk=item.orderRef||'';
          if(!shipDone.has(_gk)){
            shipDone.add(_gk);
            for(const m of (shipGroups.get(_gk)||[])){
              if(!m.pkgId||m.qty<=0)continue;
              const {used,tot:mCost}=fifoDeduct(m.pkgId,m.qty);
              const ded=used.reduce((s,u)=>s+u.take,0);
              for(const u of used){const newR=u.b.qty_remaining-u.take;await api('yanz_purchase_batches?id=eq.'+u.b.id,{method:'PATCH',body:JSON.stringify({qty_remaining:newR})});const ix=BATCHES.findIndex(b=>b.id===u.b.id);if(ix>=0)BATCHES[ix].qty_remaining=newR;}
              if(ded>0){await api('yanz_order_packaging',{method:'POST',body:JSON.stringify({order_id:orderId,packaging_id:m.pkgId,qty_used:ded,cogs_per_unit:ded>0?mCost/ded:0,cogs_total:mCost,source:'shipping'})});totalPkgCOGS+=mCost;}
            }
          }
          const detectedPlatform=detectPlatformFromOrderId(item.orderRef);
          await api('yanz_order_items',{method:'POST',body:JSON.stringify({
            order_id:orderId,product_id:item.prodId,qty:item.qty,sell_price:item.sellPrice,
            cogs_product:totalProdCOGS,cogs_packaging:totalPkgCOGS,cogs_total:totalProdCOGS+totalPkgCOGS,
            payment_status:item.paymentStatus,order_ref:item.orderRef,customer_username:item.orderRef,
            livestream_session_id:sessionId,host_id:hostId,
            commission_amount:commission,commission_paid:false,
            platform:detectedPlatform||platform,nsa_status:'pending'
          })});
        }
        await api('yanz_activity',{method:'POST',body:JSON.stringify({
          icon:'🎙️',text:`Live ${getHostName(hostId)} — ${validItems.length} produk · Revenue ${rp(totRev)} · Komisi ${rp(totRev*COMMISSION_RATE)}`,
          time_ago:'Baru saja',color:'#FDF2F8'
        })});
      }
      ORDER_ITEMS=await api('yanz_order_items?order=created_at.desc&limit=500');
      toast('Sesi tersimpan ✓ Stok & packaging diperbarui');
      setMsg('✓ Berhasil','#16A34A');
      resetInput();renderAll();
    }catch(e){setMsg('❌ '+e.message,'#DC2626');console.error(e);}
  }

  // ── AUTOSAVE DRAFT INPUT LIVE ─────────────────────────────────────────────
  // Host sering keluar app (buka TikTok/Shopee) untuk copy Order ID/GMV lalu balik.
  // Di HP, browser sering reload halaman total saat app di-background → input hilang.
  // Solusi: simpan draft ke localStorage tiap ketik, pulihkan otomatis saat balik.
  const DRAFT_FIELD_IDS=['in-host','in-platform','in-date','in-start','in-end','in-gmv','in-orders','in-followers','in-imp','in-views','in-unique','in-peak','in-notes'];
  function saveDraft(){
    try{
      const fields={};
      DRAFT_FIELD_IDS.forEach(id=>{const e=document.getElementById(id);if(e)fields[id]=e.value;});
      // hanya simpan kalau ada isi berarti (abaikan default platform=tiktok & tanggal hari ini)
      const hasContent=orderItems.length>0||Object.entries(fields).some(([id,v])=>v&&v!==''&&id!=='in-date'&&!(id==='in-platform'&&v==='tiktok'));
      if(hasContent)localStorage.setItem(DRAFT_KEY,JSON.stringify({fields,orderItems,ts:Date.now()}));
      else localStorage.removeItem(DRAFT_KEY);
      updateDraftIndicator();
    }catch(e){}
  }
  function restoreDraft(){
    try{
      const raw=localStorage.getItem(DRAFT_KEY);if(!raw){updateDraftIndicator();return;}
      const d=JSON.parse(raw);if(!d){updateDraftIndicator();return;}
      Object.entries(d.fields||{}).forEach(([id,val])=>{const e=document.getElementById(id);if(e&&val!=null&&val!=='')e.value=val;});
      if(Array.isArray(d.orderItems))orderItems=d.orderItems;
      renderOrderItems();calcDuration();updateDraftIndicator();
    }catch(e){}
  }
  function clearDraft(){try{localStorage.removeItem(DRAFT_KEY);}catch(e){}updateDraftIndicator();}
  function discardDraft(){if(!confirm('Buang draft input live yang tersimpan? Semua isian di form ini akan dikosongkan.'))return;clearDraft();resetInput();toast('Draft dibuang ✓');}
  function attachDraftAutosave(){
    DRAFT_FIELD_IDS.forEach(id=>{const e=document.getElementById(id);if(!e||e._draftBound)return;e.addEventListener('input',saveDraft);e.addEventListener('change',saveDraft);e._draftBound=true;});
  }
  function updateDraftIndicator(){
    const el=document.getElementById('live-draft-indicator');if(!el)return;
    let has=false,ts=0;try{const raw=localStorage.getItem(DRAFT_KEY);if(raw){has=true;ts=(JSON.parse(raw)||{}).ts||0;}}catch(e){}
    if(!has){el.style.display='none';el.innerHTML='';return;}
    const t=ts?new Date(ts).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'}):'';
    el.style.display='flex';
    el.innerHTML=`<span>💾 Draft tersimpan otomatis${t?' · '+t:''} — aman kalau kamu keluar app buat copy data, balik lagi input tetap ada.</span><button class="btn btn-s btn-sm" style="padding:2px 10px;white-space:nowrap" onclick="live.discardDraft()">Buang draft</button>`;
  }

  function resetInput(){
    ['in-host','in-date','in-start','in-end','in-gmv','in-orders','in-followers','in-imp','in-views','in-unique','in-peak','in-notes'].forEach(id=>{const e=document.getElementById(id);if(e)e.value='';});
    const plat=document.getElementById('in-platform');if(plat)plat.value='tiktok';
    const dur=document.getElementById('in-duration');if(dur)dur.textContent='–';
    const date=document.getElementById('in-date');if(date)date.value=new Date().toISOString().split('T')[0];
    orderItems=[];renderOrderItems();clearDraft();
  }

(function(){

  const TABS=['stock','sku','bom','out','po','hist','import'];

  let role='owner';            // di-set dari window.YANZ.role saat init (konstan per sesi)
  let P=[],B=[],M=[],BOMS=[],BOM_TIERS=[],BUNDLES=[],ACCOUNTS=[];
  let channel='ecommerce';

  // ── FIFO HELPERS ──
  function stockOf(pid){return B.filter(b=>b.product_id===pid).reduce((s,b)=>s+num(b.qty_remaining),0);}
  function fifoCostOf(pid){const a=B.filter(b=>b.product_id===pid&&b.qty_remaining>0).sort((a,b)=>new Date(a.po_date)-new Date(b.po_date));return a.length?a[0].landed_cost_per_unit:0;}
  function invValOf(pid){return B.filter(b=>b.product_id===pid).reduce((s,b)=>s+b.qty_remaining*b.landed_cost_per_unit,0);}
  function bundleAvailableStock(bundleId){const comps=BUNDLES.filter(b=>b.bundle_id===bundleId);if(!comps.length)return 0;return Math.min(...comps.map(c=>Math.floor(stockOf(c.component_id)/c.qty_per_bundle)));}
  function bundleFIFOCost(bundleId){const comps=BUNDLES.filter(b=>b.bundle_id===bundleId);return comps.reduce((s,c)=>s+(fifoCostOf(c.component_id)*c.qty_per_bundle),0);}
  function fifoDeduct(pid,qty){
    const sorted=B.filter(b=>b.product_id===pid&&b.qty_remaining>0).sort((a,b)=>new Date(a.po_date)-new Date(b.po_date));
    let rem=qty,used=[],tot=0;
    for(const b of sorted){if(rem<=0)break;const take=Math.min(rem,b.qty_remaining),cost=take*b.landed_cost_per_unit;used.push({b,take,cost});tot+=cost;rem-=take;}
    return{used,tot,avg:qty>0?tot/qty:0,short:rem};
  }
  // Sadar-bundle: kalau produk = bundle, urai ke komponen (deduct FIFO tiap komponen). Kalau bukan, fifoDeduct biasa.
  function resolveOut(pid,qty){
    const prod=P.find(p=>p.id===pid);
    if(!prod||!prod.is_bundle)return fifoDeduct(pid,qty);
    const comps=BUNDLES.filter(b=>b.bundle_id===pid);
    if(!comps.length)return {used:[],tot:0,avg:0,short:qty};
    let used=[],tot=0,short=0;
    for(const c of comps){
      const r=fifoDeduct(c.component_id,qty*c.qty_per_bundle);
      used=used.concat(r.used);tot+=r.tot;
      if(r.short>0)short+=r.short; // salah satu komponen kurang → bundle kurang
    }
    return {used,tot,avg:qty>0?tot/qty:0,short};
  }
  function getBOMForProduct(pid){return BOMS.filter(b=>b.product_id===pid);}
  function getTiersForBOM(bomId){return BOM_TIERS.filter(t=>t.bom_id===bomId).sort((a,b)=>a.qty_min-b.qty_min);}
  function calcBOMUsage(bomId,qty){
    const tiers=getTiersForBOM(bomId);
    if(!tiers.length)return 0;
    let matchTier=tiers[0];
    for(const t of tiers){if(qty>=t.qty_min&&(t.qty_max===null||qty<=t.qty_max)){matchTier=t;break;}if(qty>=t.qty_min)matchTier=t;}
    const extra=qty-matchTier.qty_min;
    return matchTier.qty_usage+(extra>0?(extra*matchTier.usage_extra):0);
  }

  // ══════════════════════════════════════════════════════════════════
  //  PACKAGING PENGIRIMAN (POLYMAILER) — otomatis per PAKET (1 Order ID)
  //  Model "muatan/kapasitas": tiap produk punya muatan (pack_units; baju
  //  tipis=1, tebal=2, dst). Tiap polymailer punya kapasitas (cap). Total
  //  muatan paket = Σ(qty×muatan). Pilih mailer terkecil yang cukup; kalau
  //  melebihi mailer terbesar → ceil(total÷cap terbesar) × mailer terbesar.
  //  Konfigurasi disimpan di finance_settings key 'polymailer_rules' = JSON
  //  [{pkgId,cap},…]. Biaya dibebankan ke item pertama paket (COGS laporan =
  //  Σ order_items.cogs_total) & dicatat di order_packaging source 'shipping'.
  // ══════════════════════════════════════════════════════════════════
  let SHIP_MAILERS=[];
  function packUnitsOf(pid){const p=P.find(x=>x.id===pid);const v=p?num(p.pack_units):0;return v>0?v:1;}
  function shipLoad(items){return items.reduce((s,it)=>s+num(it.qty)*packUnitsOf(it.prodId),0);}
  function pickMailers(load){
    const ms=SHIP_MAILERS.filter(m=>m.pkgId&&num(m.cap)>0).slice().sort((a,b)=>num(a.cap)-num(b.cap));
    if(!ms.length||load<=0)return [];
    const fit=ms.find(m=>load<=num(m.cap));
    if(fit)return [{pkgId:fit.pkgId,qty:1}];
    const big=ms[ms.length-1];
    return [{pkgId:big.pkgId,qty:Math.ceil(load/num(big.cap))}];
  }
  // Hitung mailer + biaya FIFO (tanpa mutasi B). items=[{prodId,qty}]. Return {list,cost,short}.
  function calcShip(items){
    const list=pickMailers(shipLoad(items));let cost=0,short=0;
    for(const m of list){const f=fifoDeduct(m.pkgId,m.qty);cost+=f.tot;short+=f.short;}
    return {list,cost,short};
  }
  // Deduksi FIFO polymailer + catat order_packaging (source 'shipping'). Mutasi B via patchBatch, insert lewat jobs. Return biaya.
  function deductShip(orderId,itemId,list,jobs,patchBatch){
    let cost=0;
    for(const m of (list||[])){
      if(!m.pkgId||m.qty<=0)continue;
      const f=fifoDeduct(m.pkgId,m.qty);cost+=f.tot;
      const deducted=f.used.reduce((s,u)=>s+u.take,0);
      if(deducted>0){
        jobs.push(api('yanz_order_packaging',{method:'POST',body:JSON.stringify({order_id:orderId,order_item_id:itemId||null,packaging_id:m.pkgId,qty_used:deducted,cogs_per_unit:deducted>0?f.tot/deducted:0,cogs_total:f.tot,source:'shipping'})}));
        f.used.forEach(patchBatch);
      }
    }
    return cost;
  }

  async function saveSKU(){
    const code=document.getElementById('sc').value.trim().toUpperCase();
    const name=document.getElementById('sn').value.trim();
    const cat=document.getElementById('scat').value;
    const unit=document.getElementById('su').value.trim();
    const buf=int(document.getElementById('sb').value);
    const sellPrice=num(document.getElementById('sp').value);
    const isBundle=document.getElementById('sbundle').value==='true';
    const st=document.getElementById('sst');
    if(!code||!name||!unit||!buf){st.textContent='⚠️ Lengkapi semua field wajib';st.style.color='#D97706';return;}
    if(P.find(p=>p.sku===code)){st.textContent='⚠️ SKU sudah ada';st.style.color='#DC2626';return;}
    let bundleComps=[];
    if(isBundle){
      if(cat!=='product'){st.textContent='⚠️ Bundle hanya untuk kategori Produk';st.style.color='#D97706';return;}
      const rows=document.querySelectorAll('#bundle-comps-list .bundle-comp-row');
      for(const row of rows){
        const cid=row.querySelector('.bc-prod').value;
        const cqty=int(row.querySelector('.bc-qty').value);
        if(cid&&cqty>0)bundleComps.push({component_id:cid,qty_per_bundle:cqty});
      }
      if(!bundleComps.length){st.textContent='⚠️ Bundle harus punya minimal 1 komponen';st.style.color='#D97706';return;}
    }
    st.textContent='Menyimpan…';st.style.color='#999';
    try{
      // Cek SKU di DB (termasuk yang sudah dihapus/soft-delete) — constraint unik berlaku ke semua baris
      let existing=[];
      try{existing=await api('yanz_products?sku=eq.'+encodeURIComponent(code)+'&select=id,is_active');}catch(e){}
      let prodId;
      if(existing.length){
        const ex=existing[0];
        if(ex.is_active){st.textContent='⚠️ SKU sudah ada (aktif)';st.style.color='#DC2626';return;}
        // SKU pernah ada tapi sudah dihapus → AKTIFKAN KEMBALI + perbarui (bukan insert baru)
        await api('yanz_products?id=eq.'+ex.id,{method:'PATCH',body:JSON.stringify({name,category:cat,unit,buffer_stock:buf,selling_price:sellPrice||0,is_bundle:isBundle,is_active:true})});
        prodId=ex.id;
        try{await api('yanz_bundle_components?bundle_id=eq.'+prodId,{method:'DELETE'});}catch(e){} // bersihkan komponen lama
      } else {
        const r=await api('yanz_products',{method:'POST',headers:{'Prefer':'return=representation'},body:JSON.stringify({sku:code,name,category:cat,unit,buffer_stock:buf,selling_price:sellPrice||0,is_bundle:isBundle})});
        prodId=r[0].id;
      }
      if(isBundle&&bundleComps.length){
        for(const c of bundleComps){await api('yanz_bundle_components',{method:'POST',body:JSON.stringify({bundle_id:prodId,...c})});}
      }
      // Reload biar P & BUNDLES sinkron (mencakup kasus aktivasi-ulang)
      P=await api('yanz_products?is_active=eq.true&order=category,sku');
      BUNDLES=await api('yanz_bundle_components');
      renderSKUTable();fillAllSelects();renderStock();
      ['sc','sn','su','sb','sp'].forEach(id=>{const e=document.getElementById(id);if(e)e.value='';});
      document.getElementById('sbundle').value='false';
      document.getElementById('bundle-comp-wrap').style.display='none';
      document.getElementById('bundle-comps-list').innerHTML='';
      st.textContent='✓ SKU '+code+' disimpan';st.style.color='#16A34A';
      toast('SKU '+code+' ditambahkan ✓');
    }catch(e){st.textContent='❌ '+e.message;st.style.color='#DC2626';}
  }

    set('eid',p.id);set('ec',p.sku);set('en',p.name);set('ecat',p.category);set('eu',p.unit);set('eb',p.buffer_stock);set('esp',p.selling_price||0);set('epu',(p.pack_units==null||p.pack_units==='')?1:p.pack_units);

  async function deleteSKU(id){
    if(role!=='owner'){toast('❌ Hanya Owner yang bisa menghapus SKU');return;}
    const p=P.find(x=>x.id===id);if(!p)return;
    const hasBatches=B.some(b=>b.product_id===id);
    const isBundleComp=BUNDLES.some(b=>b.component_id===id);
    const isInBOM=BOMS.some(b=>b.product_id===id||b.packaging_id===id);
    let warnings=[];
    if(hasBatches)warnings.push('Punya riwayat pembelian/stok');
    if(isBundleComp)warnings.push('Digunakan dalam bundle lain');
    if(isInBOM)warnings.push('Digunakan dalam BOM');
    const msg=warnings.length
      ? `⚠️ SKU "${p.name}" (${p.sku}):\n• ${warnings.join('\n• ')}\n\nMenghapus dapat menyebabkan data lain bermasalah. Lanjutkan?`
      : `Hapus SKU "${p.name}" (${p.sku})?`;
    if(!confirm(msg))return;
    try{
      await api('yanz_products?id=eq.'+id,{method:'PATCH',body:JSON.stringify({is_active:false})});
      P=P.filter(x=>x.id!==id);
      if(p.is_bundle){await api('yanz_bundle_components?bundle_id=eq.'+id,{method:'DELETE'});BUNDLES=BUNDLES.filter(b=>b.bundle_id!==id);}
      renderSKUTable();fillAllSelects();renderStock();
      toast('SKU '+p.sku+' dihapus ✓');
    }catch(e){toast('❌ Gagal hapus: '+e.message);}
  }
  async function saveEM(){
    const id=document.getElementById('eid').value;
    const sellEl=document.getElementById('esp');
    const puEl=document.getElementById('epu');
    const body={
      sku:document.getElementById('ec').value.trim().toUpperCase(),
      name:document.getElementById('en').value.trim(),
      category:document.getElementById('ecat').value,
      unit:document.getElementById('eu').value.trim(),
      buffer_stock:int(document.getElementById('eb').value),
      selling_price:sellEl?num(sellEl.value):0
    };
    const pu=puEl?(num(puEl.value)||1):1;

      // Coba simpan dgn pack_units; fallback tanpa kolom bila migrasi belum jalan.
      try{await api('yanz_products?id=eq.'+id,{method:'PATCH',body:JSON.stringify({...body,pack_units:pu})});body.pack_units=pu;}
      catch(e){await api('yanz_products?id=eq.'+id,{method:'PATCH',body:JSON.stringify(body)});}
      const i=P.findIndex(p=>p.id===id);if(i>=0)P[i]={...P[i],...body};
      renderSKUTable();fillAllSelects();renderStock();closeEM();toast('SKU diperbarui ✓');
    }catch(e){toast('❌ '+e.message);}
  }

  async function saveBOMItem(){
    const pkgId=document.getElementById('bom-pkg-sel').value;
    const ch=document.getElementById('bom-channel').value;
    const notes=document.getElementById('bom-notes').value;
    const st=document.getElementById('bom-st');
    if(!pkgId){st.textContent='⚠️ Pilih packaging';st.style.color='#D97706';return;}
    const tierEls=document.querySelectorAll('#tier-rows .tier-row');
    const tiers=[];
    for(const row of tierEls){
      const mn=int(row.querySelector('.t-min').value);
      const mx=row.querySelector('.t-max').value?int(row.querySelector('.t-max').value):null;
      const use=num(row.querySelector('.t-use').value);
      const ext=num(row.querySelector('.t-ext').value);
      if(!mn&&use===0)continue;
      tiers.push({qty_min:mn,qty_max:mx,qty_usage:use,usage_extra:ext});
    }
    if(!tiers.length){st.textContent='⚠️ Tambah minimal 1 tier';st.style.color='#D97706';return;}
    st.textContent='Menyimpan…';st.style.color='#999';
    try{
      if(editingBOMId){
        await api('yanz_bom?id=eq.'+editingBOMId,{method:'PATCH',body:JSON.stringify({packaging_id:pkgId,channel:ch,notes})});
        await api('yanz_bom_tiers?bom_id=eq.'+editingBOMId,{method:'DELETE'});
        for(const t of tiers){await api('yanz_bom_tiers',{method:'POST',body:JSON.stringify({...t,bom_id:editingBOMId})});}
        BOMS=await api('yanz_bom?order=created_at');
        BOM_TIERS=await api('yanz_bom_tiers?order=qty_min');
      }else{
        const r=await api('yanz_bom',{method:'POST',headers:{'Prefer':'return=representation'},body:JSON.stringify({product_id:currentBOMProductId,packaging_id:pkgId,channel:ch,notes})});
        const bomId=r[0].id;
        for(const t of tiers){await api('yanz_bom_tiers',{method:'POST',body:JSON.stringify({...t,bom_id:bomId})});}
        BOMS=await api('yanz_bom?order=created_at');
        BOM_TIERS=await api('yanz_bom_tiers?order=qty_min');
      }
      closeBOM();renderBOMItems(currentBOMProductId);toast('BOM disimpan ✓');
    }catch(e){st.textContent='❌ '+e.message;st.style.color='#DC2626';}
  }
  async function deleteBOMItem(bomId){
    if(role!=='owner'){toast('❌ Hanya Owner yang bisa menghapus BOM');return;}
    if(!confirm('Hapus packaging ini dari BOM?'))return;
    try{
      await api('yanz_bom_tiers?bom_id=eq.'+bomId,{method:'DELETE'});
      await api('yanz_bom?id=eq.'+bomId,{method:'DELETE'});
      BOMS=BOMS.filter(b=>b.id!==bomId);
      BOM_TIERS=BOM_TIERS.filter(t=>t.bom_id!==bomId);
      renderBOMItems(currentBOMProductId);toast('Dihapus ✓');
    }catch(e){toast('❌ '+e.message);}
  }

  async function copyBOMFrom(){
    if(!currentBOMProductId){toast('Pilih produk tujuan dulu di atas');return;}
    const srcId=document.getElementById('bom-copy-src')?.value;
    if(!srcId){toast('Pilih produk sumber dulu');return;}
    if(srcId===currentBOMProductId){toast('Produk sumber & tujuan tidak boleh sama');return;}
    const srcBoms=getBOMForProduct(srcId);
    if(!srcBoms.length){toast('Produk sumber belum punya BOM');return;}
    const existing=getBOMForProduct(currentBOMProductId);
    const srcName=P.find(p=>p.id===srcId)?.name||'produk sumber';
    if(existing.length&&!confirm(`Produk ini sudah punya ${existing.length} packaging. Tambahkan ${srcBoms.length} packaging dari "${srcName}"? (yang lama tidak dihapus)`))return;
    try{
      for(const b of srcBoms){
        const r=await api('yanz_bom',{method:'POST',headers:{'Prefer':'return=representation'},body:JSON.stringify({product_id:currentBOMProductId,packaging_id:b.packaging_id,channel:b.channel,notes:b.notes})});
        const newId=r[0].id;
        for(const t of getTiersForBOM(b.id)){
          await api('yanz_bom_tiers',{method:'POST',body:JSON.stringify({qty_min:t.qty_min,qty_max:t.qty_max,qty_usage:t.qty_usage,usage_extra:t.usage_extra,bom_id:newId})});
        }
      }
      BOMS=await api('yanz_bom?order=created_at');
      BOM_TIERS=await api('yanz_bom_tiers?order=qty_min');
      renderBOMItems(currentBOMProductId);
      toast(`✓ ${srcBoms.length} packaging disalin dari "${srcName}"`);
    }catch(e){toast('❌ '+e.message);console.error(e);}
  }

  // ── HAPUS PO (batch pembelian salah input) ──
  async function deletePO(batchId){
    if(role!=='owner'){toast('❌ Hanya Owner yang bisa hapus PO');return;}
    const b=B.find(x=>x.id===batchId);if(!b)return;
    const prod=P.find(p=>p.id===b.product_id);
    // Safety: batch sudah sebagian/seluruhnya terpakai (FIFO) → tak boleh hapus (rusak COGS lama)
    if(num(b.qty_remaining)!==num(b.qty_purchased)){
      toast('❌ PO ini sudah sebagian/seluruhnya terjual (FIFO) — tidak bisa dihapus karena merusak COGS yang sudah tercatat.');
      return;
    }
    if(!confirm(`Hapus PO ini?\n\n${prod?.name||''} — ${b.qty_purchased} ${prod?.unit||''} @ ${rp(b.landed_cost_per_unit)}/unit\nPO: ${fd(b.po_date)}\n\n• Stok ${b.qty_purchased} ${prod?.unit||''} akan dihapus.\n• Pergerakan kas / hutang dari PO ini dibatalkan (kas kembali).\n\nTidak bisa di-undo.`))return;
    try{
      // 1. Hapus cash movement terkait (PO tunai / pembayaran hutang) → kembalikan saldo kas
      try{await api('yanz_cash_movements?source_type=eq.purchase&source_id=eq.'+batchId,{method:'DELETE'});}catch(e){}
      // 2. Hapus batch-nya (otomatis hilangkan stok + hutang kalau unpaid)
      await api('yanz_purchase_batches?id=eq.'+batchId,{method:'DELETE'});
      B=B.filter(x=>x.id!==batchId);
      renderStock();renderHist();renderOutForm();
      toast('✓ PO dihapus — stok & kas dikembalikan');
    }catch(e){toast('❌ '+e.message);console.error(e);}
  }

  // Kembalikan qty ke batch produk (oldest-first, isi sampai qty_purchased) — kebalikan FIFO
  async function restoreToBatches(pid,qty){
    let rem=num(qty);
    const batches=B.filter(b=>b.product_id===pid).sort((a,b)=>new Date(a.po_date)-new Date(b.po_date));
    for(const b of batches){
      if(rem<=0)break;
      const room=num(b.qty_purchased)-num(b.qty_remaining);
      if(room<=0)continue;
      const add=Math.min(rem,room);const nr=num(b.qty_remaining)+add;
      await api('yanz_purchase_batches?id=eq.'+b.id,{method:'PATCH',body:JSON.stringify({qty_remaining:nr})});
      const i=B.findIndex(x=>x.id===b.id);if(i>=0)B[i].qty_remaining=nr;
      rem-=add;
    }
  }

  // Hapus penjualan berdasarkan Order ID (referensi): kembalikan stok + hapus order
  async function deleteSaleByRef(ref){
    if(role!=='owner'){toast('❌ Hanya Owner yang bisa hapus penjualan');return;}
    if(!ref)return;
    let orders=[];
    try{orders=await api('yanz_sales_orders?reference=eq.'+encodeURIComponent(ref)+'&select=id,reference');}catch(e){toast('❌ '+e.message);return;}
    if(!orders.length){toast('Penjualan tidak ditemukan');return;}
    let allItems=[];
    for(const o of orders){try{const its=await api('yanz_order_items?order_id=eq.'+o.id+'&select=id,product_id,qty,nsa_status');allItems=allItems.concat(its);}catch(e){}}
    if(allItems.some(it=>it.nsa_status==='matched')){toast('❌ Order ini sudah ter-match NSA — batalkan match di modul NSA dulu, baru bisa dihapus.');return;}
    const desc=allItems.map(it=>{const p=P.find(x=>x.id===it.product_id);return (p?.name||'?')+' ×'+it.qty;}).join(', ');
    if(!confirm(`Hapus penjualan Order ID "${ref}"?\n\nIsi: ${desc||'(tidak ada item)'}\n\nStok akan DIKEMBALIKAN & penjualan dihapus. Tidak bisa di-undo.`))return;
    try{
      // 1. Kembalikan stok produk (bundle → komponen)
      for(const it of allItems){
        const prod=P.find(p=>p.id===it.product_id);
        if(prod&&prod.is_bundle){
          for(const c of BUNDLES.filter(b=>b.bundle_id===it.product_id))await restoreToBatches(c.component_id,num(it.qty)*num(c.qty_per_bundle));
        }else{await restoreToBatches(it.product_id,num(it.qty));}
      }
      // 2. Kembalikan stok packaging
      for(const o of orders){
        let pkgs=[];try{pkgs=await api('yanz_order_packaging?order_id=eq.'+o.id+'&select=packaging_id,qty_used');}catch(e){}
        for(const pk of pkgs)await restoreToBatches(pk.packaging_id,num(pk.qty_used));
      }
      // 3. Hapus pergerakan stok (by reference) + order (cascade ke items + packaging)
      try{await api('yanz_stock_movements?reference=eq.'+encodeURIComponent(ref),{method:'DELETE'});}catch(e){}
      for(const o of orders)await api('yanz_sales_orders?id=eq.'+o.id,{method:'DELETE'});
      toast('✓ Penjualan "'+ref+'" dihapus & stok dikembalikan');
      await loadAll();
    }catch(e){toast('❌ '+e.message);console.error(e);}
  }

  function calcItemPkgCost(pid,qty){
    const boms=getBOMForProduct(pid).filter(b=>b.channel==='ecommerce'||b.channel==='both');
    return boms.reduce((s,bom)=>{const usage=calcBOMUsage(bom.id,qty);return s+usage*fifoCostOf(bom.packaging_id);},0);
  }

  function updateAddon(idx,ai,field,val){outItems[idx].addons[ai][field]=field==='qty'?num(val):val;scheduleRender();}

  async function submitOut(){
    const st=document.getElementById('out-st');
    const date=document.getElementById('out-date')?.value;
    const ref=document.getElementById('out-ref')?.value||'';
    const cust=document.getElementById('out-cust')?.value||'';
    const isEco=channel==='ecommerce';
    const validItems=outItems.filter(i=>i.prodId&&i.qty>0);
    if(!validItems.length||!date){if(st){st.textContent='⚠️ Isi tanggal dan minimal 1 produk';st.style.color='#D97706';}return;}
    for(const item of validItems){
      const {short}=resolveOut(item.prodId,item.qty);
      if(short>0){const p=P.find(x=>x.id===item.prodId);if(st){st.textContent=`❌ Stok produk "${p?.name}" tidak cukup (tersedia: ${p?.is_bundle?bundleAvailableStock(item.prodId):stockOf(item.prodId)} ${p?.unit})`;st.style.color='#DC2626';}return;}
    }
    for(const item of validItems){
      const prod=P.find(p=>p.id===item.prodId);
      if(isEco){
        const bomItems=getBOMForProduct(item.prodId).filter(b=>b.channel==='ecommerce'||b.channel==='both');
        for(const bom of bomItems){
          const pkg=P.find(p=>p.id===bom.packaging_id);
          const needed=calcBOMUsage(bom.id,item.qty);
          const available=stockOf(bom.packaging_id);
          if(available<needed){if(st){st.textContent=`❌ Packaging "${pkg?.name}" tidak cukup untuk ${prod?.name} — dibutuhkan ${needed.toFixed(3)} ${pkg?.unit}, tersedia ${available.toFixed(3)} ${pkg?.unit}`;st.style.color='#DC2626';}return;}
        }
      }else{
        for(const addon of (item.addons||[]).filter(a=>a.pkgId&&a.qty>0)){
          const pkg=P.find(p=>p.id===addon.pkgId);
          const available=stockOf(addon.pkgId);
          if(available<addon.qty){if(st){st.textContent=`❌ Packaging "${pkg?.name}" tidak cukup — dibutuhkan ${addon.qty} ${pkg?.unit}, tersedia ${available.toFixed(3)} ${pkg?.unit}`;st.style.color='#DC2626';}return;}
        }
      }
    }
    // Polymailer paket (packaging pengiriman otomatis) — hitung & cek stok utk SELURUH paket ecommerce
    const ship=isEco?calcShip(validItems):{list:[],cost:0,short:0};
    for(const m of ship.list){const pkg=P.find(p=>p.id===m.pkgId);const avail=stockOf(m.pkgId);if(avail<m.qty){if(st){st.textContent=`❌ Polymailer "${pkg?.name||'?'}" tidak cukup — butuh ${m.qty} ${pkg?.unit||''}, tersedia ${avail.toFixed(2)}`;st.style.color='#DC2626';}return;}}
    // Cegah dobel: Order ID (ecommerce) yang sama sudah pernah diinput?
    if(isEco&&ref){
      try{
        const dup=await api('yanz_sales_orders?channel=eq.ecommerce&reference=eq.'+encodeURIComponent(ref)+'&select=id&limit=1');
        if(dup.length&&!confirm(`⚠️ Order ID "${ref}" SUDAH PERNAH diinput.\n\nMenyimpan lagi akan MENGGANDAKAN penjualan & memotong stok 2x, dan bisa mengacaukan pencocokan NSA.\n\nYakin tetap lanjut?`)){
          if(st){st.textContent='Dibatalkan — Order ID sudah ada';st.style.color='#D97706';}
          return;
        }
      }catch(e){/* kalau cek gagal, biarkan lanjut */}
    }
    if(st){st.textContent='Menyimpan…';st.style.color='#999';}
    try{
      let totalCOGS=0,totalRev=0;
      validItems.forEach(item=>{
        const {tot}=resolveOut(item.prodId,item.qty);
        const pkgCost=isEco?calcItemPkgCost(item.prodId,item.qty):item.addons.reduce((s,a)=>s+(a.qty*fifoCostOf(a.pkgId)),0);
        totalCOGS+=tot+pkgCost;totalRev+=item.qty*item.sellPrice;
      });
      totalCOGS+=ship.cost; // biaya polymailer paket
      const orderR=await api('yanz_sales_orders',{method:'POST',headers:{'Prefer':'return=representation'},body:JSON.stringify({channel,order_date:date,reference:ref,customer_name:cust,total_cogs:totalCOGS,total_revenue:totalRev})});
      const orderId=orderR[0].id;
      for(let idx=0;idx<validItems.length;idx++){
        const item=validItems[idx],isFirst=idx===0;
        const {used,tot:prodCost,avg}=resolveOut(item.prodId,item.qty);
        let pkgCost=isEco?calcItemPkgCost(item.prodId,item.qty):item.addons.reduce((s,a)=>s+(a.qty*fifoCostOf(a.pkgId)),0);
        if(isFirst)pkgCost+=ship.cost; // polymailer paket dibebankan ke item pertama → ikut COGS laporan
        // order_item wajib duluan (butuh itemId untuk order_packaging)
        const itemR=await api('yanz_order_items',{method:'POST',headers:{'Prefer':'return=representation'},body:JSON.stringify({order_id:orderId,product_id:item.prodId,qty:item.qty,sell_price:item.sellPrice,cogs_product:prodCost,cogs_packaging:pkgCost,cogs_total:prodCost+pkgCost,order_ref:ref||null,nsa_status:isEco?'pending':null})});
        const itemId=itemR[0].id;
        // Hitung deduksi + update B di MEMORI (sinkron, FIFO tetap benar), kumpulkan panggilan network
        const jobs=[];
        const patchBatch=(u)=>{const nr=u.b.qty_remaining-u.take;const i=B.findIndex(b=>b.id===u.b.id);if(i>=0)B[i].qty_remaining=nr;jobs.push(api('yanz_purchase_batches?id=eq.'+u.b.id,{method:'PATCH',body:JSON.stringify({qty_remaining:nr})}));};
        used.forEach(patchBatch);
        jobs.push(api('yanz_stock_movements',{method:'POST',body:JSON.stringify({product_id:item.prodId,movement_type:'sale',qty:item.qty,cogs_per_unit:avg,total_cogs:prodCost,reference:ref,movement_date:date})}));
        const pkgList=isEco
          ?getBOMForProduct(item.prodId).filter(b=>b.channel==='ecommerce'||b.channel==='both').map(bom=>({pkgId:bom.packaging_id,qty:calcBOMUsage(bom.id,item.qty),bomId:bom.id,source:'bom'}))
          :item.addons.filter(a=>a.pkgId&&a.qty>0).map(a=>({...a,source:'manual'}));
        for(const pkg of pkgList){
          const pkgFifo=fifoDeduct(pkg.pkgId,pkg.qty);
          jobs.push(api('yanz_order_packaging',{method:'POST',body:JSON.stringify({order_id:orderId,order_item_id:itemId,packaging_id:pkg.pkgId,qty_used:pkg.qty,cogs_per_unit:fifoCostOf(pkg.pkgId),cogs_total:pkgFifo.tot,source:pkg.source})}));
          pkgFifo.used.forEach(patchBatch);
          const prod=P.find(p=>p.id===pkg.pkgId);
          if(prod&&stockOf(pkg.pkgId)<prod.buffer_stock){
            jobs.push(api('yanz_alerts',{method:'POST',body:JSON.stringify({type:'stock',severity:stockOf(pkg.pkgId)===0?'high':'medium',message:`${prod.name} — stok ${stockOf(pkg.pkgId).toFixed(2)} ${prod.unit} (buffer: ${prod.buffer_stock})`})}).catch(()=>{}));
          }
        }
        if(isFirst&&isEco&&ship.list.length)deductShip(orderId,itemId,ship.list,jobs,patchBatch); // polymailer seluruh paket
        await Promise.all(jobs); // semua tulisan item ini paralel (batch distinct → aman)
      }
      // activity = log, tidak perlu ditunggu (fire-and-forget)
      api('yanz_activity',{method:'POST',body:JSON.stringify({icon:isEco?'🛒':'🤝',text:`${isEco?'Ecommerce':'B2B'} — ${validItems.length} item · COGS ${rp(totalCOGS)} · Revenue ${rp(totalRev)}`,time_ago:'Baru saja',color:isEco?'#EFF6FF':'#F0FDF4'})}).catch(()=>{});
      M=await api('yanz_stock_movements?order=created_at.desc&limit=100');
      toast('Transaksi berhasil dicatat ✓');
      outItems=[];renderOutForm();renderStock();renderHist();
      if(st)st.textContent='';
    }catch(e){if(st){st.textContent='❌ '+e.message;st.style.color='#DC2626';}console.error(e);}
  }

  // ════════════════════════════════════════════════════════════════
  //  IMPORT EXCEL MARKETPLACE (TikTok / Shopee) — OWNER ONLY
  //  Parse export pesanan mentah → catat penjualan ecommerce massal.
  //  • Anti-dobel: Order ID yang SUDAH ada (dari Live/input manual) dilewati.
  //  • Multi-baris Order ID sama = 1 order multi-SKU (di-group, bukan dobel).
  //  • COD (Bayar di tempat) → approve manual; hanya Selesai yang siap dicatat.
  //  • SKU tak terdaftar → Other Income (tanpa cash movement; kas dari NSA).
  //  Re-upload aman: export selalu FULL, jadi status COD/pending ter-derive ulang.
  // ════════════════════════════════════════════════════════════════
  let IMP=null;                 // hasil parse + preview
  let impPlatform='tiktok';
  const OI_CAT='Penjualan (SKU tak terdaftar)'; // kategori Other Income utk SKU tak dikenal saat import — dipakai riwayat & hapus batch

  function setImpPlatform(p){
    impPlatform=p;

    if(a)a.classList.toggle('active',p==='tiktok');
    if(b)b.classList.toggle('active',p==='shopee');

    if(hint)hint.textContent=p==='tiktok'
      ?'TikTok: file "Semua pesanan…" (sheet OrderSKUList). Dihitung: Dikirim & Selesai (tanpa retur). COD "Bayar di tempat" perlu approve manual. Batal/retur/belum bayar dilewati.'
      :'Shopee: file "Order.all…" (sheet orders). Semua dihitung KECUALI Batal & Belum Bayar.';
  }

  // Dimension sering usang di export marketplace → hitung ulang range dari sel nyata
  function _impExpand(sheet){
    let maxR=0,maxC=0;
    for(const k in sheet){if(k[0]==='!')continue;const m=k.match(/^([A-Z]+)(\d+)$/);if(!m)continue;const r=parseInt(m[2],10),c=XLSX.utils.decode_col(m[1]);if(r>maxR)maxR=r;if(c>maxC)maxC=c;}
    if(maxR>0)sheet['!ref']=XLSX.utils.encode_range({s:{r:0,c:0},e:{r:maxR-1,c:maxC}});
    return sheet;
  }
  function _impRows(wb,name){
    let sheet=wb.Sheets[name];
    if(!sheet){const n=wb.SheetNames.find(x=>x.toLowerCase()===name.toLowerCase());if(n)sheet=wb.Sheets[n];}
    if(!sheet)return null;
    _impExpand(sheet);
    return XLSX.utils.sheet_to_json(sheet,{header:1,defval:''});
  }
  // TikTok: angka standar (dot=desimal). Shopee: format ID (titik=ribuan, koma=desimal).
  const _ttNum=v=>parseFloat(String(v==null?'':v).replace(/\s/g,'').replace(/,/g,''))||0;
  const _spNum=v=>parseFloat(String(v==null?'':v).replace(/\s/g,'').replace(/\./g,'').replace(',','.'))||0;
  function _ttDate(v){const p=String(v||'').trim().split(/\s+/)[0];let m=p.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);if(m)return m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');m=String(v||'').match(/^(\d{4})-(\d{2})-(\d{2})/);return m?m[0]:'';}
  function _spDate(v){const s=String(v||'').trim();let m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);if(m)return m[0];m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);return m?m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0'):'';}

  function _ttLines(wb){
    const rows=_impRows(wb,'OrderSKUList');if(!rows)return null;
    const out=[];
    for(const r of rows){const oid=String(r[0]||'').trim();if(!/^\d{15,20}$/.test(oid))continue; // skip header/deskripsi/ringkasan
      out.push({orderId:oid,date:_ttDate(r[31]),status:String(r[1]||'').trim(),ret:String(r[3]||'').trim(),pay:String(r[54]||'').trim(),sku:String(r[6]||'').trim(),qty:_ttNum(r[9]),lineRev:_ttNum(r[15])+_ttNum(r[13])});}
    return out;
  }
  function _spLines(wb){
    const rows=_impRows(wb,'orders');if(!rows)return null;
    const out=[];
    for(const r of rows){const oid=String(r[0]||'').trim();if(!/^\d{6}[A-Z0-9]{8}$/i.test(oid))continue;
      out.push({orderId:oid,date:_spDate(r[9]),status:String(r[2]||'').trim(),ret:'',pay:String(r[12]||'').trim(),sku:String(r[15]||'').trim(),qty:_spNum(r[19]),lineRev:_spNum(r[21])+_spNum(r[24])});}
    return out;
  }
  function _group(platform,lines){
    const map=new Map();
    for(const l of lines){
      if(l.qty<=0&&l.lineRev<=0)continue;
      if(!map.has(l.orderId))map.set(l.orderId,{orderId:l.orderId,platform,date:l.date,status:l.status,ret:l.ret,pay:l.pay,lines:[]});
      const o=map.get(l.orderId);
      if(!o.date&&l.date)o.date=l.date;
      if(l.ret&&!o.ret)o.ret=l.ret;
      o.lines.push({sku:l.sku,qty:l.qty,lineRev:l.lineRev});
    }
    return [...map.values()];
  }
  function _classify(o){
    const s=(o.status||'').toLowerCase(),ret=(o.ret||'').toLowerCase();
    const hasRet=/return|refund|retur/.test(ret);
    if(o.platform==='tiktok'){
      const isCOD=/bayar di tempat/i.test(o.pay||'');
      if(o.status==='Dibatalkan'||s.includes('batal'))return {cat:'skip',reason:'Dibatalkan'};
      if(o.status==='Selesai'&&hasRet)return {cat:'skip',reason:'Retur/Refund'};
      const countable=(o.status==='Dikirim')||(o.status==='Selesai');
      if(!countable)return {cat:'skip',reason:'Status: '+(o.status||'?')}; // Belum dibayar / Perlu dikirim
      if(isCOD)return o.status==='Selesai'?{cat:'cod',ready:true}:{cat:'cod',ready:false};
      return {cat:'auto'};
    }
    // shopee: hanya Batal & Belum Bayar yang tak dihitung
    if(s.includes('batal'))return {cat:'skip',reason:'Batal'};
    if(s.includes('belum bayar')||s.includes('belum dibayar'))return {cat:'skip',reason:'Belum Bayar'};
    return {cat:'auto'};
  }

  async function onImportFile(ev){
    const st=document.getElementById('imp-status');
    const file=ev.target&&ev.target.files&&ev.target.files[0];if(!file)return;
    if(typeof XLSX==='undefined'){if(st)st.innerHTML='<span style="color:#DC2626">❌ Library Excel (SheetJS) belum termuat. Cek internet & refresh.</span>';return;}
    if(st)st.innerHTML='⏳ Membaca <strong>'+file.name+'</strong>…';
    try{
      const wb=XLSX.read(await file.arrayBuffer(),{type:'array'});
      const lines=impPlatform==='tiktok'?_ttLines(wb):_spLines(wb);
      if(lines===null){if(st)st.innerHTML='<span style="color:#DC2626">❌ Sheet <code>'+(impPlatform==='tiktok'?'OrderSKUList':'orders')+'</code> tak ditemukan. Pastikan platform & file cocok.</span>';return;}
      if(!lines.length){if(st)st.innerHTML='<span style="color:#D97706">⚠️ Tidak ada baris order valid di file ini.</span>';return;}
      const orders=_group(impPlatform,lines);
      // Order ID yang SUDAH ada (dari Live/input manual, ATAU import lama → Penjualan/Other Income) → jangan dobel
      let existRefs=new Set();
      try{const ex=await api('yanz_sales_orders?channel=eq.ecommerce&select=reference');ex.forEach(x=>{if(x.reference)existRefs.add(String(x.reference));});}catch(e){}
      try{const oi=await api('yanz_other_income?category=eq.'+encodeURIComponent(OI_CAT)+'&select=reference');oi.forEach(x=>{if(x.reference)existRefs.add(String(x.reference));});}catch(e){}
      const auto=[],cod=[],skip=[];
      const skuMap=new Map();P.forEach(p=>{if(p.sku)skuMap.set(String(p.sku).toUpperCase(),p);});
      const unknown=new Map();
      for(const o of orders){
        const c=_classify(o);
        if(c.cat==='skip'){skip.push({orderId:o.orderId,reason:c.reason});continue;}
        if(existRefs.has(o.orderId)){skip.push({orderId:o.orderId,reason:'Sudah ada (Live/manual)'});continue;}
        o.total=0;
        o.lines.forEach(l=>{
          o.total+=l.lineRev;
          const key=String(l.sku||'').toUpperCase();
          l.prod=skuMap.get(key)||null;
          if(!l.prod&&l.sku){
            if(!unknown.has(key))unknown.set(key,{sku:l.sku,count:0,qty:0,rev:0,mapTo:''});
            const u=unknown.get(key);u.count++;u.qty+=l.qty;u.rev+=l.lineRev;
          }
        });
        if(c.cat==='cod'){o.ready=c.ready;o._approve=!!c.ready;cod.push(o);}else auto.push(o);
      }
      IMP={platform:impPlatform,fileName:file.name,auto,cod,skip,unknown,autoCreate:true};
      renderImportPreview();
      if(st)st.innerHTML='<span style="color:#16A34A">✓ <strong>'+file.name+'</strong> diparse — '+orders.length+' Order ID. Review di bawah lalu Commit.</span>';
      ev.target.value=''; // izinkan pilih file yang sama lagi
    }catch(e){if(st)st.innerHTML='<span style="color:#DC2626">❌ '+e.message+'</span>';console.error(e);}
  }

    const key=String(sku||'').trim().toUpperCase();if(!key)return null;

    }catch(e){console.warn('auto-create produk gagal',sku,e.message);}
    return null;
  }
