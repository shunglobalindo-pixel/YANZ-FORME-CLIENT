  async function recordOrder(o,batchId,fileName){
    // Idempoten: kalau Order ID sudah tercatat (Penjualan ecommerce ATAU Other Income import) → LEWATI.
    // Cegah penjualan DOBEL saat file yang sama di-import >1× — cek langsung ke DB saat commit
    // (snapshot anti-dobel saat parse bisa gagal diam-diam / kadaluarsa, sehingga dobel lolos).
    try{
      const dupSO=await api('yanz_sales_orders?channel=eq.ecommerce&reference=eq.'+encodeURIComponent(o.orderId)+'&select=id&limit=1');
      if(dupSO.length)return {short:0,otherCount:0,skipped:true};
      const dupOI=await api('yanz_other_income?category=eq.'+encodeURIComponent(OI_CAT)+'&reference=eq.'+encodeURIComponent(o.orderId)+'&select=id&limit=1');
      if(dupOI.length)return {short:0,otherCount:0,skipped:true};
    }catch(e){/* kalau cek gagal, lanjut supaya tak menghalangi import yang sah */}
    const items=[],other=[];
    for(const l of o.lines){
      let prod=l.prod;
      if(!prod){
        const u=IMP&&IMP.unknown.get(String(l.sku||'').toUpperCase());
        if(u&&u.mapTo)prod=P.find(p=>p.id===u.mapTo)||null;           // petakan manual diutamakan
        else if(IMP&&IMP.autoCreate&&l.sku)prod=await ensureProductForSku(l.sku,l.qty>0?l.lineRev/l.qty:0); // opsi: buat produk baru
      }
      if(prod)items.push({prodId:prod.id,qty:l.qty,unitPrice:l.qty>0?l.lineRev/l.qty:0,lineRev:l.lineRev});
      else other.push({sku:l.sku,amount:l.lineRev});
    }
    let totalCOGS=0,totalRev=0,short=0;
    items.forEach(it=>{const r=resolveOut(it.prodId,it.qty);const pkg=calcItemPkgCost(it.prodId,it.qty);totalCOGS+=r.tot+pkg;totalRev+=it.lineRev;if(r.short>0)short+=r.short;});
    // Polymailer paket (1 Order ID = 1 paket): dihitung dari total muatan semua item, biaya dibebankan ke item pertama.
    const ship=calcShip(items);totalCOGS+=ship.cost;
    const odate=o.date||new Date().toISOString().split('T')[0];
    if(items.length){
      const baseBody={channel:'ecommerce',order_date:odate,reference:o.orderId,customer_name:o.platform==='tiktok'?'TikTok':'Shopee',total_cogs:totalCOGS,total_revenue:totalRev};
      // Tandai batch import (buat Riwayat Import → hapus per batch). Fallback bila kolom belum ada (migrasi belum jalan).
      let orderR;
      try{orderR=await api('yanz_sales_orders',{method:'POST',headers:{'Prefer':'return=representation'},body:JSON.stringify({...baseBody,import_batch_id:batchId||null,import_file:fileName||null})});}
      catch(e){orderR=await api('yanz_sales_orders',{method:'POST',headers:{'Prefer':'return=representation'},body:JSON.stringify(baseBody)});}
      const orderId=orderR[0].id;
      for(let idx=0;idx<items.length;idx++){
        const it=items[idx],isFirst=idx===0;
        const {used,tot:prodCost,avg}=resolveOut(it.prodId,it.qty);
        let pkgCost=calcItemPkgCost(it.prodId,it.qty);
        if(isFirst)pkgCost+=ship.cost; // biaya polymailer paket dibebankan ke item pertama → ikut COGS laporan (Σ order_items.cogs_total)
        const itemR=await api('yanz_order_items',{method:'POST',headers:{'Prefer':'return=representation'},body:JSON.stringify({order_id:orderId,product_id:it.prodId,qty:it.qty,sell_price:it.unitPrice,cogs_product:prodCost,cogs_packaging:pkgCost,cogs_total:prodCost+pkgCost,order_ref:o.orderId,nsa_status:'pending'})});
        const itemId=itemR[0].id;
        const jobs=[];
        const patchBatch=(u)=>{const nr=num(u.b.qty_remaining)-u.take;const i=B.findIndex(b=>b.id===u.b.id);if(i>=0)B[i].qty_remaining=nr;jobs.push(api('yanz_purchase_batches?id=eq.'+u.b.id,{method:'PATCH',body:JSON.stringify({qty_remaining:nr})}));};
        used.forEach(patchBatch);
        jobs.push(api('yanz_stock_movements',{method:'POST',body:JSON.stringify({product_id:it.prodId,movement_type:'sale',qty:it.qty,cogs_per_unit:avg,total_cogs:prodCost,reference:o.orderId,movement_date:odate})}));
        const pkgList=getBOMForProduct(it.prodId).filter(b=>b.channel==='ecommerce'||b.channel==='both').map(bom=>({pkgId:bom.packaging_id,qty:calcBOMUsage(bom.id,it.qty)}));
        for(const pkg of pkgList){
          if(pkg.qty<=0)continue;
          const pkgFifo=fifoDeduct(pkg.pkgId,pkg.qty);
          jobs.push(api('yanz_order_packaging',{method:'POST',body:JSON.stringify({order_id:orderId,order_item_id:itemId,packaging_id:pkg.pkgId,qty_used:pkg.qty,cogs_per_unit:fifoCostOf(pkg.pkgId),cogs_total:pkgFifo.tot,source:'bom'})}));
          pkgFifo.used.forEach(patchBatch);
        }
        if(isFirst&&ship.list.length)deductShip(orderId,itemId,ship.list,jobs,patchBatch); // polymailer seluruh paket
        await Promise.all(jobs);
      }
    }
    for(const oi of other){
      if(oi.amount<=0)continue;
      const oiBody={income_date:odate,category:OI_CAT,amount:oi.amount,account_id:(ACCOUNTS[0]&&ACCOUNTS[0].id)||null,description:o.platform+' · SKU '+oi.sku,reference:o.orderId};
      // Tandai batch import di Other Income juga → muncul di Riwayat Import & bisa dihapus per batch. Fallback bila kolom belum ada (migrasi belum jalan).
      try{await api('yanz_other_income',{method:'POST',body:JSON.stringify({...oiBody,import_batch_id:batchId||null,import_file:fileName||null})});}
      catch(e){try{await api('yanz_other_income',{method:'POST',body:JSON.stringify(oiBody)});}catch(e2){console.warn('other_income gagal',oi.sku,e2.message);}}
    }
    return {short,otherCount:other.length};
  }

  async function commitImport(){
    if(!IMP){toast('Belum ada file diparse');return;}
    const orders=[...IMP.auto,...IMP.cod.filter(o=>o.ready&&o._approve)];
    if(!orders.length){toast('Tidak ada order untuk dicommit');return;}
    orders.sort((a,b)=>String(a.date||'').localeCompare(String(b.date||''))); // kronologis → FIFO benar
    const st=document.getElementById('imp-commit-st');
    // ID batch unik untuk sesi import ini → tercatat di tiap order supaya bisa dihapus per batch di Riwayat Import.
    const batchId='imp_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,7);
    const fileName=IMP.fileName||'';
    let done=0,shortTot=0,otherTot=0,fail=0,skipTot=0;
    for(const o of orders){
      try{const r=await recordOrder(o,batchId,fileName);shortTot+=r.short;otherTot+=r.otherCount;if(r.skipped)skipTot++;}
      catch(e){fail++;console.error('Import order gagal',o.orderId,e);}
      done++;if(st)st.textContent='Menyimpan… '+done+'/'+orders.length;
    }
    try{M=await api('yanz_stock_movements?order=created_at.desc&limit=100');}catch(e){}
    toast('✓ Import selesai: '+(done-fail-skipTot)+' order baru'+(skipTot?', '+skipTot+' dilewati (Order ID sudah ada)':'')+(fail?', '+fail+' gagal':'')+(otherTot?', '+otherTot+' SKU→Other Income':'')+(shortTot?', ⚠️ '+shortTot.toFixed(1)+' unit stok kurang':''));
    IMP=null;
    const box=document.getElementById('imp-preview');if(box)box.innerHTML='<div style="color:#16A34A;padding:10px">✓ Import selesai. Upload file berikutnya atau buka tab Stok untuk cek hasil.</div>';
    await loadAll();renderImportBatches();
  }

  // Reset: hapus SEMUA penjualan ecommerce + Other Income hasil import (SKU tak dikenal) + kembalikan stok (B2B aman, NSA-matched dilewati)
  async function deleteAllEcommerceSales(){
    if(role!=='owner'){toast('❌ Hanya Owner');return;}
    let refs=[];
    try{const r=await api('yanz_sales_orders?channel=eq.ecommerce&select=reference');refs=[...new Set(r.map(x=>x.reference).filter(Boolean))];}catch(e){toast('❌ '+e.message);return;}
    // Other Income hasil import (SKU tak dikenal) juga bagian dari data import ecommerce → ikut direset.
    let oiRows=[];
    try{oiRows=await api('yanz_other_income?category=eq.'+encodeURIComponent(OI_CAT)+'&select=id');}catch(e){}
    if(!refs.length&&!oiRows.length){toast('Tidak ada penjualan / import ecommerce untuk dihapus');return;}
    if(!confirm('⚠️ HAPUS SEMUA data import ecommerce?\n\n• '+refs.length+' Order ID penjualan → stok DIKEMBALIKAN (reverse FIFO)\n• '+oiRows.length+' baris Other Income (SKU tak terdaftar)\n• B2B TIDAK tersentuh\n• Order yang sudah ter-match NSA DILEWATI\n• TIDAK BISA DI-UNDO\n\nLanjut?'))return;
    const st=document.getElementById('imp-status');
    let done=0,del=0,skipped=0;
    for(const ref of refs){
      try{
        const orders=await api('yanz_sales_orders?channel=eq.ecommerce&reference=eq.'+encodeURIComponent(ref)+'&select=id');
        let items=[];
        for(const o of orders){try{const its=await api('yanz_order_items?order_id=eq.'+o.id+'&select=id,product_id,qty,nsa_status');items=items.concat(its);}catch(e){}}
        if(items.some(it=>it.nsa_status==='matched')){skipped++;done++;if(st)st.innerHTML='🗑️ Menghapus… '+done+'/'+refs.length+' ('+skipped+' dilewati NSA)';continue;}
        for(const it of items){const prod=P.find(p=>p.id===it.product_id);if(prod&&prod.is_bundle){for(const c of BUNDLES.filter(b=>b.bundle_id===it.product_id))await restoreToBatches(c.component_id,num(it.qty)*num(c.qty_per_bundle));}else{await restoreToBatches(it.product_id,num(it.qty));}}
        for(const o of orders){let pkgs=[];try{pkgs=await api('yanz_order_packaging?order_id=eq.'+o.id+'&select=packaging_id,qty_used');}catch(e){}for(const pk of pkgs)await restoreToBatches(pk.packaging_id,num(pk.qty_used));}
        try{await api('yanz_stock_movements?reference=eq.'+encodeURIComponent(ref),{method:'DELETE'});}catch(e){}
        for(const o of orders)await api('yanz_sales_orders?id=eq.'+o.id,{method:'DELETE'});
        del++;
      }catch(e){console.error('hapus gagal',ref,e);}
      done++;if(st)st.innerHTML='🗑️ Menghapus… '+done+'/'+refs.length;
    }
    // Other Income import tak punya cash movement / stok (kas dari NSA) → cukup hapus barisnya.
    let delOi=0;
    for(const oi of oiRows){try{await api('yanz_other_income?id=eq.'+oi.id,{method:'DELETE'});delOi++;}catch(e){console.error('hapus OI gagal',oi.id,e);}}
    toast('✓ '+del+' penjualan + '+delOi+' Other Income dihapus & stok dikembalikan'+(skipped?', '+skipped+' dilewati (NSA)':''));
    if(st)st.innerHTML='<span style="color:#16A34A">✓ Reset selesai: '+del+' order + '+delOi+' Other Income dihapus'+(skipped?', '+skipped+' dilewati NSA':'')+'. Sekarang import Excel.</span>';
    await loadAll();renderImportBatches();
  }

  // Hapus 1 order ecommerce: kembalikan stok (produk + packaging, bundle-aware), lewati kalau sudah match NSA.
  // return 'skipped' | 'deleted'
  async function _purgeEcomOrder(o){
    let items=[];try{items=await api('yanz_order_items?order_id=eq.'+o.id+'&select=id,product_id,qty,nsa_status');}catch(e){}
    if(items.some(it=>it.nsa_status==='matched'))return 'skipped';
    for(const it of items){const prod=P.find(p=>p.id===it.product_id);if(prod&&prod.is_bundle){for(const c of BUNDLES.filter(b=>b.bundle_id===it.product_id))await restoreToBatches(c.component_id,num(it.qty)*num(c.qty_per_bundle));}else{await restoreToBatches(it.product_id,num(it.qty));}}
    let pkgs=[];try{pkgs=await api('yanz_order_packaging?order_id=eq.'+o.id+'&select=packaging_id,qty_used');}catch(e){}
    for(const pk of pkgs)await restoreToBatches(pk.packaging_id,num(pk.qty_used));
    if(o.reference){try{await api('yanz_stock_movements?reference=eq.'+encodeURIComponent(o.reference),{method:'DELETE'});}catch(e){}}
    await api('yanz_sales_orders?id=eq.'+o.id,{method:'DELETE'});
    return 'deleted';
  }

  // Platform dari deskripsi Other Income import ("tiktok · SKU xxx") → label rapi.
  function _oiPlatform(desc){
    const first=String(desc||'').split('·')[0].trim().toLowerCase();
    if(first==='tiktok')return 'TikTok';
    if(first==='shopee')return 'Shopee';
    return '—';
  }

  // ── RIWAYAT IMPORT (hapus per batch) — gabungan Penjualan (sales order) + Other Income (SKU tak dikenal) ──
  async function renderImportBatches(){
    const box=document.getElementById('imp-hist-list');if(!box)return;
    // 1) Sales order ecommerce. Coba dgn kolom batch; fallback tanpa kolom (migrasi belum jalan) supaya tak dead-end.
    let soRows=[];
    try{soRows=await api('yanz_sales_orders?channel=eq.ecommerce&select=id,reference,order_date,total_revenue,customer_name,created_at,import_batch_id,import_file&order=created_at.desc&limit=5000');}
    catch(e){try{soRows=await api('yanz_sales_orders?channel=eq.ecommerce&select=id,reference,order_date,total_revenue,customer_name,created_at&order=created_at.desc&limit=5000');}catch(e2){box.innerHTML='<div style="font-size:12px;color:#DC2626">❌ '+e2.message+'</div>';return;}}
    // 2) Other Income hasil import (SKU tak dikenal). Sama: coba dgn kolom batch, fallback tanpa.
    let oiRows=[];
    try{oiRows=await api('yanz_other_income?category=eq.'+encodeURIComponent(OI_CAT)+'&select=id,reference,income_date,amount,description,created_at,import_batch_id,import_file&order=created_at.desc&limit=5000');}
    catch(e){try{oiRows=await api('yanz_other_income?category=eq.'+encodeURIComponent(OI_CAT)+'&select=id,reference,income_date,amount,description,created_at&order=created_at.desc&limit=5000');}catch(e2){oiRows=[];}}
    if(!soRows.length&&!oiRows.length){box.innerHTML='<div style="font-size:12px;color:#888;padding:6px">Belum ada import ecommerce.</div>';return;}
    const groups=new Map();
    const gget=(key,plat)=>{if(!groups.has(key))groups.set(key,{key,file:null,platform:plat||'—',orders:0,oiCount:0,rev:0,oiRev:0,last:null,dmin:null,dmax:null});return groups.get(key);};
    const bump=(g,t,d)=>{if(t&&(!g.last||t>g.last))g.last=t;if(d){if(!g.dmin||d<g.dmin)g.dmin=d;if(!g.dmax||d>g.dmax)g.dmax=d;}};
    for(const o of soRows){
      const key=o.import_batch_id||('__legacy__::'+(o.customer_name||'?'));
      const g=gget(key,o.customer_name||'—');
      if(o.import_file&&!g.file)g.file=o.import_file;
      g.orders++;g.rev+=num(o.total_revenue);bump(g,o.created_at,o.order_date);
    }
    for(const o of oiRows){
      const plat=_oiPlatform(o.description);
      const key=o.import_batch_id||('__legacyoi__::'+plat);
      const g=gget(key,plat);
      if(o.import_file&&!g.file)g.file=o.import_file;
      g.oiCount++;g.oiRev+=num(o.amount);g.rev+=num(o.amount);bump(g,o.created_at,o.income_date);
    }
    const arr=[...groups.values()].sort((a,b)=>String(b.last||'').localeCompare(String(a.last||'')));
    let h='<div class="tw"><table><thead><tr><th>Waktu Import</th><th>File</th><th>Platform</th><th style="text-align:center">Order</th><th style="text-align:right">Revenue</th><th>Rentang tgl order</th><th></th></tr></thead><tbody>';
    for(const g of arr){
      const legacy=g.key.indexOf('__legacy')===0;
      const when=(legacy||!g.last)?'—':new Date(g.last).toLocaleString('id-ID',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
      const fileTxt=legacy?'<em style="color:#888">Import lama (sebelum fitur riwayat)</em>':(g.file?g.file:'(tanpa nama file)');
      const rentang=g.dmin?(g.dmin===g.dmax?fd(g.dmin):fd(g.dmin)+' – '+fd(g.dmax)):'—';
      const plat=g.platform==='TikTok'?'🎵 TikTok':g.platform==='Shopee'?'🛍️ Shopee':g.platform;
      const cntCell=g.orders+(g.oiCount?'<div style="font-size:10px;color:#D97706">+'+g.oiCount+' OI</div>':'');
      const revCell=rp(g.rev)+(g.oiRev?'<div style="font-size:10px;color:#D97706">OI '+rp(g.oiRev)+'</div>':'');
      h+=`<tr><td style="font-size:12px;white-space:nowrap">${when}</td><td style="font-size:12px;max-width:220px;overflow:hidden;text-overflow:ellipsis">${fileTxt}</td><td style="font-size:12px;white-space:nowrap">${plat}</td><td style="text-align:center">${cntCell}</td><td style="text-align:right;white-space:nowrap">${revCell}</td><td style="font-size:12px;white-space:nowrap">${rentang}</td><td><button class="btn btn-d btn-sm" onclick="inv.deleteImportBatch('${g.key.replace(/'/g,"")}')">🗑️ Hapus batch</button></td></tr>`;
    }
    h+='</tbody></table></div>';
    if(oiRows.length)h+='<p style="font-size:11px;color:#92400E;margin-top:8px;line-height:1.5">⚠️ <strong>OI</strong> = Other Income (SKU tak terdaftar): baris ini tercatat sebagai Other Income, bukan Penjualan, karena SKU-nya belum ada di master produk saat import. Agar tercatat sebagai <strong>Penjualan</strong>, petakan/daftarkan SKU dulu atau biarkan opsi <em>"Buat produk baru otomatis"</em> tetap tercentang saat import.</p>';
    box.innerHTML=h;
  }

  async function deleteImportBatch(key){
    if(role!=='owner'){toast('❌ Hanya Owner');return;}
    const SO='yanz_sales_orders?channel=eq.ecommerce&';
    const OI='yanz_other_income?category=eq.'+encodeURIComponent(OI_CAT)+'&';
    const tryGet=async(...urls)=>{for(const u of urls){try{return await api(u);}catch(e){}}return [];};
    let orders=[],ois=[],label;
    if(key.indexOf('__legacyoi__::')===0){                 // Other Income lama (belum ada kolom batch), dikelompokkan per platform
      const platRaw=key.slice('__legacyoi__::'.length),platLC=platRaw.toLowerCase();label='Import lama '+platRaw+' (Other Income)';
      ois=await tryGet(OI+'import_batch_id=is.null&description=ilike.'+encodeURIComponent(platLC)+'*&select=id',OI+'description=ilike.'+encodeURIComponent(platLC)+'*&select=id');
    }else if(key.indexOf('__legacy__::')===0){             // Sales order lama (belum ada kolom batch), per platform
      const plat=key.slice('__legacy__::'.length);label='Import lama '+plat;
      orders=await tryGet(SO+'import_batch_id=is.null&customer_name=eq.'+encodeURIComponent(plat)+'&select=id,reference',SO+'customer_name=eq.'+encodeURIComponent(plat)+'&select=id,reference');
    }else{                                                  // Batch normal → hapus sales order + Other Income yg berbagi batch id
      label='batch ini';
      orders=await tryGet(SO+'import_batch_id=eq.'+encodeURIComponent(key)+'&select=id,reference');
      ois=await tryGet(OI+'import_batch_id=eq.'+encodeURIComponent(key)+'&select=id');
    }
    if(!orders.length&&!ois.length){toast('Batch kosong / sudah terhapus');renderImportBatches();return;}
    if(!confirm('⚠️ Hapus '+orders.length+' order + '+ois.length+' baris Other Income dari '+label+'?\n\n• Stok DIKEMBALIKAN (reverse FIFO)\n• Order yang sudah match NSA DILEWATI\n• B2B tak tersentuh\n• TIDAK BISA DI-UNDO\n\nLanjut?'))return;
    const st=document.getElementById('imp-status');
    let done=0,del=0,skipped=0;
    for(const o of orders){
      try{const res=await _purgeEcomOrder(o);if(res==='skipped')skipped++;else del++;}
      catch(e){console.error('hapus batch gagal',o.reference,e);}
      done++;if(st)st.innerHTML='🗑️ Menghapus… '+done+'/'+orders.length+(skipped?' ('+skipped+' dilewati NSA)':'');
    }
    let delOi=0;
    for(const oi of ois){try{await api('yanz_other_income?id=eq.'+oi.id,{method:'DELETE'});delOi++;}catch(e){console.error('hapus OI gagal',oi.id,e);}}
    toast('✓ '+del+' order + '+delOi+' Other Income dihapus & stok dikembalikan'+(skipped?', '+skipped+' dilewati (NSA)':''));
    if(st)st.innerHTML='<span style="color:#16A34A">✓ '+del+' order + '+delOi+' Other Income dihapus'+(skipped?', '+skipped+' dilewati NSA':'')+'.</span>';
    await loadAll();renderImportBatches();
  }

// ── MODULE: Cash Accounts (Sub-fase 6.3) — owner-only ────────────────────────
(function(){
  const api=(...a)=>window.YANZ.api(...a);
  const toast=(...a)=>window.YANZ.toast(...a);
  const rp=n=>window.YANZ.fmt.rp(n);
  const rpShort=n=>window.YANZ.fmt.rpShort(n);
  const fd=d=>window.YANZ.fmt.fd(d);
  const num=n=>window.YANZ.fmt.num(n);

  const TABS=['accounts','transfer','movements','payables','settings'];

  let role='owner';
  let ACCOUNTS=[],MOVEMENTS=[],SETTINGS={},PAYABLES=[],PRODUCTS=[],MANUAL_PAYABLES=[];
  let _focusHandler=null;
  let _lastRefresh=0;

  const rootEl=()=>document.querySelector('.module-cash');

  async function loadAll(){
    _lastRefresh=Date.now();
    setDB(false,'Menghubungkan…');
    try{
      [ACCOUNTS,MOVEMENTS]=await Promise.all([
        api('yanz_cash_accounts?is_active=eq.true&order=display_order,account_name'),
        api('yanz_cash_movements?order=movement_date.desc,created_at.desc&limit=500')
      ]);
      // Hutang usaha — butuh kolom payment_* (migration yanz_payables_tables.sql).
      // Dibungkus terpisah supaya modul Cash tetap jalan kalau migration belum dijalankan.
      try{
        [PAYABLES,PRODUCTS]=await Promise.all([
          api('yanz_purchase_batches?payment_status=eq.unpaid&order=payment_due_date'),
          api('yanz_products?select=id,sku,name,unit')
        ]);
      }catch(e){PAYABLES=[];PRODUCTS=[];console.warn('Payables belum aktif (jalankan migration):',e.message);}
      // Hutang manual (input owner) — tabel terpisah yanz_manual_payables (migration). Defensif.
      try{MANUAL_PAYABLES=await api('yanz_manual_payables?status=eq.unpaid&order=due_date.asc.nullslast');}
      catch(e){MANUAL_PAYABLES=[];console.warn('Hutang manual belum aktif (jalankan migration):',e.message);}
      const setArr=await api('yanz_finance_settings');
      SETTINGS={};setArr.forEach(s=>{SETTINGS[s.setting_key]=s.setting_value;});
      setDB(true,'Terhubung ✓ — '+ACCOUNTS.length+' akun · '+MOVEMENTS.length+' mutasi · '+PAYABLES.length+' hutang');
      fillSelects();
      renderAll();
      loadSettingsForm();
    }catch(e){setDB(false,'❌ '+e.message);console.error(e);}
  }

  function fillSelects(){
    const opts=ACCOUNTS.map(a=>`<option value="${a.id}">${a.account_name}</option>`).join('');
    ['tf-from','tf-to'].forEach(id=>{const e=document.getElementById(id);if(e)e.innerHTML='<option value="">— Pilih akun —</option>'+opts;});
    const mv=document.getElementById('mv-account');if(mv)mv.innerHTML='<option value="">Semua akun</option>'+opts;
    const mp=document.getElementById('mp-account');if(mp)mp.innerHTML='<option value="">— Tidak ada (hutang non-tunai) —</option>'+opts;
  }

  function loadSettingsForm(){
    const set=(id,val)=>{const e=document.getElementById(id);if(e)e.value=val;};
    set('set-threshold',SETTINGS.min_cash_threshold||'');
    set('set-staff-limit',SETTINGS.staff_expense_limit||'');
    set('set-cutoff',SETTINGS.cutoff_date||'');
    api('yanz_opening_balances?order=cutoff_date.desc&limit=1').then(arr=>{
      if(arr.length){const e=document.getElementById('set-retained');if(e)e.value=arr[0].retained_earnings||0;}
    }).catch(()=>{});
  }

  function renderAll(){renderAccounts();renderRecentMovements();renderMovements();renderPayables();checkCashWarning();}

  // ── HUTANG USAHA (Accounts Payable) ──
  function payableAmount(b){return num(b.qty_purchased)*num(b.landed_cost_per_unit);}
  function renderPayables(){
    const el=document.getElementById('payables-list');if(!el)return;
    const today=new Date();today.setHours(0,0,0,0);
    // Gabung hutang dari PO (purchase_batches) + hutang manual (owner) → 1 daftar & 1 total.
    const items=[];
    PAYABLES.forEach(b=>{const prod=PRODUCTS.find(p=>p.id===b.product_id);items.push({type:'batch',id:b.id,title:prod?.name||'–',sku:prod?.sku||'',amount:payableAmount(b),due:b.payment_due_date||null,meta:`${b.qty_purchased} ${prod?.unit||''} · PO ${fd(b.po_date)}${b.supplier_name?' · '+b.supplier_name:''}`,method:b.payment_method});});
    MANUAL_PAYABLES.forEach(m=>{
      const amt=num(m.amount),rate=num(m.interest_rate),per=m.interest_period==='year'?'thn':'bln';
      const parts=[];
      if(m.description)parts.push(m.description);
      if(m.incurred_date)parts.push('sejak '+fd(m.incurred_date));
      if(rate>0){const monthly=m.interest_period==='year'?amt*rate/100/12:amt*rate/100;parts.push(`bunga ${rate}%/${per} ≈ ${rp(monthly)}/bln`);}
      items.push({type:'manual',id:m.id,title:m.creditor||'(tanpa nama)',sku:'',amount:amt,due:m.due_date||null,meta:parts.join(' · '),method:'manual'});
    });
    items.sort((a,b)=>new Date(a.due||'9999')-new Date(b.due||'9999'));
    const total=items.reduce((s,i)=>s+i.amount,0);
    const overdue=items.filter(i=>i.due&&new Date(i.due)<today);
    const set=(id,v)=>{const e=document.getElementById(id);if(e)e.textContent=v;};
    set('pay-total-amt',rp(total));
    set('pay-total-sub',`${items.length} hutang${overdue.length?` · ${overdue.length} lewat tempo`:''}`);
    if(!items.length){el.innerHTML='<div class="empty">✓ Tidak ada hutang usaha.</div>';return;}
    el.innerHTML=items.map(i=>{
      const diff=i.due?Math.ceil((new Date(i.due)-today)/(1000*60*60*24)):null;
      const dueLabel=diff===null?'(tanpa tempo)':diff<0?`Lewat ${Math.abs(diff)} hari`:diff===0?'Jatuh tempo hari ini':`${diff} hari lagi`;
      const dueColor=diff===null?'#888':diff<0?'#DC2626':diff<=7?'#D97706':'#16A34A';
      const badge=i.type==='manual'?'<span class="bx" style="background:#EEF2FF;color:#4338CA">👤 Manual</span>':(i.method==='credit_card'?'<span class="bx bb">💳 Kartu Kredit</span>':'<span class="bx ba">🗓️ Tempo</span>');
      const delBtn=i.type==='manual'?`<button class="btn btn-d btn-sm" onclick="cash.deleteManualPayable('${i.id}')" title="Hapus hutang manual">×</button>`:'';
      return`<div class="movement-row">
        <div class="mv-icon out">${i.type==='manual'?'👤':'📦'}</div>
        <div>
          <div style="font-weight:600">${i.title} ${i.sku?`<span class="bx bgr">${i.sku}</span>`:''} ${badge}</div>
          <div style="font-size:11px;color:#888">${i.meta}${i.due?' · Jatuh tempo: '+fd(i.due):''}</div>
        </div>
        <div style="text-align:right"><div class="mv-amount out">${rp(i.amount)}</div><div style="font-size:11px;font-weight:700;color:${dueColor}">${dueLabel}</div></div>
        <button class="btn btn-p btn-sm" onclick="cash.openPayDebtModal('${i.id}','${i.type}')">💰 Bayar</button>
        ${delBtn}
      </div>`;
    }).join('');
  }

  function openPayDebtModal(id,type){
    if(role!=='owner'){toast('❌ Hanya Owner');return;}
    type=type||'batch';
    let infoHTML='';
    if(type==='manual'){
      const m=MANUAL_PAYABLES.find(x=>x.id===id);if(!m)return;
      infoHTML=`<strong>${m.creditor||'(tanpa nama)'}</strong> — Hutang Manual${m.description?'<br>'+m.description:''}<br>Jumlah: <strong>${rp(num(m.amount))}</strong>${m.due_date?' · Jatuh tempo: '+fd(m.due_date):''}`;
    }else{
      const b=PAYABLES.find(x=>x.id===id);if(!b)return;const prod=PRODUCTS.find(p=>p.id===b.product_id);
      infoHTML=`<strong>${prod?.name||'–'}</strong> — ${b.qty_purchased} ${prod?.unit||''}<br>Jumlah hutang: <strong>${rp(payableAmount(b))}</strong> · Jatuh tempo: ${fd(b.payment_due_date)}${b.supplier_name?' · '+b.supplier_name:''}`;
    }
    const info=document.getElementById('debt-info');if(info)info.innerHTML=infoHTML;
    const opts=ACCOUNTS.map(a=>`<option value="${a.id}" ${a.is_default?'selected':''}>${a.account_name}</option>`).join('');
    const accSel=document.getElementById('debt-account');if(accSel)accSel.innerHTML='<option value="">— Pilih akun —</option>'+opts;
    const set=(id2,v)=>{const e=document.getElementById(id2);if(e)e.value=v;};
    set('debt-batch-id',id);set('debt-type',type);set('debt-date',new Date().toISOString().split('T')[0]);
    const stt=document.getElementById('debt-status');if(stt)stt.textContent='';
    const modal=document.getElementById('debt-modal');if(modal)modal.style.display='flex';
  }
  function closeDebtModal(){const e=document.getElementById('debt-modal');if(e)e.style.display='none';}

  async function payDebt(){
    const id=document.getElementById('debt-batch-id').value;
    const type=document.getElementById('debt-type').value||'batch';
    const accId=document.getElementById('debt-account').value;
    const date=document.getElementById('debt-date').value;
    const st=document.getElementById('debt-status');
    if(!accId||!date){if(st){st.textContent='⚠️ Pilih akun & tanggal bayar';st.style.color='#D97706';}return;}
    if(st){st.textContent='Memproses…';st.style.color='#999';}
    try{
      if(type==='manual'){
        const m=MANUAL_PAYABLES.find(x=>x.id===id);if(!m)return;const amt=num(m.amount);
        await api('yanz_manual_payables?id=eq.'+id,{method:'PATCH',body:JSON.stringify({status:'paid',paid_date:date,paid_from_account_id:accId})});
        await api('yanz_cash_movements',{method:'POST',body:JSON.stringify({account_id:accId,movement_date:date,movement_type:'outflow',category:'debt_payment',amount:amt,description:`Bayar hutang manual: ${m.creditor||''}${m.description?' · '+m.description:''}`,reference:'PAYM-'+String(id).slice(0,8),source_type:'manual_payable',source_id:id})});
      }else{
        const b=PAYABLES.find(x=>x.id===id);if(!b)return;const prod=PRODUCTS.find(p=>p.id===b.product_id);const amt=payableAmount(b);
        await api('yanz_purchase_batches?id=eq.'+id,{method:'PATCH',body:JSON.stringify({payment_status:'paid',paid_date:date,paid_from_account_id:accId})});
        await api('yanz_cash_movements',{method:'POST',body:JSON.stringify({account_id:accId,movement_date:date,movement_type:'outflow',category:'inventory_purchase',amount:amt,description:`Bayar hutang ${prod?.name||''}${b.supplier_name?' · '+b.supplier_name:''}`,reference:'PAY-'+String(id).slice(0,8),source_type:'purchase',source_id:id})});
      }
      closeDebtModal();await loadAll();toast('Hutang dibayar ✓');
    }catch(e){if(st){st.textContent='❌ '+e.message;st.style.color='#DC2626';}}
  }

  // ── HUTANG MANUAL (input owner, jatuh tempo manual) ──
  async function addManualPayable(){
    if(role!=='owner'){toast('❌ Hanya Owner');return;}
    const st=document.getElementById('mp-status');
    const g=id=>{const e=document.getElementById(id);return e?e.value:'';};
    const creditor=g('mp-creditor').trim(),amount=num(g('mp-amount')),desc=g('mp-desc').trim();
    const incurred=g('mp-incurred')||null,due=g('mp-due')||null;
    const acctId=g('mp-account')||null,interest=num(g('mp-interest')),period=g('mp-interest-period')||'month';
    if(!creditor||amount<=0){if(st){st.textContent='⚠️ Isi pihak/pemberi hutang & jumlah (>0)';st.style.color='#D97706';}return;}
    if(st){st.textContent='Menyimpan…';st.style.color='#999';}
    try{
      const r=await api('yanz_manual_payables',{method:'POST',headers:{'Prefer':'return=representation'},body:JSON.stringify({creditor,description:desc||null,amount,incurred_date:incurred,due_date:due,status:'unpaid',interest_rate:interest||0,interest_period:interest>0?period:null,received_to_account_id:acctId,created_by:(window.YANZ&&window.YANZ.fullName)||'owner'})});
      const newId=r&&r[0]&&r[0].id;
      // Kalau dana pinjaman cair ke sebuah akun → catat KAS MASUK (inflow). Terhubung ke hutang (source_id) biar bisa ikut terhapus.
      if(acctId&&newId){
        await api('yanz_cash_movements',{method:'POST',body:JSON.stringify({account_id:acctId,movement_date:incurred||new Date().toISOString().split('T')[0],movement_type:'inflow',category:'debt_receipt',amount,description:`Terima hutang/pinjaman: ${creditor}${desc?' · '+desc:''}`,reference:'DEBT-'+String(newId).slice(0,8),source_type:'manual_payable',source_id:newId})});
      }
      ['mp-creditor','mp-amount','mp-desc','mp-incurred','mp-due','mp-interest'].forEach(id=>{const e=document.getElementById(id);if(e)e.value='';});
      const mpa=document.getElementById('mp-account');if(mpa)mpa.value='';

  // ── ACCOUNTS ──
  function calcAccountBalance(accId){
    const acc=ACCOUNTS.find(a=>a.id===accId);
    if(!acc)return 0;
    const mvs=MOVEMENTS.filter(m=>m.account_id===accId).slice().sort((x,y)=>new Date(x.movement_date)-new Date(y.movement_date)||new Date(x.created_at||0)-new Date(y.created_at||0));
    let bal=num(acc.initial_balance);
    mvs.forEach(m=>{
      if(m.movement_type==='inflow'||m.movement_type==='transfer_in')bal+=num(m.amount);
      else if(m.movement_type==='outflow'||m.movement_type==='transfer_out')bal-=num(m.amount);
      else if(m.movement_type==='adjustment')bal=num(m.amount);
    });
    return bal;
  }

      const balance=calcAccountBalance(a.id);
      totalCash+=balance;
      const typeIcon={bank:'🏦',cash:'💵',ewallet:'📱',other:'💳'}[a.account_type]||'💳';
      const typeName={bank:'Bank',cash:'Kas Tunai',ewallet:'E-Wallet',other:'Lainnya'}[a.account_type];
      return`<div class="acc-card ${a.is_default?'default':''}">
        <div class="acc-header">

          </div>
          <span class="acc-type-pill">${typeName}</span>

  function checkCashWarning(){
    const total=ACCOUNTS.reduce((s,a)=>s+calcAccountBalance(a.id),0);
    const threshold=num(SETTINGS.min_cash_threshold);
    const warn=document.getElementById('cash-warning');if(!warn)return;
    if(threshold>0&&total<threshold){
      warn.style.display='';
      warn.innerHTML=`<div class="warning-banner">⚠️ <div><strong>Total kas di bawah minimum threshold!</strong><br><span style="font-size:12px">Saat ini: ${rp(total)} · Threshold: ${rp(threshold)} · Selisih: ${rp(threshold-total)}</span></div></div>`;

  // ── TRANSFER ──
  async function submitTransfer(){
    const from=document.getElementById('tf-from').value;
    const to=document.getElementById('tf-to').value;
    const date=document.getElementById('tf-date').value;
    const amount=num(document.getElementById('tf-amount').value);
    const ref=document.getElementById('tf-ref').value;
    const notes=document.getElementById('tf-notes').value;
    const st=document.getElementById('tf-status');
    if(!from||!to){st.textContent='⚠️ Pilih akun sumber & tujuan';st.style.color='#D97706';return;}
    if(from===to){st.textContent='⚠️ Akun sumber & tujuan tidak boleh sama';st.style.color='#D97706';return;}
    if(!date||amount<=0){st.textContent='⚠️ Lengkapi tanggal & jumlah';st.style.color='#D97706';return;}
    const balFrom=calcAccountBalance(from);
    if(balFrom<amount){if(!confirm(`Saldo akun sumber (${rp(balFrom)}) kurang dari jumlah transfer (${rp(amount)}). Lanjutkan?`))return;}
    st.textContent='Memproses…';st.style.color='#999';
    try{
      const r1=await api('yanz_cash_movements',{method:'POST',headers:{'Prefer':'return=representation'},body:JSON.stringify({account_id:from,movement_date:date,movement_type:'transfer_out',amount,reference:ref||null,description:notes||'Transfer ke akun lain',related_account_id:to,source_type:'transfer'})});
      await api('yanz_cash_movements',{method:'POST',body:JSON.stringify({account_id:to,movement_date:date,movement_type:'transfer_in',amount,reference:ref||null,description:notes||'Transfer dari akun lain',related_account_id:from,source_type:'transfer',source_id:r1[0].id})});
      toast('Transfer berhasil ✓');st.textContent='✓ Tersimpan';st.style.color='#16A34A';
      resetTransfer();await loadAll();
    }catch(e){st.textContent='❌ '+e.message;st.style.color='#DC2626';}
  }
  function resetTransfer(){
    ['tf-from','tf-to','tf-amount','tf-ref','tf-notes'].forEach(id=>{const e=document.getElementById(id);if(e)e.value='';});

  function renderMovements(){
    const fa=document.getElementById('mv-account')?.value||'';
    const ft=document.getElementById('mv-type')?.value||'';
    const fp=parseInt(document.getElementById('mv-period')?.value||'30');
    const cut=new Date();cut.setDate(cut.getDate()-fp);cut.setHours(0,0,0,0);
    let list=MOVEMENTS.filter(m=>new Date(m.movement_date)>=cut);
    if(fa)list=list.filter(m=>m.account_id===fa);
    if(ft)list=list.filter(m=>m.movement_type===ft);
    const el=document.getElementById('movements-list');if(!el)return;
    if(!list.length){el.innerHTML='<div class="empty">Tidak ada mutasi dalam periode ini.</div>';return;}
    el.innerHTML=list.slice(0,100).map(m=>renderMovementRow(m)).join('');
  }
  function renderMovementRow(m){
    const acc=ACCOUNTS.find(a=>a.id===m.account_id);
    const isIn=m.movement_type==='inflow'||m.movement_type==='transfer_in';
    const isOut=m.movement_type==='outflow'||m.movement_type==='transfer_out';
    const isAdj=m.movement_type==='adjustment';
    const icon=isIn?'⬆️':isOut?'⬇️':'⚙️';
    const cls=isIn?'in':isOut?'out':'transfer';
    const typeLabel={inflow:'Masuk',outflow:'Keluar',transfer_in:'Transfer Masuk',transfer_out:'Transfer Keluar',adjustment:'Penyesuaian'}[m.movement_type];
    const relatedAcc=m.related_account_id?ACCOUNTS.find(a=>a.id===m.related_account_id):null;
    return`<div class="movement-row">
      <div class="mv-icon ${cls}">${icon}</div>
      <div>
        <div style="font-weight:600">${m.description||typeLabel}</div>
        <div style="font-size:11px;color:#888">${fd(m.movement_date)} · ${acc?.account_name||'–'}${relatedAcc?' → '+relatedAcc.account_name:''}${m.reference?' · Ref: '+m.reference:''}</div>
      </div>
      <div class="mv-amount ${cls}">${isAdj?'=':isIn?'+':isOut?'−':''}${rp(m.amount)}</div>
      <button class="btn btn-d btn-sm oo" onclick="cash.deleteMovement('${m.id}')" title="Hapus mutasi">×</button>
    </div>`;
  }
  async function deleteMovement(id){
    if(role!=='owner'){toast('❌ Hanya Owner');return;}
    const m=MOVEMENTS.find(x=>x.id===id);if(!m)return;
    if(m.source_type&&m.source_type!=='adjustment'&&m.source_type!=='transfer'&&m.source_type!=='manual'){
      if(!confirm(`⚠️ Mutasi ini berasal dari ${m.source_type}. Hapus dari sini hanya menghapus catatan, tidak menghapus transaksi sumbernya. Lanjutkan?`))return;
    }else{
      if(!confirm('Hapus mutasi ini?'))return;
    }
    try{
      if(m.movement_type==='transfer_out'||m.movement_type==='transfer_in'){
        const pair=MOVEMENTS.find(x=>(x.source_id===m.id||m.source_id===x.id)&&x.id!==m.id);
        if(pair)await api('yanz_cash_movements?id=eq.'+pair.id,{method:'DELETE'});
      }
      await api('yanz_cash_movements?id=eq.'+id,{method:'DELETE'});
      await loadAll();toast('Mutasi dihapus ✓');
    }catch(e){toast('❌ '+e.message);}
  }

// ── MODULE: Expense (Sub-fase 6.3) ───────────────────────────────────────────
(function(){
  const api=(...a)=>window.YANZ.api(...a);
  const toast=(...a)=>window.YANZ.toast(...a);
  const rp=n=>window.YANZ.fmt.rp(n);
  const rpShort=n=>window.YANZ.fmt.rpShort(n);
  const fd=d=>window.YANZ.fmt.fd(d);
  const num=n=>window.YANZ.fmt.num(n);
  const int=n=>parseInt(n)||0;

  let role='owner';
  let CATEGORIES=[],SUBCATEGORIES=[],EXPENSES=[],INCOME=[],FC_TEMPLATES=[],ACCOUNTS=[],SETTINGS={};
  let STAFF_LIMIT=300000;
  let _focusHandler=null;
  let _lastRefresh=0;

  const rootEl=()=>document.querySelector('.module-expense');

  async function loadAll(){
    _lastRefresh=Date.now();
    setDB(false,'Menghubungkan…');
    try{
      [CATEGORIES,SUBCATEGORIES,EXPENSES,INCOME,FC_TEMPLATES,ACCOUNTS]=await Promise.all([
        api('yanz_expense_categories?is_active=eq.true&order=display_order'),
        api('yanz_expense_subcategories?is_active=eq.true&order=display_order'),
        api('yanz_expenses?order=expense_date.desc,created_at.desc&limit=500'),
        api('yanz_other_income?order=income_date.desc&limit=200'),
        api('yanz_fixed_cost_templates?is_active=eq.true&order=day_of_month'),
        api('yanz_cash_accounts?is_active=eq.true&order=display_order')
      ]);
      const setArr=await api('yanz_finance_settings');
      SETTINGS={};setArr.forEach(s=>{SETTINGS[s.setting_key]=s.setting_value;});
      STAFF_LIMIT=num(SETTINGS.staff_expense_limit)||300000;
      setDB(true,'Terhubung ✓ — '+CATEGORIES.length+' kategori · '+SUBCATEGORIES.length+' subkat · '+EXPENSES.length+' expense');
      // Auto-generate FC bulan berjalan hanya oleh owner (hindari race kalau staff buka modul)
      if(role==='owner')await autoGenerateRecurringFC();
      fillSelects();
      renderAll();
    }catch(e){setDB(false,'❌ '+e.message);console.error(e);}
  }

  function fillSelects(){
    const catOpts=CATEGORIES.map(c=>`<option value="${c.id}">${c.category_name}</option>`).join('');
    const accOpts=ACCOUNTS.map(a=>`<option value="${a.id}" ${a.is_default?'selected':''}>${a.account_name}</option>`).join('');
    const setSel=(id,html,prefix='')=>{const e=document.getElementById(id);if(e)e.innerHTML=prefix+html;};
    setSel('exp-cat',catOpts,'<option value="">— Pilih kategori —</option>');
    setSel('exp-account',accOpts,'<option value="">— Pilih akun —</option>');
    setSel('h-cat',catOpts,'<option value="">Semua</option>');
    setSel('inc-account',accOpts,'<option value="">— Pilih akun —</option>');
    setSel('fc-cat',catOpts,'<option value="">— Pilih —</option>');
    setSel('fc-account',accOpts,'<option value="">— Pilih akun —</option>');
    const staffSubs=SUBCATEGORIES.filter(s=>s.is_staff_accessible);
    const staffOpts=staffSubs.map(s=>{const cat=CATEGORIES.find(c=>c.id===s.category_id);return `<option value="${s.id}">${cat?.category_name||''} → ${s.subcategory_name}</option>`;}).join('');
    setSel('sexp-sub',staffOpts,'<option value="">— Pilih jenis expense —</option>');
    setSel('sexp-account',accOpts,'<option value="">— Pilih akun —</option>');
    const sld=document.getElementById('staff-limit-display');if(sld)sld.textContent='Limit '+rpShort(STAFF_LIMIT);
  }

  // Gaji karyawan sering dibayar bulan berikutnya → saat pilih sub-kategori "Gaji",
  // munculkan pilihan "gaji untuk bulan apa" (default: bulan lalu).
  function onSubChange(){
    const sub=SUBCATEGORIES.find(s=>s.id===(document.getElementById('exp-sub')?.value||''));
    const isSalary=!!(sub&&/gaji/i.test(sub.subcategory_name||''));
    const wrap=document.getElementById('exp-salary-wrap');if(wrap)wrap.style.display=isSalary?'':'none';
    if(isSalary){const el=document.getElementById('exp-salary-month');if(el&&!el.value){const d=new Date();d.setMonth(d.getMonth()-1);el.value=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');}}
  }
  function onCatChange(){
    const cid=document.getElementById('exp-cat').value;
    const subs=SUBCATEGORIES.filter(s=>s.category_id===cid);
    const opts=subs.map(s=>`<option value="${s.id}">${s.subcategory_name} ${s.cost_type==='fixed'?'[FC]':'[VC]'}</option>`).join('');
    const sub=document.getElementById('exp-sub');if(sub)sub.innerHTML='<option value="">— Pilih sub-kategori —</option>'+opts;
    const hOpts=subs.map(s=>`<option value="${s.id}">${s.subcategory_name}</option>`).join('');
    const hsub=document.getElementById('h-sub');if(hsub)hsub.innerHTML='<option value="">Semua</option>'+hOpts;
    onSubChange();
  }
  function onFCCatChange(){
    const cid=document.getElementById('fc-cat').value;
    const subs=SUBCATEGORIES.filter(s=>s.category_id===cid);
    const opts=subs.map(s=>`<option value="${s.id}">${s.subcategory_name}</option>`).join('');
    const fcsub=document.getElementById('fc-sub');if(fcsub)fcsub.innerHTML='<option value="">— Pilih —</option>'+opts;
  }
  function checkStaffLimit(){
    const amount=num(document.getElementById('sexp-amount').value);
    const warn=document.getElementById('staff-limit-warning');if(!warn)return;
    if(amount>STAFF_LIMIT){warn.style.display='';warn.innerHTML=`⚠️ <strong>Melebihi limit!</strong> Maksimum Rp ${STAFF_LIMIT.toLocaleString('id-ID')} per transaksi. Hubungi Owner untuk transaksi yang lebih besar.`;}
    else warn.style.display='none';
  }

  function renderAll(){
    renderDashboard();renderHistory();renderRecurring();renderIncome();renderCategories();renderStaffRecent();renderStaffHistory();
    applyRoleVisibility();
  }

  // ── DASHBOARD ──
  function renderDashboard(){
    const now=new Date();
    const monthStart=new Date(now.getFullYear(),now.getMonth(),1);
    const monthExp=EXPENSES.filter(e=>new Date(e.expense_date)>=monthStart);
    const monthInc=INCOME.filter(i=>new Date(i.income_date)>=monthStart);
    const totalExp=monthExp.reduce((s,e)=>s+num(e.amount),0);
    const fcExp=monthExp.filter(e=>e.cost_type==='fixed').reduce((s,e)=>s+num(e.amount),0);
    const vcExp=monthExp.filter(e=>e.cost_type==='variable').reduce((s,e)=>s+num(e.amount),0);
    const totalInc=monthInc.reduce((s,i)=>s+num(i.amount),0);
    const set=(id,val,sub)=>{const e=document.getElementById(id);if(e)e.textContent=val;const s=document.getElementById(id+'-sub');if(s&&sub!==undefined)s.textContent=sub;};
    set('kpi-total',rpShort(totalExp),`${monthExp.length} transaksi bulan ini`);
    set('kpi-fc',FC_TEMPLATES.length+' aktif',`${rpShort(fcExp)} terealisasi`);
    set('kpi-vc',rpShort(vcExp),`${monthExp.filter(e=>e.cost_type==='variable').length} transaksi`);
    set('kpi-inc',rpShort(totalInc),`${monthInc.length} pemasukan lain-lain`);
    const byCat={};
    monthExp.forEach(e=>{if(!byCat[e.category_id])byCat[e.category_id]=0;byCat[e.category_id]+=num(e.amount);});
    const sorted=Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
    const maxAmt=Math.max(1,...Object.values(byCat));
    const el=document.getElementById('cat-breakdown');
    if(el){
      if(!sorted.length)el.innerHTML='<div class="empty">Belum ada expense bulan ini.</div>';
      else el.innerHTML=sorted.map(([cid,amt])=>{
        const cat=CATEGORIES.find(c=>c.id===cid);
        const pct=amt/maxAmt*100;
        return`<div style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px"><strong>${cat?.category_name||'–'}</strong><span style="font-weight:700;color:#DC2626">${rp(amt)}</span></div><div style="height:6px;background:#F0EDE8;border-radius:3px;overflow:hidden"><div style="height:100%;width:${pct}%;background:#DC2626"></div></div></div>`;
      }).join('');
    }
    const recentEl=document.getElementById('recent-exp');
    if(recentEl){const recent=EXPENSES.slice(0,10);recentEl.innerHTML=recent.length?recent.map(e=>renderExpenseRow(e)).join(''):'<div class="empty">Belum ada expense.</div>';}
  }

  function renderExpenseRow(e){
    const cat=CATEGORIES.find(c=>c.id===e.category_id);
    const sub=SUBCATEGORIES.find(s=>s.id===e.subcategory_id);
    const acc=ACCOUNTS.find(a=>a.id===e.account_id);
    const byBadge=e.created_by==='staff'?'<span class="bx bb">Staff</span>':e.created_by==='system'?'<span class="bx bt">Auto</span>':'<span class="bx bgr">Owner</span>';
    const ctBadge=e.cost_type==='fixed'?'<span class="bx-fc bx">FC</span>':'<span class="bx-vc bx">VC</span>';
    return`<div class="exp-row">
      <div class="exp-icon">💸</div>
      <div>
        <div class="exp-detail">${e.description||sub?.subcategory_name||'–'}</div>
        <div class="exp-cat">${cat?.category_name||'–'} → ${sub?.subcategory_name||'–'} · ${fd(e.expense_date)} · ${acc?.account_name||'–'}</div>
      </div>
      <div>${ctBadge} ${byBadge}</div>
      <div class="exp-amount">−${rp(e.amount)}</div>
      <button class="btn btn-d btn-sm oo" onclick="exp.deleteExpense('${e.id}')">×</button>
    </div>`;
  }

  // ── HISTORY ──
  function renderHistory(){
    const fc=document.getElementById('h-cat')?.value||'';
    const fs=document.getElementById('h-sub')?.value||'';
    const fb=document.getElementById('h-by')?.value||'';
    const fp=parseInt(document.getElementById('h-period')?.value||'30');
    const cut=new Date();cut.setDate(cut.getDate()-fp);cut.setHours(0,0,0,0);
    let list=EXPENSES.filter(e=>new Date(e.expense_date)>=cut);
    if(fc)list=list.filter(e=>e.category_id===fc);
    if(fs)list=list.filter(e=>e.subcategory_id===fs);
    if(fb)list=list.filter(e=>e.created_by===fb);
    const el=document.getElementById('history-list');if(!el)return;
    if(!list.length){el.innerHTML='<div class="empty">Tidak ada expense dalam filter ini.</div>';return;}
    const total=list.reduce((s,e)=>s+num(e.amount),0);
    el.innerHTML=`<div style="background:#1C1C1A;color:#fff;padding:10px 14px;border-radius:8px;margin-bottom:10px;font-size:13px;display:flex;justify-content:space-between"><span>${list.length} transaksi</span><strong style="color:#E8FF5A">Total: ${rp(total)}</strong></div>`+list.slice(0,100).map(e=>renderExpenseRow(e)).join('');
  }

  // ── INPUT EXPENSE ──
  async function submitExpense(by){
    const isOwner=by==='owner';
    const st=document.getElementById(isOwner?'exp-status':'sexp-status');
    const g=(id)=>document.getElementById(id)?.value||'';
    const date=g(isOwner?'exp-date':'sexp-date');
    const subId=g(isOwner?'exp-sub':'sexp-sub');
    const amount=num(g(isOwner?'exp-amount':'sexp-amount'));
    const accId=g(isOwner?'exp-account':'sexp-account');
    const desc=g(isOwner?'exp-desc':'sexp-desc');
    const ref=g(isOwner?'exp-ref':'sexp-ref');
    const notes=isOwner?g('exp-notes'):'';
    const catId=isOwner?g('exp-cat'):'';
    const setMsg=(m,c='#999')=>{if(st){st.textContent=m;st.style.color=c;}};
    if(!date||!subId||!amount||!accId){setMsg('⚠️ Lengkapi tanggal, kategori, jumlah, akun','#D97706');return;}
    if(!isOwner&&amount>STAFF_LIMIT){setMsg(`⚠️ Melebihi limit Rp ${STAFF_LIMIT.toLocaleString('id-ID')}`,'#DC2626');return;}
    const sub=SUBCATEGORIES.find(s=>s.id===subId);
    if(!isOwner&&!sub?.is_staff_accessible){setMsg('⚠️ Sub-kategori ini tidak diizinkan untuk staff','#DC2626');return;}
    const finalCatId=catId||sub?.category_id;
    // Gaji karyawan: tandai bulan kinerja di deskripsi (dibayar bln berikutnya, tapi jelas gaji bln apa)
    let finalDesc=desc,accrualDate=null;
    if(isOwner&&sub&&/gaji/i.test(sub.subcategory_name||'')){
      const sm=g('exp-salary-month');
      if(sm){const p=sm.split('-');const mn=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'][(+p[1])-1];finalDesc='Gaji bln '+mn+' '+p[0]+(desc?' — '+desc:'');accrualDate=sm+'-01';}
    }
    setMsg('Menyimpan…');
    try{
      const expBody={
        expense_date:date,category_id:finalCatId,subcategory_id:subId,amount,account_id:accId,
        description:finalDesc||null,reference:ref||null,notes:notes||null,
        cost_type:sub?.cost_type||'variable',created_by:by
      };
      if(accrualDate)expBody.accrual_date=accrualDate; // gaji accrual: tampil di IS bln kinerja, kas tetap tgl bayar
      const r=await api('yanz_expenses',{method:'POST',headers:{'Prefer':'return=representation'},body:JSON.stringify(expBody)});
      await api('yanz_cash_movements',{method:'POST',body:JSON.stringify({
        account_id:accId,movement_date:date,movement_type:'outflow',category:'expense',amount,
        reference:ref||null,description:finalDesc||sub?.subcategory_name||'Expense',
        source_type:'expense',source_id:r[0].id,created_by:by
      })});
      toast('Expense tersimpan ✓');setMsg('✓ Tersimpan','#16A34A');
      if(isOwner)resetExpenseForm();else resetStaffForm();
      await loadAll();
    }catch(e){setMsg('❌ '+e.message,'#DC2626');}
  }

  async function autoGenerateRecurringFC(){
    const now=new Date();
    const currentMonth=now.getMonth();
    const currentYear=now.getFullYear();
    for(const fc of FC_TEMPLATES){
      const startD=new Date(fc.start_date);
      if(startD>now)continue;
      if(fc.end_date&&new Date(fc.end_date)<now)continue;
      const targetDay=Math.min(fc.day_of_month,new Date(currentYear,currentMonth+1,0).getDate());
      const targetDate=new Date(currentYear,currentMonth,targetDay);
      if(targetDate>now)continue;
      const existing=EXPENSES.find(e=>e.recurring_template_id===fc.id&&new Date(e.expense_date).getMonth()===currentMonth&&new Date(e.expense_date).getFullYear()===currentYear);
      if(existing)continue;
      try{
        const r=await api('yanz_expenses',{method:'POST',headers:{'Prefer':'return=representation'},body:JSON.stringify({
          expense_date:targetDate.toISOString().split('T')[0],
          category_id:fc.category_id,subcategory_id:fc.subcategory_id,
          amount:fc.amount,account_id:fc.account_id,
          description:fc.template_name+' (auto-generated)',
          cost_type:'fixed',is_recurring:true,recurring_template_id:fc.id,created_by:'system'
        })});
        await api('yanz_cash_movements',{method:'POST',body:JSON.stringify({
          account_id:fc.account_id,movement_date:targetDate.toISOString().split('T')[0],
          movement_type:'outflow',category:'fixed_cost',amount:fc.amount,
          description:fc.template_name+' (auto)',source_type:'expense',source_id:r[0].id
        })});
        await api('yanz_fixed_cost_templates?id=eq.'+fc.id,{method:'PATCH',body:JSON.stringify({last_generated_date:targetDate.toISOString().split('T')[0]})});
      }catch(e){console.error('FC auto-gen failed:',e);}
    }
  }

// ── MODULE: NSA Import (Sub-fase 6.3) — SheetJS + maker-checker ───────────────
(function(){
  const api=(...a)=>window.YANZ.api(...a);
  const toast=(...a)=>window.YANZ.toast(...a);
  const rp=n=>window.YANZ.fmt.rp(n);
  const rpShort=n=>window.YANZ.fmt.rpShort(n);
  const fd=d=>window.YANZ.fmt.fd(d);
  const num=n=>window.YANZ.fmt.num(n);

  const TABS=['import','dashboard','approval','history','review'];

  let ROLE=null;            // 'owner' | 'staff' — dari window.YANZ.role
  let CURRENT_STAFF=null;   // staff record (untuk submitted_by) saat ROLE='staff'
  let ACCOUNTS=[],ORDER_ITEMS=[],SETTLEMENTS=[],NSA_RECORDS=[];
  let parsedData=null;
  let _focusHandler=null;
  let _lastRefresh=0;

  const rootEl=()=>document.querySelector('.module-nsa');

  // ── ACCESS: identitas dari auth, akses via window.YANZ.canAccess('nsa') ──
  // CURRENT_STAFF tetap dimuat untuk nama submitter (submitted_by) di maker-checker.
  async function resolveAccess(){
    if(ROLE==='owner'){CURRENT_STAFF=null;return true;}
    const sid=window.YANZ.staffId;
    if(!sid)return false;
    try{
      const rows=await api('yanz_staff?id=eq.'+sid+'&limit=1');
      CURRENT_STAFF=rows[0]||null;
    }catch(e){CURRENT_STAFF=null;}
    return window.YANZ.canAccess('nsa');
  }

  function applyRoleClass(){
    const r=rootEl();if(!r)return;
    r.classList.remove('is-owner','is-staff');
    if(ROLE)r.classList.add('is-'+ROLE);
  }

  function renderAccessDenied(){
    const r=rootEl();if(!r)return;
    r.innerHTML=`<div class="card" style="text-align:center;padding:44px;max-width:520px;margin:24px auto">
      <div style="font-size:48px;margin-bottom:8px">🚫</div>
      <h2 style="font-size:18px;font-weight:800;margin-bottom:8px">Akses NSA Belum Diberikan</h2>
      <p style="font-size:13px;color:#666;line-height:1.5">Hai <strong>${window.YANZ.fullName||'staff'}</strong>, kamu belum di-grant akses ke modul NSA Import.<br>Minta Owner mengaktifkan lewat <strong>Tasks → Akses & Permission</strong> (permission <code>nsa_access</code>).</p>
    </div>`;
  }

  async function loadAll(){
    _lastRefresh=Date.now();
    setDB(false,'Menghubungkan…');
    try{
      [ACCOUNTS,ORDER_ITEMS,SETTLEMENTS,NSA_RECORDS]=await Promise.all([
        api('yanz_cash_accounts?is_active=eq.true&order=display_order'),
        api('yanz_order_items?order=created_at.desc&limit=2000'),
        api('yanz_marketplace_settlements?order=import_date.desc&limit=100'),
        api('yanz_order_nsa?order=created_at.desc&limit=2000')
      ]);
      setDB(true,'Terhubung ✓');
      fillSelects();
      renderDashboard();
      renderHistory();
      renderReview();
      renderApproval();
    }catch(e){setDB(false,'❌ '+e.message);console.error(e);}
  }

  function fillSelects(){
    const opts=ACCOUNTS.map(a=>`<option value="${a.id}" ${a.is_default?'selected':''}>${a.account_name}</option>`).join('');
    const el=document.getElementById('imp-account');if(el)el.innerHTML='<option value="">— Pilih akun —</option>'+opts;
  }

  // ── PLATFORM DETECTION ──
  function detectPlatformFromWorkbook(wb){
    const sheetNames=wb.SheetNames;
    if(sheetNames.includes('Detail pesanan'))return 'tiktok';
    // Shopee: template BARU pakai sheet 'Penghasilan', template lama pakai 'Income'.
    if(sheetNames.includes('Penghasilan')||sheetNames.includes('Income'))return 'shopee';
    return null;
  }

  function handleFileSelect(event){
    const file=event.target.files[0];
    if(!file)return;
    parseFile(file);
  }

  function attachDropZone(){
    const dz=document.getElementById('upload-zone');if(!dz)return;
    ['dragenter','dragover'].forEach(e=>dz.addEventListener(e,(ev)=>{ev.preventDefault();dz.classList.add('dragover');}));
    ['dragleave','drop'].forEach(e=>dz.addEventListener(e,(ev)=>{ev.preventDefault();dz.classList.remove('dragover');}));
    dz.addEventListener('drop',(ev)=>{ev.preventDefault();const file=ev.dataTransfer.files[0];if(file)parseFile(file);});
  }

  async function parseFile(file){
    const status=document.getElementById('parse-status');if(!status)return;
    status.innerHTML='<div class="alert-banner info">⏳ Membaca file <strong>'+file.name+'</strong>…</div>';
    try{
      if(typeof XLSX==='undefined'){status.innerHTML='<div class="alert-banner">❌ Library Excel (SheetJS) belum termuat. Cek koneksi internet lalu refresh.</div>';return;}
      const buffer=await file.arrayBuffer();
      const wb=XLSX.read(buffer,{type:'array'});
      const platform=detectPlatformFromWorkbook(wb);
      if(!platform){status.innerHTML='<div class="alert-banner">❌ <strong>File tidak dikenali.</strong> File harus berisi sheet "Detail pesanan" (TikTok) atau "Penghasilan"/"Income" (Shopee).</div>';return;}
      let records=[];
      if(platform==='tiktok')records=parseTikTok(wb);
      else if(platform==='shopee')records=parseShopee(wb);
      if(!records.length){status.innerHTML='<div class="alert-banner warn">⚠️ Tidak ada data ditemukan di file ini.</div>';return;}
      const matched=[],unmatched=[],pending=[],duplicate=[];
      // Order ID yang SUDAH pernah masuk import sebelumnya (settlement draft/confirmed, bukan rejected)
      // ATAU order_item-nya sudah ter-tag matched → tandai duplikat, jangan diproses 2x (cegah cash dobel
      // saat upload mingguan yang overlap, mis. tgl 7 muncul di file 1-7 dan 7-14).
      const liveSettleIds=new Set(SETTLEMENTS.filter(s=>s.status!=='rejected').map(s=>s.id));
      const seenRefs=new Set(NSA_RECORDS.filter(r=>liveSettleIds.has(r.settlement_id)).map(r=>r.order_ref));
      for(const rec of records){
        if(seenRefs.has(rec.order_ref)||ORDER_ITEMS.some(o=>o.order_ref===rec.order_ref&&o.nsa_status==='matched')){
          rec.match_status='duplicate';rec.review_reason='Order ID sudah pernah di-import sebelumnya — dilewati agar tidak dobel';
          duplicate.push(rec);continue;
        }
        const items=ORDER_ITEMS.filter(o=>o.order_ref===rec.order_ref&&o.nsa_status==='pending');
        if(items.length===0){unmatched.push({...rec,match_status:'unmatched'});}
        else{
          const grossRevenue=items.reduce((s,i)=>s+num(i.qty)*num(i.sell_price),0);
          rec.gross_revenue=grossRevenue;
          rec.matched_items=items.map(i=>i.id);
          if(rec.nsa_amount>grossRevenue*1.05){rec.match_status='pending_review';rec.review_reason=`NSA (${rpShort(rec.nsa_amount)}) > Gross (${rpShort(grossRevenue)}) — selisih anomali`;pending.push(rec);}
          else if(grossRevenue>0&&rec.nsa_amount<grossRevenue*0.3){rec.match_status='pending_review';rec.review_reason=`NSA (${rpShort(rec.nsa_amount)}) < 30% dari Gross (${rpShort(grossRevenue)}) — fee terlalu besar`;pending.push(rec);}
          else{rec.match_status='matched';matched.push(rec);}
        }
      }
      parsedData={platform,fileName:file.name,records,matched,unmatched,pending,duplicate,
        totalNSA:records.reduce((s,r)=>s+num(r.nsa_amount),0),
        totalGross:matched.reduce((s,r)=>s+num(r.gross_revenue),0)+pending.reduce((s,r)=>s+num(r.gross_revenue),0)};
      showPreview();
      status.innerHTML='<div class="alert-banner success">✓ File berhasil diparse — <strong>'+records.length+' records ditemukan</strong>. Review preview di bawah lalu konfirmasi import.</div>';
    }catch(e){status.innerHTML='<div class="alert-banner">❌ Error parsing file: '+e.message+'</div>';console.error(e);}
  }

  // Export TikTok/Shopee kadang punya <dimension> usang (mis. A1:X19) padahal data
  // aslinya jauh lebih banyak (A1:CB269) → SheetJS cuma baca sebatas dimension itu
  // (cuma 18 baris + kolom mentok X). Hitung ulang !ref dari sel yang benar-benar ada.
  function expandSheetRange(sheet){
    let maxR=0,maxC=0;
    for(const k in sheet){
      if(k[0]==='!')continue;
      const m=k.match(/^([A-Z]+)(\d+)$/);if(!m)continue;
      const r=parseInt(m[2],10),c=XLSX.utils.decode_col(m[1]);
      if(r>maxR)maxR=r;if(c>maxC)maxC=c;
    }
    if(maxR>0)sheet['!ref']=XLSX.utils.encode_range({s:{r:0,c:0},e:{r:maxR-1,c:maxC}});
    return sheet;
  }

  function parseTikTok(wb){
    const sheet=wb.Sheets['Detail pesanan'];if(!sheet)return [];
    expandSheetRange(sheet);
    const data=XLSX.utils.sheet_to_json(sheet,{header:1,defval:0});
    if(data.length<2)return [];
    const records=[];
    for(let i=1;i<data.length;i++){
      const row=data[i];if(!row||!row.length)continue;
      const orderId=String(row[0]||'').trim();if(!orderId||orderId==='0')continue;
      // Terima baris hanya jika kolom A = Order ID TikTok valid (18 digit angka).
      // Baris non-order (ringkasan, iklan, penyesuaian) otomatis ke-skip.
      // (Dulu pakai filter kata di kolom B — terlalu agresif, banyak baris order ikut terbuang → cuma 18 kebaca.)
      if(!/^\d{18}$/.test(orderId))continue;
      const nsa=num(row[5]);
      const komisi_platform=Math.abs(num(row[15]));
      const perkiraan_ongkir=Math.abs(num(row[33]));
      const komisi_dinamis=Math.abs(num(row[42]));
      const biaya_proses=Math.abs(num(row[46]));
      const komisi_affiliator=Math.abs(num(row[35]))+Math.abs(num(row[36]))+Math.abs(num(row[37]))+Math.abs(num(row[38]))+Math.abs(num(row[39]))+Math.abs(num(row[40]));
      const totalCosts=komisi_platform+perkiraan_ongkir+komisi_dinamis+biaya_proses+komisi_affiliator;
      records.push({order_ref:orderId,platform:'tiktok',nsa_amount:nsa,komisi_platform,perkiraan_ongkir,komisi_dinamis,biaya_proses,komisi_affiliator,total_marketplace_costs:totalCosts,order_date:row[2],paid_date:row[3]});
    }
    return records;
  }

  // Shopee mengubah template NSA. Nama sheet BISA 'Penghasilan' (ID) atau 'Income' (EN),
  // tapi layout-nya sama-sama versi baru: dipecah per baris ORDER & per baris SKU (1 pesanan
  // punya 2-4 baris SKU), dgn nilai finansial DIULANG di baris Order & tiap SKU pada kolom sama.
  // → Deteksi layout dari ISI header (bukan nama sheet), lalu HANYA proses baris "Order"
  //   (kolom "Lihat berdasarkan") supaya tidak dobel/triple. Kolom biaya dipetakan by NAMA
  //   header (tahan walau urutan kolom bergeser). Kalau header versi baru tak ada → format lama.
  function parseShopee(wb){
    const sheet=wb.Sheets['Penghasilan']||wb.Sheets['Income'];
    if(!sheet)return parseShopeeLegacy(wb);
    expandSheetRange(sheet);
    const data=XLSX.utils.sheet_to_json(sheet,{header:1,defval:0});
    if(data.length<2)return [];
    const norm=v=>String(v==null?'':v).trim().toLowerCase();
    // Nama header BISA Bahasa Indonesia ATAU Inggris (tergantung setting bahasa akun Shopee)
    // → semua pencocokan dibuat DWIBAHASA. Cari baris header versi baru: memuat kolom
    // "No. Pesanan"/"Order ID" DAN "Total Penghasilan"/"Total Released Amount".
    let hRow=-1;
    for(let i=0;i<Math.min(data.length,15);i++){
      const t=(data[i]||[]).map(norm);
      const hasOrder=t.indexOf('no. pesanan')>=0||t.indexOf('order id')>=0;
      const hasTotal=t.indexOf('total penghasilan')>=0||t.some(x=>x.indexOf('total released amount')>=0);
      if(hasOrder&&hasTotal){hRow=i;break;}
    }
    if(hRow<0)return parseShopeeLegacy(wb); // bukan layout baru → coba format lama
    const hdr=(data[hRow]||[]).map(norm);
    const colExact=(...names)=>{for(const n of names){const k=hdr.indexOf(n);if(k>=0)return k;}return -1;};
    const colLike=sub=>hdr.findIndex(x=>x.indexOf(sub)>=0);
    const iLihat=colExact('lihat berdasarkan','view by');
    const iOrder=colExact('no. pesanan','order id');
    let iNsa=colExact('total penghasilan'); if(iNsa<0)iNsa=colLike('total released amount');
    const iDo=colExact('waktu pesanan dibuat','order creation date');
    const iDp=colExact('tanggal dana dilepaskan','payout completed date');
    // Pemetaan kolom biaya → bucket, by NAMA header (DWIBAHASA, tahan geser kolom). CATATAN:
    // "Biaya Layanan"/"Service Fee" = duplikat agregat Gratis Ongkir XTRA → sengaja TIDAK dipetakan (cegah dobel).
    const isPlatform=h=>h==='biaya administrasi'||h==='commission fee';
    const isAffiliator=h=>h==='ams service fee'||h==='biaya kampanye'||h==='campaign fee'||h==='biaya komisi ams'||h==='ams commission fee';
    const isGratisXtra=h=>h.indexOf('gratis ongkir xtra')>=0||h.indexOf('free shipping xtra')>=0; // "Biaya Gratis Ongkir XTRA - Ukuran Biasa (D/H)"
    const isVoucher=h=>h.indexOf('penyesuaian penjual')>=0||h.indexOf('seller adjustment')>=0;     // voucher/diskon disponsori penjual saat event
    const isDinamis=h=>h==='premi'||h==='other fee'||h==='biaya transaksi'||h==='transaction fee';
    const isProses=h=>h==='biaya proses pesanan'||h==='seller order processing fee';
    const records=[];
    for(let i=hRow+1;i<data.length;i++){
      const row=data[i];if(!row||!row.length)continue;
      // Kalau ada kolom "Lihat berdasarkan": hanya baris "Order" (agregat pesanan), skip "Sku".
      if(iLihat>=0&&norm(row[iLihat])!=='order')continue;
      const orderId=String(row[iOrder]||'').trim();
      const lo=orderId.toLowerCase();
      if(!orderId||orderId==='0'||lo==='order'||lo==='sku'||lo.includes('total'))continue;
      const nsa=num(row[iNsa]); // Total Penghasilan = nilai bersih yang dilepas ke penjual
      let komisi_platform=0,komisi_affiliator=0,gratis_ongkir_xtra=0,voucher_seller=0,komisi_dinamis=0,biaya_proses=0;
      for(let c=0;c<hdr.length;c++){
        const h=hdr[c];if(!h)continue;
        const v=Math.abs(num(row[c]));if(!v)continue;
        if(isPlatform(h))komisi_platform+=v;
        else if(isAffiliator(h))komisi_affiliator+=v;
        else if(isGratisXtra(h))gratis_ongkir_xtra+=v;
        else if(isVoucher(h))voucher_seller+=v;
        else if(isDinamis(h))komisi_dinamis+=v;
        else if(isProses(h))biaya_proses+=v;
      }
      const perkiraan_ongkir=0; // ongkir riil (O/Q) net 0 → tak ada potongan ongkir biasa di Shopee
      const totalCosts=komisi_platform+perkiraan_ongkir+komisi_dinamis+biaya_proses+komisi_affiliator+gratis_ongkir_xtra+voucher_seller;
      records.push({order_ref:orderId,platform:'shopee',nsa_amount:nsa,komisi_platform,perkiraan_ongkir,komisi_dinamis,biaya_proses,komisi_affiliator,gratis_ongkir_xtra,voucher_seller,total_marketplace_costs:totalCosts,order_date:iDo>=0?row[iDo]:'',paid_date:iDp>=0?row[iDp]:''});
    }
    return records;
  }

  // Parser Shopee format LAMA (sheet 'Income', 1 baris/order, header di baris ke-7). Fallback.
  function parseShopeeLegacy(wb){
    const sheet=wb.Sheets['Income'];if(!sheet)return [];
    expandSheetRange(sheet);
    const data=XLSX.utils.sheet_to_json(sheet,{header:1,defval:0});
    if(data.length<7)return [];
    const records=[];
    for(let i=6;i<data.length;i++){
      const row=data[i];if(!row||!row.length)continue;
      const orderId=String(row[1]||'').trim();if(!orderId||orderId==='0')continue;
      if(orderId.toLowerCase().includes('total'))continue;
      const nsa=num(row[32]);
      const komisi_platform=Math.abs(num(row[23]));
      const perkiraan_ongkir=0;
      const komisi_dinamis=Math.abs(num(row[24]));
      const biaya_proses=Math.abs(num(row[25]));
      const komisi_affiliator=Math.abs(num(row[22]));
      const totalCosts=komisi_platform+perkiraan_ongkir+komisi_dinamis+biaya_proses+komisi_affiliator;
      records.push({order_ref:orderId,platform:'shopee',nsa_amount:nsa,komisi_platform,perkiraan_ongkir,komisi_dinamis,biaya_proses,komisi_affiliator,total_marketplace_costs:totalCosts,order_date:row[4],paid_date:row[6]});
    }
    return records;
  }

  function showPreview(){
    const ps=document.getElementById('preview-section');if(ps)ps.style.display='';
    const {platform,records,matched,unmatched,pending,duplicate=[],totalNSA,fileName}=parsedData;
    const pName=platform==='tiktok'?'🎵 TikTok Shop':'🛒 Shopee';
    const di=document.getElementById('detected-info');
    if(di)di.innerHTML=`<div class="platform-cards" style="grid-template-columns:1fr"><div class="platform-card active"><div class="pname">${pName} (auto-detected)</div><div class="pdesc">File: <strong>${fileName}</strong> · ${records.length} order ditemukan · Total NSA: <strong>${rp(totalNSA)}</strong></div></div></div>`;
    const set=(id,v)=>{const e=document.getElementById(id);if(e)e.textContent=v;};
    set('prev-total',records.length);set('prev-matched',matched.length);set('prev-pending',pending.length);set('prev-unmatched',unmatched.length);set('prev-duplicate',duplicate.length);
    // Yang perlu dicek (Unmatched/Review/Duplikat) SELALU tampil semua & ditaruh paling atas.
    // Baris Matched (aman) dibatasi MATCHED_LIMIT biar tabel tak kepanjangan saat file besar.
    const MATCHED_LIMIT=100;
    const attention=[...unmatched,...pending,...duplicate];
    const matchedShown=matched.slice(0,MATCHED_LIMIT);
    const hiddenMatched=matched.length-matchedShown.length;
    const allSorted=[...attention,...matchedShown];
    let table=`<table class="preview-table"><thead><tr><th>Status</th><th>Order ID</th><th class="num">Gross (YANZ)</th><th class="num">NSA (Excel)</th><th class="num">Selisih</th><th>Breakdown Costs</th></tr></thead><tbody>`;
    allSorted.forEach(r=>{
      const cls=r.match_status==='matched'?'matched':r.match_status==='unmatched'?'unmatched':r.match_status==='duplicate'?'duplicate':'pending';
      const statusLabel={matched:'✓ Match',unmatched:'✗ Unmatched',pending_review:'⏳ Review',duplicate:'🔁 Duplikat'}[r.match_status];
      const selisih=r.gross_revenue?r.gross_revenue-r.nsa_amount:null;
      const selisihTxt=selisih!==null?(selisih>0?`-${rpShort(selisih)}`:`+${rpShort(Math.abs(selisih))}`):'—';
      const selisihColor=selisih===null?'#888':selisih>0?'#DC2626':'#16A34A';
      const breakdown=`<span class="breakdown-pill" title="Komisi Platform">KP:${rpShort(r.komisi_platform)}</span>${r.perkiraan_ongkir>0?`<span class="breakdown-pill" title="Perkiraan Ongkir">O:${rpShort(r.perkiraan_ongkir)}</span>`:''}${r.komisi_dinamis>0?`<span class="breakdown-pill" title="Komisi Dinamis / Premi & Biaya Transaksi">KD:${rpShort(r.komisi_dinamis)}</span>`:''}<span class="breakdown-pill" title="Biaya Proses">BP:${rpShort(r.biaya_proses)}</span>${r.komisi_affiliator>0?`<span class="breakdown-pill" title="Komisi Affiliator">KA:${rpShort(r.komisi_affiliator)}</span>`:''}${r.gratis_ongkir_xtra>0?`<span class="breakdown-pill" title="Gratis Ongkir XTRA (Program Shopee)">GX:${rpShort(r.gratis_ongkir_xtra)}</span>`:''}${r.voucher_seller>0?`<span class="breakdown-pill" title="Pemberian Voucher (Seller)">V:${rpShort(r.voucher_seller)}</span>`:''}`;
      table+=`<tr class="${cls}"><td><span class="status-pill sp-${cls}">${statusLabel}</span></td><td><code style="font-size:11px">${r.order_ref}</code></td><td class="num">${r.gross_revenue?rp(r.gross_revenue):'—'}</td><td class="num">${rp(r.nsa_amount)}</td><td class="num" style="color:${selisihColor}">${selisihTxt}</td><td>${breakdown}${r.review_reason?`<div style="font-size:10px;color:#D97706;margin-top:3px">⚠️ ${r.review_reason}</div>`:''}</td></tr>`;
    });
    table+='</tbody></table>';
    if(hiddenMatched>0)table+=`<p style="font-size:11px;color:#888;margin-top:8px;text-align:center">Semua ${attention.length} record ✗ Unmatched / ⏳ Review / 🔁 Duplikat ditampilkan. ${hiddenMatched} baris ✓ Match lainnya disembunyikan (aman) — tampil ${matchedShown.length}/${matched.length}.</p>`;
    const ptw=document.getElementById('preview-table-wrap');if(ptw)ptw.innerHTML=table;
    const isd=document.getElementById('imp-settled-date');if(isd)isd.value=new Date().toISOString().split('T')[0];
  }

  function cancelImport(){
    parsedData=null;
    const ps=document.getElementById('preview-section');if(ps)ps.style.display='none';

    const fi=document.getElementById('file-input');if(fi)fi.value='';
